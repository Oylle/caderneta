    const vs = a.map(p => nx * p[0] + ny * p[1]), v1 = Math.max.apply(null, vs);
    const cortes = [Math.min.apply(null, vs)]; let ac = 0;
    fr.slice(0, -1).forEach(f => { ac += f; cortes.push(glBissecao(v => Math.abs(areaPol(glRecortar(a, nx, ny, v))), ac * total, cortes[cortes.length - 1], v1)); });
    cortes.push(v1);
    for (let k = 0; k < n; k++) partes.push(glRecortar(glRecortar(a, nx, ny, cortes[k], false), nx, ny, cortes[k + 1]));
  }
  const glebas = partes.map((pk, k) => {
    const ar = pk.length >= 3 ? Math.abs(areaPol(pk)) : 0;
    return {gleba:GL_NOMES[k], anel:pk.map(p => { const q = P.ll(p[0], p[1]); return [q.lon, q.lat]; }), areaHa:ar / 1e4, fracao:ar / total, forma:GL_FORMA[modo]};
  });
  const cl = c ? P.ll(c[0], c[1]) : null;
  return {glebas, centro:cl ? [cl.lon, cl.lat] : null, totalHa:total / 1e4, raioM:Math.sqrt(total / Math.PI), modo,
          rumo:((num(o.rumo, 0) % 360) + 360) % 360, inverter:!!o.inverter, fracoes:fr};
}
/* partes: [{aneis, gleba}] — cada gleba é uma parte (as sem nome ficam de fora) */
function glMarcarPartes(partes){
  const por = {};
  partes.forEach(p => {
    const g = normGleba(p.gleba); if (!g) return;
    if (por[g]) throw new Error("A " + g + " foi marcada em duas partes — cada gleba é uma parte.");
    por[g] = {gleba:g, anel:p.aneis[0], aneis:p.aneis, areaHa:areaHaLL(p.aneis[0]), forma:"parte"};
  });
  const nomes = Object.keys(por).sort();
  if (nomes.length > GL_MAX) throw new Error("No máximo " + GL_MAX + " glebas por campo.");
  const tot = nomes.reduce((s, g) => s + por[g].areaHa, 0) || 1;
  return nomes.map(g => Object.assign(por[g], {fracao:por[g].areaHa / tot}));
}
function glResumo(gl){ return gl.map(g => g.gleba + " " + fmtNum(g.areaHa, 1) + " ha (" + Math.round(g.fracao * 100) + "%)").join(" · "); }

/* ---------------------------------------------------------- limite: KML / KMZ / GeoJSON */
function detectarGleba(txt){
  const m = (" " + String(txt || "").toUpperCase()).match(/[^A-Z]G(?:LEBA)?[\s_\-]*0?(\d{1,2})(?!\d)/);
  return m ? "G" + (+m[1]) : "";
}
function lerKML(txt){
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("O arquivo KML está com defeito.");
  const out = [];
  const marcas = doc.getElementsByTagName("Placemark");
  for (let i = 0; i < marcas.length; i++) {
    const pm = marcas[i];
    const nomeEl = pm.getElementsByTagName("name")[0], descEl = pm.getElementsByTagName("description")[0];
    const nome = nomeEl ? nomeEl.textContent.trim() : "", desc = descEl ? descEl.textContent.trim() : "";
    const extra = Array.from(pm.getElementsByTagName("SimpleData")).concat(Array.from(pm.getElementsByTagName("Data")))
      .map(e => (e.getAttribute("name") || "") + " " + e.textContent).join(" ");
    const pols = pm.getElementsByTagName("Polygon");
    for (let j = 0; j < pols.length; j++) {
      const ob = pols[j].getElementsByTagName("outerBoundaryIs")[0] || pols[j];
      const co = ob.getElementsByTagName("coordinates")[0];
      if (!co) continue;
      const anel = co.textContent.trim().split(/\s+/).map(t => t.split(",").map(Number)).filter(v => v.length >= 2 && isFinite(v[0]) && isFinite(v[1])).map(v => [v[0], v[1]]);
      if (anel.length >= 3) out.push({nome: nome || ("Polígono " + (out.length + 1)), aneis:[anel], texto: nome + " " + desc + " " + extra});
    }
  }
  return out;
}
function lerGeoJSON(d){
  const out = [];
  const feats = d.type === "FeatureCollection" ? d.features : (d.type === "Feature" ? [d] : [{type:"Feature", geometry:d, properties:{}}]);
  feats.forEach((f, k) => {
    const g = f.geometry; if (!g) return;
    const props = f.properties || {};
    const nome = props.name || props.nome || props.Name || props.NOME || ("Polígono " + (k + 1));
    const texto = nome + " " + Object.keys(props).map(x => x + " " + props[x]).join(" ");
    const pols = g.type === "Polygon" ? [g.coordinates] : (g.type === "MultiPolygon" ? g.coordinates : []);
    pols.forEach(p => { const a = (p[0] || []).map(v => [v[0], v[1]]); if (a.length >= 3) out.push({nome:String(nome), aneis:[a], texto}); });
  });
  return out;
}
async function lerZipPrimeiroKML(buf){
  const v = new DataView(buf), u8 = new Uint8Array(buf);
  let fim = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  if (fim < 0) throw new Error("KMZ inválido.");
  const n = v.getUint16(fim + 10, true); let p = v.getUint32(fim + 16, true);
  for (let k = 0; k < n; k++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const metodo = v.getUint16(p + 10, true), tam = v.getUint32(p + 20, true);
    const ln = v.getUint16(p + 28, true), le = v.getUint16(p + 30, true), lc = v.getUint16(p + 32, true), off = v.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln));
    p += 46 + ln + le + lc;
    if (!/\.kml$/i.test(nome)) continue;
    const ln2 = v.getUint16(off + 26, true), le2 = v.getUint16(off + 28, true);
    const dados = u8.subarray(off + 30 + ln2 + le2, off + 30 + ln2 + le2 + tam);
    if (metodo === 0) return new TextDecoder().decode(dados);
    if (metodo === 8 && typeof DecompressionStream !== "undefined") {
      const s = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(s).text();
    }
    throw new Error("Este celular não consegue abrir KMZ. Salve como KML no Google Earth e tente de novo.");
  }
  throw new Error("Não achei o mapa (.kml) dentro do KMZ.");
}
async function lerArquivoLimite(arq){
  const nome = arq.name || "";
  let lista;
  if (/\.kmz$/i.test(nome)) lista = lerKML(await lerZipPrimeiroKML(await arq.arrayBuffer()));
  else {
    const txt = await arq.text();
    if (/^\s*[{[]/.test(txt)) lista = lerGeoJSON(JSON.parse(txt));
    else lista = lerKML(txt);
  }
  lista.forEach(x => { x.areaHa = areaHaLL(x.aneis[0]); x.gleba = detectarGleba(x.texto) || (lista.length === 1 ? detectarGleba(nome) : ""); });
  return lista.filter(x => x.areaHa > 0.05);
}

/* ---------------------------------------------------------- desenho do mapa */
const COR_PT = {r0:"var(--r0f)", r1:"var(--r1f)", r2:"var(--r2f)", r3:"var(--r3f)", rn:"var(--azul)"};
/* opc: {aneis, plano, trilha, pontos:[{n, lat, lon, cls, feito, sim}], marcas, eu:{lat,lon,acc}, alvoN, altura} */
function mapaSVG(opc){
  const L = 600;
  const todos = [];
  (opc.aneis || []).forEach(a => a.forEach(p => todos.push({lat:p[1], lon:p[0]})));
  if (opc.plano) opc.plano.pontos.forEach(p => todos.push(p));
  (opc.trilha || []).forEach(t => todos.push({lat:t[0], lon:t[1]}));
  (opc.pontos || []).forEach(p => todos.push(p));
  (opc.marcas || []).forEach(p => todos.push(p));
  if (opc.eu && (!todos.length || opc.incluirEu)) todos.push(opc.eu);
  if (!todos.length) return "";
  const lat0 = todos.reduce((s, p) => s + p.lat, 0) / todos.length, lon0 = todos.reduce((s, p) => s + p.lon, 0) / todos.length;
  const P = projetor(lat0, lon0);
  const xy = todos.map(p => P.xy(p.lat, p.lon));
  let x0 = Math.min.apply(null, xy.map(p => p[0])), x1 = Math.max.apply(null, xy.map(p => p[0]));
  let y0 = Math.min.apply(null, xy.map(p => p[1])), y1 = Math.max.apply(null, xy.map(p => p[1]));
  const lado = Math.max(x1 - x0, y1 - y0, 60), pad = lado * 0.08 + 8;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const asp = Math.min(1.25, Math.max(0.62, (y1 - y0 + 2 * pad) / Math.max(1, x1 - x0 + 2 * pad)));
  const W = L, H = Math.round(L * asp);
  const esc = Math.min(W / (x1 - x0 + 2 * pad || 1), H / (y1 - y0 + 2 * pad || 1));
  const X = (lat, lon) => { const q = P.xy(lat, lon); return [(W / 2 + (q[0] - cx) * esc), (H / 2 - (q[1] - cy) * esc)]; };
  const f = v => Math.round(v * 10) / 10;
  const pts = arr => arr.map(p => { const q = X(p.lat, p.lon); return f(q[0]) + "," + f(q[1]); }).join(" ");
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Mapa da inspeção">';
  s += '<rect width="' + W + '" height="' + H + '" fill="var(--sup3)"/>';
  (opc.aneis || []).forEach(a => {
    s += '<polygon points="' + pts(a.map(p => ({lat:p[1], lon:p[0]}))) + '" fill="var(--campo)" stroke="var(--tinta2)" stroke-width="2" stroke-linejoin="round"/>';
  });
  if (opc.plano) {
    s += '<polyline points="' + pts(opc.plano.linha) + '" fill="none" stroke="var(--azul)" stroke-width="2.5" stroke-dasharray="7 6" opacity=".75"/>';
    opc.plano.pontos.forEach((p, i) => {
      const q = X(p.lat, p.lon), alvo = opc.alvoN === i + 1;
      s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="' + (alvo ? 13 : 9) + '" fill="var(--sup)" stroke="' + (alvo ? "var(--polen-fill)" : "var(--azul)") + '" stroke-width="' + (alvo ? 4 : 2) + '" stroke-dasharray="' + (alvo ? "0" : "3 3") + '"/>';
      s += '<text x="' + f(q[0]) + '" y="' + f(q[1] + 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--azul)" font-family="var(--f-titulo)">' + (i + 1) + "</text>";
    });
  }
  if (opc.trilha && opc.trilha.length > 1)
    s += '<polyline points="' + pts(opc.trilha.map(t => ({lat:t[0], lon:t[1]}))) + '" fill="none" stroke="var(--gps)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>';
  (opc.marcas || []).forEach(m => {
    const q = X(m.lat, m.lon);
    s += '<rect x="' + f(q[0] - 6) + '" y="' + f(q[1] - 6) + '" width="12" height="12" rx="2" fill="' + (m.pol ? "var(--r3f)" : "var(--polen-fill)") + '" stroke="var(--sup)" stroke-width="1.5"/>';
  });
  (opc.pontos || []).forEach(p => {
    const q = X(p.lat, p.lon);
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="12" fill="' + (COR_PT[p.cls] || "var(--azul)") + '" stroke="var(--sup)" stroke-width="2.5"' + (p.sim ? ' stroke-dasharray="4 2"' : "") + "/>";
    s += '<text x="' + f(q[0]) + '" y="' + f(q[1] + 4.5) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="var(--f-titulo)">' + p.n + "</text>";
  });
  if (opc.eu) {
    const q = X(opc.eu.lat, opc.eu.lon), r = Math.max(8, (opc.eu.acc || 0) * esc);
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="' + f(Math.min(r, W)) + '" fill="var(--gps)" opacity=".16"/>';
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="8" fill="var(--gps)" stroke="#fff" stroke-width="3"/>';
  }
  // norte e escala
  s += '<g transform="translate(' + (W - 30) + ',34)"><path d="M0 -18 L8 6 L0 1 L-8 6 Z" fill="var(--tinta)"/><text y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tinta)" font-family="var(--f-titulo)">N</text></g>';
  const alvoM = (W * 0.28) / esc, pot = Math.pow(10, Math.floor(Math.log10(alvoM)));
  const passo = [1, 2, 5, 10].map(k => k * pot).filter(v => v <= alvoM).pop() || pot;
  const larg = passo * esc;
  s += '<g transform="translate(14,' + (H - 16) + ')"><rect x="0" y="-5" width="' + f(larg) + '" height="5" fill="var(--tinta)"/>';
  s += '<text x="' + f(larg + 6) + '" y="0" font-size="12" fill="var(--tinta)" font-family="var(--f-texto)">' + fmtDist(passo) + "</text></g>";
  return s + "</svg>";
}

/* ---------------------------------------------------------- gráfico de linhas (evolução) */
/* series: [{nome, cor, valores:[{x(dia), y}]}] ; eixoY em % */
function graficoSVG(series, opc){
  opc = opc || {};
  const W = 600, H = opc.altura || 190, mL = 40, mR = 14, mT = 12, mB = 26;
  const xs = [], ys = [];
  series.forEach(s => s.valores.forEach(v => { xs.push(v.x); ys.push(v.y); }));
  if (xs.length < 2) return "";
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) { x0 -= 1; x1 += 1; }
  const yMax = Math.max(10, Math.ceil(Math.max.apply(null, ys) / 10) * 10);
  const X = x => mL + (x - x0) / (x1 - x0) * (W - mL - mR), Y = y => mT + (1 - y / yMax) * (H - mT - mB);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + (opc.rotulo || "Evolução") + '">';
  for (let k = 0; k <= 4; k++) {
    const y = yMax * k / 4, yy = Y(y).toFixed(1);
    s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--linha)" stroke-width="1"/>';
    s += '<text x="' + (mL - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + fmtNum(y, 0) + "%</text>";
  }
  const dias = Array.from(new Set(xs)).sort((a, b) => a - b);
  const passo = Math.max(1, Math.ceil(dias.length / 6));
  dias.forEach((d, k) => { if (k % passo === 0 || k === dias.length - 1) s += '<text x="' + X(d).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + dataCurta(isoDeDia(d)) + "</text>"; });
  series.forEach(se => {
    const v = se.valores.slice().sort((a, b) => a.x - b.x);
    if (!v.length) return;
    if (v.length > 1) s += '<polyline points="' + v.map(p => X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ") + '" fill="none" stroke="' + se.cor + '" stroke-width="2.5" stroke-linejoin="round"/>';
    v.forEach((p, k) => { s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (k === v.length - 1 ? 4.5 : 3) + '" fill="' + se.cor + '"/>'; });
  });
  return s + "</svg>";
}

/* gps.js */
/* =====================================================================
   GPS — fica ligado enquanto você conta (watchPosition), grava a posição
   de cada ponto ao concluir, desenha a trilha andada e explica por que
   o GPS não funciona quando o navegador bloqueia. Sem GPS: simulação.
   ===================================================================== */
const GPS = {estado:"parado", motivo:"", ult:null, watch:null, sim:null, ouvintes:[], desde:0};
const MOTIVOS = {
  semHttps:"O app foi aberto como arquivo ou por um endereço sem https — o navegador só libera o GPS no app instalado por um endereço https (veja Dados › Instalar).",
  iframe:"Esta é a prévia aberta dentro de outra página (como o visualizador do Claude), que não libera o GPS. No app instalado no celular o GPS funciona. Aqui dá para usar a simulação.",
  negado:"A permissão de localização foi negada. Android: toque no cadeado ao lado do endereço › Permissões › Local › Permitir. iPhone: Ajustes › Privacidade › Serviços de Localização › Safari (ou Caderneta) › Ao Usar o App, com Localização Precisa ligada.",
  semAparelho:"Este navegador não tem acesso ao GPS.",
  semSinal:"O aparelho não achou a posição. Confira se a Localização está ligada no celular e espere alguns segundos a céu aberto."
};
function politicaBloqueia(){
  try { const p = document.permissionsPolicy || document.featurePolicy; return !!(p && p.allowsFeature && !p.allowsFeature("geolocation")); }
  catch (e) { return false; }
}
function emVisualizador(){
  try { if (window.self !== window.top) return true; } catch (e) { return true; }
  return !!(window.claude && typeof window.claude.use === "function");
}
function gpsDiagnostico(){
  if (!("geolocation" in navigator)) return {ok:false, estado:"indisponivel", motivo:MOTIVOS.semAparelho};
  if (politicaBloqueia() || (emVisualizador() && !window.isSecureContext)) return {ok:false, estado:"bloqueado", motivo:MOTIVOS.iframe};
  if (!window.isSecureContext) return {ok:false, estado:"bloqueado", motivo:MOTIVOS.semHttps};
  return {ok:true};
}
function avisarGPS(){ GPS.ouvintes.forEach(f => { try { f(); } catch (e) {} }); }
function gpsLigar(){
  if (GPS.sim) return;
  const d = gpsDiagnostico();
  if (!d.ok) { GPS.estado = d.estado; GPS.motivo = d.motivo; avisarGPS(); return; }
  if (GPS.watch != null) return;
  if (!GPS.ult) { GPS.estado = "pedindo"; GPS.motivo = "Procurando satélites…"; }
  GPS.desde = Date.now();
  try {
    GPS.watch = navigator.geolocation.watchPosition(gpsOk, gpsErro, {enableHighAccuracy:true, maximumAge:2000, timeout:30000});
  } catch (e) { GPS.estado = "erro"; GPS.motivo = String(e && e.message || e); }
  avisarGPS();
}
function gpsParar(){
  if (GPS.watch != null) { try { navigator.geolocation.clearWatch(GPS.watch); } catch (e) {} GPS.watch = null; }
}
function gpsDesligar(){ gpsParar(); if (!GPS.sim) { GPS.estado = "parado"; GPS.motivo = ""; } avisarGPS(); }
function gpsOk(pos){
  if (GPS.sim) return;
  const c = pos.coords;
  GPS.ult = {lat:c.latitude, lon:c.longitude, acc:c.accuracy || 0, t:Date.now(), alt:c.altitude, vel:c.speed, fonte:"gps"};
  GPS.estado = c.accuracy <= 15 ? "ok" : (c.accuracy <= 40 ? "fraco" : "ruim");
  GPS.motivo = "";
  registrarTrilha(GPS.ult);
  avisarGPS();
}
function gpsErro(e){
  if (GPS.sim) return;
  if (e && e.code === 1) {
    gpsParar();
    const pol = politicaBloqueia() || emVisualizador();
    GPS.estado = pol ? "bloqueado" : "negado"; GPS.motivo = pol ? MOTIVOS.iframe : MOTIVOS.negado;
  } else if (e && e.code === 2) {
    if (!GPS.ult) { GPS.estado = "sem-sinal"; GPS.motivo = MOTIVOS.semSinal; }
  } else if (!GPS.ult) { GPS.estado = "pedindo"; GPS.motivo = "Ainda procurando satélites…"; }
  avisarGPS();
}
function gpsFresco(maxMs){
  if (!GPS.ult) return null;
  return (Date.now() - GPS.ult.t) <= (maxMs || 20000) ? GPS.ult : null;
}
function gpsUmaVez(ms){
  return new Promise(res => {
    const f = gpsFresco(8000); if (f) return res(f);
    if (GPS.sim) return res(GPS.ult);
    const d = gpsDiagnostico(); if (!d.ok) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(p => {
        const c = p.coords;
        GPS.ult = {lat:c.latitude, lon:c.longitude, acc:c.accuracy || 0, t:Date.now(), fonte:"gps"};
        if (GPS.estado !== "ok") GPS.estado = c.accuracy <= 15 ? "ok" : (c.accuracy <= 40 ? "fraco" : "ruim");
        avisarGPS(); res(GPS.ult);
      }, e => { gpsErro(e); res(null); }, {enableHighAccuracy:true, timeout:ms || 15000, maximumAge:5000});
    } catch (e) { res(null); }
  });
}
function textoGPS(){
  const u = GPS.ult, velho = u && (Date.now() - u.t) > 45000;
  switch (GPS.estado) {
    case "ok": case "fraco": case "ruim": return velho ? "sem atualizar" : "±" + Math.round(u.acc) + " m";
    case "simulado": return "simulado";
    case "pedindo": return "GPS…";
    case "parado": return "GPS desl.";
    case "sem-sinal": return "sem sinal";
    default: return "sem GPS";
  }
}
function classeGPS(){
  const u = GPS.ult, velho = u && (Date.now() - u.t) > 45000;
  if (GPS.estado === "simulado") return "sim";
  if (GPS.estado === "ok") return velho ? "fraco" : "ok";
  if (GPS.estado === "fraco" || GPS.estado === "ruim") return "fraco";
  if (GPS.estado === "pedindo" || GPS.estado === "sem-sinal") return "busca";
  if (GPS.estado === "parado") return "";
  return "erro";
}

/* ---------------------------------------------------------------- trilha */
let tTrilha = null;
function registrarTrilha(fix){
  if (!DB.cfg.gpsTrilha || !fix) return;
  if (["insp", "ponto", "mapa"].indexOf(S.tela) < 0) return;
  const i = inspPor(S.inspId); if (!i) return;
  if (fix.fonte !== "simulado" && i.data !== hojeISO()) return;      // não mexe em inspeção antiga
  if (fix.acc > (DB.cfg.gpsPrecisao || 30)) return;
  const tr = i.trilha, u = tr[tr.length - 1];
  if (u && distM({lat:u[0], lon:u[1]}, fix) < 5) return;
  tr.push([+fix.lat.toFixed(7), +fix.lon.toFixed(7), Math.round(fix.t / 1000), Math.round(fix.acc), fix.fonte === "simulado" ? 1 : 0]);
  if (tr.length > 4000) tr.splice(0, tr.length - 4000);

/* metros andados (pela trilha) desde um instante; sem trilha, null */
/* v2.4: tempo da inspeção — do 1º ao último ponto concluído (o mesmo cálculo do PC, eficiencia.py) */
function eficienciaInsp(i){
  const pts = i.pontos.filter(p => p.feito && p.t).sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  const ini = pts[0].t, fim = pts[pts.length - 1].t, dur = (fim - ini) / 60;
  if (dur <= 0) return null;
  const tr = (i.trilha || []).filter(x => x[2] >= ini && x[2] <= fim);
  let km = null;
  if (tr.length >= 2) { km = 0; for (let k = 1; k < tr.length; k++) km += distM({lat:tr[k - 1][0], lon:tr[k - 1][1]}, {lat:tr[k][0], lon:tr[k][1]}) / 1000; }
  return {dur:dur, n:pts.length, porPonto:dur / (pts.length - 1), km:km, ini:ini, fim:fim};
}
function txtDuracao(min){ const h = Math.floor(min / 60), m = Math.round(min - h * 60); return h ? h + "h" + String(m).padStart(2, "0") : m + " min"; }
function andadoDesde(insp, tSeg){
  const tr = (insp.trilha || []).filter(t => t[2] >= tSeg);
  if (tr.length < 2) return null;
  let d = 0; for (let k = 1; k < tr.length; k++) d += distM({lat:tr[k - 1][0], lon:tr[k - 1][1]}, {lat:tr[k][0], lon:tr[k][1]});
  return d;
}
/* grava a posição no ponto (só melhora; coordenada digitada não é trocada) */
function gpsNoPonto(p, forcar){
  const f = gpsFresco(30000); if (!f) return false;
  if (p.gps && p.gps.fonte === "manual" && forcar !== "manual") return false;
  if (!forcar && p.gps && (p.gps.acc || 999) <= f.acc) return false;
  p.gps = {lat:+f.lat.toFixed(7), lon:+f.lon.toFixed(7), acc:Math.round(f.acc), t:f.t, fonte:f.fonte || "gps"};
  return true;
}

const SIM_BASE = {lat:-15.5605, lon:-54.2953};
function campoDaSimulacao(){
  const i = inspPor(S.inspId), c = i ? campoPor(i.campoId) : campoPor(S.campoId);
  if (c && formaDoCampo(c)) return c;
  const v = Object.assign({}, c || {}, {gleba:"", lat:SIM_BASE.lat, lon:SIM_BASE.lon, area:num(c && c.area) || 50, limite:null});
  if (c && c.lat != null) { v.lat = c.lat; v.lon = c.lon; }
  return v;
}
function alvoDaSimulacao(){
  const i = inspPor(S.inspId); const c = campoDaSimulacao();
  const n = i ? i.pontos.length : nPontosDoCampo(c);
  const pl = planoDoCampo(c, n || 15); if (!pl) return null;
  let k = 0;
  if (i) { const idx = S.tela === "ponto" && S.pontoIdx != null ? S.pontoIdx : i.pontos.findIndex(p => !pontoFeito(p)); k = idx < 0 ? n - 1 : idx; }
  return pl.pontos[Math.min(k, pl.pontos.length - 1)];
}
function gpsSimular(ligar){
  if (!ligar) {
    if (GPS.sim) clearInterval(GPS.sim.timer);
    GPS.sim = null; GPS.ult = null; GPS.estado = "parado"; GPS.motivo = "";
    avisarGPS();
    if (DB.cfg.gpsLigado) gpsLigar();
    return;
  }
  gpsParar();
  GPS.sim = {timer:null, pos:null};
  GPS.estado = "simulado"; GPS.motivo = "Posições inventadas para demonstração — não valem como dado de campo.";
  const passo = () => {
    const alvo = alvoDaSimulacao() || SIM_BASE;
    let p = GPS.sim.pos;
    if (!p) p = {lat:alvo.lat - 0.0006, lon:alvo.lon - 0.0005};
    const d = distM(p, alvo);
    if (d > 3) {
      const k = Math.min(1, 9 / d);
      p = {lat:p.lat + (alvo.lat - p.lat) * k, lon:p.lon + (alvo.lon - p.lon) * k};
    } else {
      p = {lat:alvo.lat + (Math.random() - 0.5) * 0.00002, lon:alvo.lon + (Math.random() - 0.5) * 0.00002};
    }
    GPS.sim.pos = p;
    GPS.ult = {lat:p.lat, lon:p.lon, acc:4 + Math.round(Math.random() * 3), t:Date.now(), fonte:"simulado"};
    registrarTrilha(GPS.ult);
    avisarGPS();
  };
  GPS.sim.timer = setInterval(passo, 1000);
  passo();
}

/* modo: "compartilhar" (menu do celular) ou "salvar" (Downloads). Devolve o que aconteceu. */
async function entregarArquivo(nome, texto, mime, modo){
  const blob = new Blob([texto], {type:mime + ";charset=utf-8"});
  if (emVisualizador() && window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl && dl.save) { await dl.save({filename:nome, data:texto}); return "salvo"; }
    } catch (e) { if (e && e.code === "declined") return "cancelado"; }
  }
  if (modo !== "salvar") {
    try {
      const f = new File([blob], nome, {type:mime});
      if (navigator.canShare && navigator.canShare({files:[f]}) && navigator.share) {
        await navigator.share({files:[f], title:nome});
        return "compartilhado";
      }
    } catch (e) { if (e && e.name === "AbortError") return "cancelado"; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return "baixado";
  } catch (e) {}
  copiarTexto(texto, "Conteúdo do arquivo");
  return "copiado";
}

/* próxima inspeção do campo pela data marcada na última (ou "hoje" se já foi feita hoje) */
function agendaDoCampo(c){
  const u = ultimaInsp(c.id), hoje = hojeISO();
  if (u && u.data === hoje) return {tipo:"feita", txt:"feita hoje"};
  /* v2.4: com a agenda do computador, vale a tarefa dele */
  const t = (DB.agenda || []).filter(x => /^(Contagem|Isolamento|Visita)/.test(x.fase) && !eventoDa(x) && campoDaTarefa(x) === c)
    .sort((a, b) => a.data < b.data ? -1 : 1)[0];
  if (t) {
    const d = diaNum(t.data) - diaNum(hoje);
    if (d < 0) return {tipo:"atrasada", txt:t.fase + " atrasada " + (-d) + " dia" + (d === -1 ? "" : "s"), d};
    if (d === 0) return {tipo:"hoje", txt:t.fase + " hoje", d};
    return {tipo:"futura", txt:t.fase + " " + dataCurta(t.data), d};
  }
  if (!u) return null;
  if (!u.proxima) return null;
  const fase = (() => { try { return contexto(u).fase.codigo; } catch (e) { return ""; } })();
  if (fase === "final") return {tipo:"fim", txt:"encerrar"};
  const d = diaNum(u.proxima) - diaNum(hoje);
  if (d < 0) return {tipo:"atrasada", txt:"atrasada " + (-d) + " dia" + (d === -1 ? "" : "s"), d};
  if (d === 0) return {tipo:"hoje", txt:"prevista hoje", d};
  return {tipo:"futura", txt:"próxima " + dataCurta(u.proxima), d};
}
function telaCampos(){

function graficoCampo(serie){

    (yMax > 0 ? '<div class="graf"><div class="rotulo" style="margin:8px 0 4px">F.F.P (%) — 0,10 / 0,20 / 0,30 são os limites de risco</div>' + graficoFFP(s) + "</div>" : "");
}
function graficoFFP(s){
  const W = 600, H = 140, mL = 40, mR = 14, mT = 10, mB = 24;
  const xs = s.map(x => diaNum(x.data));
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) { x0--; x1++; }
  const yMax = Math.max(0.4, Math.ceil(Math.max.apply(null, s.map(x => x.ffp || 0)) * 10 + 0.5) / 10);
  const X = x => mL + (x - x0) / (x1 - x0) * (W - mL - mR), Y = y => mT + (1 - y / yMax) * (H - mT - mB);
  let g = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="F.F.P por inspeção">';
  [[0, 0.10, "var(--r0s)"], [0.10, 0.20, "var(--r1s)"], [0.20, 0.30, "var(--r2s)"], [0.30, yMax, "var(--r3s)"]].forEach(([a, b, cor]) => {
    if (a >= yMax) return;
    g += '<rect x="' + mL + '" y="' + Y(Math.min(b, yMax)).toFixed(1) + '" width="' + (W - mL - mR) + '" height="' + (Y(a) - Y(Math.min(b, yMax))).toFixed(1) + '" fill="' + cor + '"/>';
  });
  [0, 0.1, 0.2, 0.3].filter(v => v <= yMax).forEach(v => { g += '<text x="' + (mL - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + fmtNum(v, 2) + "</text>"; });
  const pts = s.map(x => [X(diaNum(x.data)), Y(Math.min(yMax, x.ffp || 0))]);
  g += '<polyline points="' + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '" fill="none" stroke="var(--tinta)" stroke-width="2.2"/>';
  s.forEach((x, k) => { g += '<circle cx="' + pts[k][0].toFixed(1) + '" cy="' + pts[k][1].toFixed(1) + '" r="4.5" fill="var(--' + x.met.classe.css + 'f)" stroke="var(--tinta)" stroke-width="1.2"/>'; });
  const passo = Math.max(1, Math.ceil(s.length / 6));
  s.forEach((x, k) => { if (k % passo === 0 || k === s.length - 1) g += '<text x="' + pts[k][0].toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + dataCurta(x.data) + "</text>"; });
  return g + "</svg>";
}

    h += '<div class="cresce"><div class="rotulo">Próximo: ponto ' + d.alvoN + " (sugerido)</div>" +

      '<div class="peq mut">' + (dist < 15 ? "Pare e conte as plantas aqui." : "a " + direcao(r) + " (rumo " + Math.round(r) + "° do norte)") + "</div></div>";
  } else {
    h += '<div class="cresce"><div class="rotulo">Próximo: ponto ' + d.alvoN + '</div><div class="peq mut">Ligue o GPS para ver a distância até o ponto sugerido.</div></div>';
  }

}
function telaMapa(){

  let h = '<div class="cab"><div class="cresce"><h2>Mapa</h2><div class="sub">' + (i ? esc(nomeCampo(c)) + " · inspeção nº " + esc(i.numero) : (c ? esc(nomeCampo(c)) : "Abra uma inspeção para ver os pontos")) + "</div></div></div>";

  h += '<div id="alvo">' + htmlAlvo(i, d) + "</div>";

  h += '<div class="mapa" id="mapa-svg">' + (svg || '<div class="vazio"><h3>Nada para desenhar ainda</h3><p>Importe o limite do campo (KML) ou informe a coordenada do pivô e a área. Os pontos aparecem conforme o GPS grava cada um.</p></div>') + "</div>";
  h += '<div class="legenda"><span><i style="background:var(--azul)"></i>ponto contado</span><span><i style="background:var(--r3f)"></i>ponto com pendão polinizando</span>' +
    '<span><i style="background:transparent;border:2px dashed var(--azul)"></i>ponto sugerido</span><span><i style="background:var(--gps)"></i>você / trilha</span>' +
    '<span><i style="background:var(--polen-fill);border-radius:2px"></i>planta do caminhamento</span></div>';
  if (d.sim && !(c && formaDoCampo(c))) h += '<div class="nota">Simulação num pivô imaginário. Com o limite do campo importado, a simulação anda pelo campo de verdade.</div>';

    h += '<div class="cartao pad pilha" style="gap:10px"><div class="rotulo">Caminhamento sugerido</div>' +
      fSel("campo.caminho.forma", "Forma", FORMAS.map(f => [f[0], f[1]]), pl.forma) +
      '<div class="btns"><button class="btn peq" data-a="girar">' + ico("girar") + ' Girar 90°</button><button class="btn peq" data-a="inverter">Entrar do outro lado</button>' +
      '<button class="btn peq" data-a="espelhar">' + ico("espelho") + ' Espelhar</button><button class="btn peq" data-a="caminho-padrao">Padrão</button></div>' +
      '<p class="peq mut" style="margin:0">' + esc((FORMA[pl.forma] || FORMA.diamante)[1]) + " · entrada " + direcao(90 - pl.graus + 180) + " → " + direcao(90 - pl.graus) +
      " · ≈ " + fmtDist(pl.entre) + " andados entre pontos" + (cb ? " · pular " + cb.pularInt + " blocos" : "") + ". " +
      (pl.real ? "" : "Sem limite importado: o campo foi desenhado pela área.") + "</p></div>";
  }
  if (i) {
    const com = i.pontos.filter(p => p.gps);
    let t = '<div class="tab-wrap"><table><thead><tr><th>Ponto</th><th>Latitude</th><th>Longitude</th><th>±m</th><th>Origem</th><th></th></tr></thead><tbody>';
    com.forEach(p => { t += "<tr><td>" + p.i + "</td><td>" + p.gps.lat.toFixed(6) + "</td><td>" + p.gps.lon.toFixed(6) + "</td><td>" + (p.gps.acc ? Math.round(p.gps.acc) : "—") + "</td><td>" + esc(p.gps.fonte || "gps") + '</td><td><a target="_blank" rel="noopener" href="' + linkMapa(p.gps) + '">abrir</a></td></tr>'; });
    t += "</tbody></table></div>";
    const tr = i.trilha.length;
    t += '<div class="btns" style="margin-top:10px">' + (tr ? '<button class="btn peq" data-a="apagar-trilha">Apagar a trilha (' + tr + " posições)</button>" : "") +
      fChk("cfg.gpsTrilha", "Gravar a trilha andada", DB.cfg.gpsTrilha) + "</div>";
    h += sec("sec-coords", "Coordenadas", com.length + " de " + i.pontos.length + " pontos com posição", t);
  }
  return h + "</div>";
}

function telaRel(){

  let h = '<div class="cab">' + voltar("insp") + '<div class="cresce"><h2>Relatório nº ' + esc(i.numero) + '</h2><div class="sub">' + esc(nomeCampo(c)) + " · " + dataBR(i.data) + "</div></div></div>";

    '<div class="btns"><button class="btn pri" data-a="copiar-msg">' + ico("copiar") + ' Copiar</button>' +
    (navigator.share && !emVisualizador() ? '<button class="btn" data-a="compartilhar-msg">' + ico("compartilhar") + " Compartilhar</button>" : "") +
    '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">' + ico("conversa") + " WhatsApp</a></div></div>";

    '<p class="peq mut" style="margin:-6px 2px 0">O PDF sai pela impressão do celular: escolha “Salvar como PDF” (no iPhone: Compartilhar › Imprimir › abrir com dois dedos).</p>';
  h += sec("sec-medias", "Médias da contagem", m.n + " pontos · " + m.base + " plantas", tabelaMedias(m), {liso:true});
  h += sec("sec-por-ponto", "Ponto a ponto", "", tabelaPorPonto(i, c), {liso:true});
  const d = dadosDoMapa(i, c), svg = mapaSVG(Object.assign({}, d, {eu:null}));

function tabelaMedias(m){
  let h = '<div class="tab-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Sigla</th><th>Descrição</th><th>Soma</th><th>%</th></tr></thead><tbody>';
  const lin = (k, rot, desc, forte) => '<tr' + (forte ? ' class="tot"' : "") + "><td>" + esc(rot) + '</td><td class="txt">' + esc(desc) + "</td><td>" + (k === "FFP" ? CH_P.reduce((s, x) => s + (m.soma[x] || 0), 0) : (m.soma[k] == null ? "—" : m.soma[k])) + "</td><td>" + (m.get(k) == null ? "—" : fmtNum(m.get(k), k === "FFP" || ATIP_POL.indexOf(k) >= 0 ? 3 : 2)) + "</td></tr>";
  h += lin("FFP", "F.F.P", NOME.FFP, true) + lin("PT", "P.T.", NOME.PT) + lin("ER", "E.R.", NOME.ER);
  MACHOS.forEach(k => { if (m.pct[k] != null) h += lin(k, SIGLA[k], NOME[k]); });
  CH_BASE.forEach(k => { h += lin(k, SIGLA[k], NOME[k]); });
  CH_ATIP.forEach(k => { if (m.soma[k]) h += lin(k, SIGLA[k], NOME[k]); });
  if (m.soma.FP) h += lin("FP", "F.P.", NOME.FP);
  h += '<tr class="tot"><td>Base</td><td class="txt">plantas avaliadas</td><td>' + m.base + "</td><td>" + m.n + " pt</td></tr></tbody></table></div>";
  return h;
}
function tabelaPorPonto(i, c){
  const ppp = pppDo(c), nm = Math.max(1, Math.min(3, num(c.machos, 2) || 2));
  const cols = CH_BASE.filter(k => k.indexOf("PM") !== 0 || DB.cfg.mostrarPM || i.pontos.some(p => num(p.c[k]))).concat(["ER"], MACHOS.slice(0, nm), CH_ATIP.filter(k => i.pontos.some(p => num(p.c[k]))));
  let h = '<div class="tab-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Pt</th><th>Aval.</th><th>P.T.</th>' + cols.map(k => "<th>" + esc(SIGLA[k]) + "</th>").join("") + "<th>GPS</th></tr></thead><tbody>";
  i.pontos.forEach(p => {
    if (!pontoFeito(p)) { h += "<tr><td>" + p.i + '</td><td colspan="' + (cols.length + 3) + '" class="txt" style="color:var(--tinta3)">não contado</td></tr>'; return; }
    h += "<tr><td>" + p.i + "</td><td>" + plantasDoPonto(p, ppp) + "</td><td>" + ptDoPonto(p, ppp) + "</td>" +
      cols.map(k => '<td class="' + (num(p.c[k]) && (CH_P.indexOf(k) >= 0 || ATIP_POL.indexOf(k) >= 0) ? "pol" : "") + '">' + (num(p.c[k]) || "·") + "</td>").join("") +
      "<td>" + (p.gps ? "±" + Math.round(p.gps.acc || 0) : "—") + "</td></tr>";
  });
  return h + "</tbody></table></div>";
}

function estadoInstalacao(){
  const inst = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (inst) return {inst:true, curto:"instalado"};
  if (emVisualizador()) return {curto:"prévia"};
  if (!/^https?:$/.test(location.protocol)) return {curto:"aberto como arquivo"};
  return {curto:"no navegador"};
}

/* acoes.js */
/* =====================================================================
   AÇÕES — navegação (com o botão Voltar do celular), toques, digitação
   nos contadores, exportar/importar.
   ===================================================================== */
const PILHA = [];
const ULTIMA = {campos:"campos", contagem:"insp", mapa:"mapa", rel:"rel", dados:"dados"};
function estadoAtual(){ return {tela:S.tela, campoId:S.campoId, inspId:S.inspId, pontoIdx:S.pontoIdx}; }
function ir(tela, extra, opc){
  opc = opc || {};
  if (!opc.substituir) { PILHA.push(estadoAtual()); try { history.pushState({n:PILHA.length}, ""); } catch (e) {} }
  if (extra) Object.assign(S, extra);
  S.tela = tela;
  render();
  if (!opc.manterRolagem) window.scrollTo(0, 0);
}
window.addEventListener("popstate", () => {
  if (DLG.atual) { DLG.atual(null); try { history.pushState({n:PILHA.length}, ""); } catch (e) {} return; }
  const ant = PILHA.pop();
  if (ant) { Object.assign(S, ant); render(); window.scrollTo(0, 0); }
});
function voltarPara(para){
  if (PILHA.length) { history.back(); return; }
  const pai = {ponto:"insp", insp:"campo", campo:"campos", mapa:"insp", rel:"insp"}[S.tela] || "campos";
  ir(para || pai, null, {substituir:true});
}
function campoAtual(){
  if (S.tela !== "campo" && S.tela !== "campos" && S.tela !== "registro") { const i = inspPor(S.inspId); if (i) return campoPor(i.campoId); }
  return campoPor(S.campoId);
}
function inspMaisRecente(){ const l = DB.inspecoes.slice().sort((a, b) => (b.alterado || 0) - (a.alterado || 0)); return l[0] || null; }
function irAba(aba){
  const atual = ABA_DA_TELA[S.tela];
  if (aba === "campos") return ir(atual === "campos" ? "campos" : (ULTIMA.campos === "campo" && campoPor(S.campoId) ? "campo" : "campos"));
  if (aba === "agenda") return ir("agenda");
  if (aba === "contagem" || aba === "mapa" || aba === "rel") {
    if (!inspPor(S.inspId)) { const r = inspMaisRecente(); if (r) { S.inspId = r.id; S.campoId = r.campoId; S.pontoIdx = null; } }
    if (aba === "contagem") return ir(atual === "contagem" ? "insp" : (ULTIMA.contagem === "ponto" && inspPor(S.inspId) && S.pontoIdx != null ? "ponto" : "insp"));
    return ir(aba);
  }
  ir("dados");
}

/* ---------------------------------------------------------------- render */
function render(){
  retravarFora();
  const v = document.getElementById("tela");
  let h;
  try {
    switch (S.tela) {
      case "campo": h = telaCampo(); break;
      case "agenda": h = telaAgenda(); break;
      case "colheita": h = telaColheita(); break;
      case "registro": h = telaRegistro(); break;
      case "insp": h = telaInsp(); break;
      case "ponto": h = telaPonto(); break;
      case "mapa": h = telaMapa(); break;
      case "rel": h = telaRel(); break;
      case "dados": h = telaDados(); break;
      default: S.tela = "campos"; h = telaCampos();
    }
  } catch (e) {
    console.error(e);
    h = '<div class="nota erro"><b>Algo deu errado ao montar a tela.</b> Seus dados estão salvos. Toque em Campos e tente de novo.<br><span class="peq mono">' + esc(e && e.message) + "</span></div>";
  }
  if (SV.ok === false) h = '<div class="nota erro" style="margin-bottom:12px"><b>Este navegador não está guardando os dados</b> (' + esc(SV.erro || "") + "). Costuma ser aba anônima ou bloqueio de dados do site. Envie o arquivo para o computador antes de fechar.</div>" + h;
  v.innerHTML = h;
  v.classList.toggle("com-rodape", S.tela === "ponto");
  ULTIMA[ABA_DA_TELA[S.tela]] = S.tela;
  document.querySelectorAll("#abas button").forEach(b => b.setAttribute("aria-current", b.dataset.aba === ABA_DA_TELA[S.tela] ? "page" : "false"));
  pintarTopo();
  depoisDeRender();
}
function depoisDeRender(){
  if (S.tela === "insp") miniaturas();
  const comGPS = ["insp", "ponto", "mapa"].indexOf(S.tela) >= 0;
  if (comGPS && DB.cfg.gpsLigado && GPS.watch == null && !GPS.sim && ["negado", "bloqueado", "indisponivel"].indexOf(GPS.estado) < 0) gpsLigar();

}
function pintarTopo(){

let tGpsTela = 0;
GPS.ouvintes.push(() => {

/* ---------------------------------------------------------------- tema */
let temaPosto = false;
function aplicarTema(){
  const r = document.documentElement;
  if (DB.cfg.sol) { r.setAttribute("data-sol", "1"); r.setAttribute("data-theme", "light"); temaPosto = true; }
  else {
    r.removeAttribute("data-sol");
    if (DB.cfg.tema === "dark" || DB.cfg.tema === "light") { r.setAttribute("data-theme", DB.cfg.tema); temaPosto = true; }
    else if (temaPosto) { r.removeAttribute("data-theme"); temaPosto = false; }
  }
  const escuro = r.getAttribute("data-theme") === "dark" || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", escuro ? "#131A25" : "#FFFFFF");
  const bs = document.getElementById("b-sol"); if (bs) bs.setAttribute("aria-pressed", DB.cfg.sol ? "true" : "false");
}

/* ---------------------------------------------------------------- formulários (data-b) */
function alvoBind(path){
  const seg = path.split(".");
  let raiz = null;
  if (seg[0] === "campo") raiz = campoAtual();
  else if (seg[0] === "insp") raiz = inspPor(S.inspId);
  else if (seg[0] === "ponto") { const i = inspPor(S.inspId); raiz = i ? i.pontos[S.pontoIdx] : null; }
  else if (seg[0] === "cfg") raiz = DB.cfg;
  if (!raiz) return null;
  let o = raiz;
  for (let j = 1; j < seg.length - 1; j++) { if (o[seg[j]] == null || typeof o[seg[j]] !== "object") o[seg[j]] = {}; o = o[seg[j]]; }
  return {raiz, obj:o, chave:seg[seg.length - 1], tipo:seg[0]};
}
function valorDe(el){
  const t = el.dataset.t, v = el.value;
  if (t === "b") return el.checked;
  if (t === "n") return v.trim() === "" ? "" : num(v, "");
  if (t === "i") return v.trim() === "" ? "" : Math.round(num(v, 0));
  return v;
}
const RERENDER = ["insp.recomAuto", "cfg.mostrarPM", "cfg.mostrarFP", "cfg.msgRecomendacao", "campo.caminho.forma", "campo.machos", "campo.gleba",
                  "cfg.gpsTrilha", "cfg.msgDecimal", "cfg.msgProxima", "cfg.msgMaiusculas"];
function aoMudarBind(el, fim){
  const path = el.dataset.b, a = alvoBind(path);
  if (!a) return;
  if (path === "campo.coord") {
    const v = lerCoord(el.value);
    if (v) { a.raiz.lat = v[0]; a.raiz.lon = v[1]; } else if (!el.value.trim()) { a.raiz.lat = null; a.raiz.lon = null; } else return;
  } else {
    a.obj[a.chave] = valorDe(el);
  }
  if (path === "campo.caminho.forma") a.obj.graus = null;
  if (path === "campo.codigo") { a.raiz.codigo = fim ? normContrato(a.raiz.codigo) : String(a.raiz.codigo).toUpperCase().trimStart(); if (fim) el.value = a.raiz.codigo; }
  if (path === "campo.gleba") { a.raiz.gleba = fim ? normGleba(a.raiz.gleba) : String(a.raiz.gleba).toUpperCase().trim(); if (fim) el.value = a.raiz.gleba; }
  if (path === "insp.numero" && fim) {
    const ck = checarNumeroInsp(a.raiz, a.raiz.numero);
    if (ck.erro) { a.raiz.numero = a.raiz._numOk || ck.prox; el.value = a.raiz.numero; aviso(ck.erro, null, 6000); }
    else a.raiz._numOk = a.raiz.numero;
  }
  if (a.tipo === "insp" || a.tipo === "ponto") tocar(inspPor(S.inspId));
  if (a.tipo === "campo") a.raiz.alterado = Date.now();
  salvar();
  if (path === "cfg.sol") { aplicarTema(); return; }
  if (path === "cfg.gpsLigado") { if (DB.cfg.gpsLigado) gpsLigar(); else gpsDesligar(); }
  if (RERENDER.indexOf(path) >= 0 && fim) { render(); return; }
  atualizarVivo();
}

/* ---------------------------------------------------------------- contadores */
function objContador(ns){
  const i = inspPor(S.inspId); if (!i) return null;
  if (ns === "pt") { const p = i.pontos[S.pontoIdx]; return p ? p.c : null; }
  if (ns === "cam") return i.caminhamento;
  return null;
}
function mudarContador(ns, k, novo, doTeclado){
  const i = inspPor(S.inspId), obj = objContador(ns); if (!obj) return;
  novo = Math.max(0, Math.min(9999, Math.round(num(novo))));
  const antes = num(obj[k]);
  if (novo === antes) return;
  if (novo) obj[k] = novo; else delete obj[k];
  if (ns === "cam") marcasDoCaminhamento(i, k, novo - antes);
  tocar(i); salvar();
  const inp = document.getElementById("ct-" + ns + "-" + k);
  if (inp) { if (!doTeclado) inp.value = novo; inp.classList.toggle("zero", !novo); }
  atualizarVivo();
}
function marcasDoCaminhamento(i, k, delta){
  if (delta > 0) {
    const f = gpsFresco(30000); if (!f) return;
    for (let n = 0; n < Math.min(delta, 30); n++) i.marcas.push({k:k, lat:+f.lat.toFixed(7), lon:+f.lon.toFixed(7), acc:Math.round(f.acc), t:Date.now(), fonte:f.fonte});
  } else if (delta < 0) {
    let falta = -delta;
    for (let j = i.marcas.length - 1; j >= 0 && falta > 0; j--) if (i.marcas[j].k === k) { i.marcas.splice(j, 1); falta--; }
  }
}
let rep = null;
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".ct-b"); if (!b) return;
  const ct = b.closest(".ct"), d = b.dataset.a === "mais" ? 1 : -1;
  if (rep) clearTimeout(rep.t);
  rep = {b, n:0};
  const tick = () => {
    rep.n++;
    const obj = objContador(ct.dataset.ns); if (!obj) return;
    mudarContador(ct.dataset.ns, ct.dataset.k, num(obj[ct.dataset.k]) + d);
    rep.t = setTimeout(tick, rep.n > 8 ? 55 : 110);
  };
  rep.t = setTimeout(tick, 430);
  try { b.setPointerCapture(e.pointerId); } catch (x) {}
});
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => { if (rep) clearTimeout(rep.t); }));

/* ---------------------------------------------------------------- eventos de digitação */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.rb && el.tagName === "TEXTAREA" || (el.dataset && el.dataset.rb && el.type === "text")) { aoMudarReg(el); return; }
  if (el.id === "busca") { S.busca = el.value; const pos = el.selectionStart; render(); const nb = document.getElementById("busca"); if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (el.classList.contains("ct-n") && el.dataset.pf) { mudarPontoFixo(el); return; }
  if (el.classList.contains("ct-n")) {
    const ct = el.closest(".ct"); if (!ct) return;
    const limpo = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 4);
    if (limpo !== el.value) el.value = limpo;
    mudarContador(ct.dataset.ns, ct.dataset.k, limpo === "" ? 0 : +limpo, true);
    return;
  }
  if (el.id === "pt-aval") {
    const i = inspPor(S.inspId), p = i && i.pontos[S.pontoIdx]; if (!p) return;
    const limpo = el.value.replace(/\D/g, "").slice(0, 4); if (limpo !== el.value) el.value = limpo;
    p.avaliadas = limpo === "" ? null : +limpo; tocar(i); salvar(); atualizarVivo();
    return;
  }
  if (el.dataset.b && el.tagName !== "SELECT" && el.type !== "checkbox") aoMudarBind(el, false);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && (el.dataset.fotoRel || el.dataset.fotoLeg)) {
    const i = alvoFotos(), f = i && (i.fotos || []).find(x => x.id === (el.dataset.fotoRel || el.dataset.fotoLeg));
    if (f) { if (el.dataset.fotoRel) f.relatorio = el.checked; else f.legenda = el.value.trim(); tocar(i); salvar(); }
    return;
  }
  if (el.dataset && el.dataset.rb) { aoMudarReg(el); return; }
  if (el.dataset && el.dataset.b && (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "date" || el.type === "time")) aoMudarBind(el, true);
  else if (el.dataset && el.dataset.b) aoMudarBind(el, true);
});
let focoEm = 0;
function selecionarTudo(el){ try { el.select(); el.setSelectionRange(0, el.value.length); } catch (x) {} }
document.addEventListener("focusin", e => {
  const el = e.target;
  if (el.classList && (el.classList.contains("ct-n") || el.id === "pt-aval")) { focoEm = Date.now(); setTimeout(() => selecionarTudo(el), 0); }
});
document.addEventListener("pointerup", e => {
  const el = e.target;
  if (el.classList && (el.classList.contains("ct-n") || el.id === "pt-aval") && Date.now() - focoEm < 600) setTimeout(() => selecionarTudo(el), 0);
});
document.addEventListener("focusout", e => {
  const el = e.target;
  if (el.classList && el.classList.contains("ct-n") && !el.dataset.pf && el.value === "") el.value = "0";
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter" && el.classList && (el.classList.contains("ct-n") || el.id === "pt-aval")) {
    e.preventDefault();
    const todos = Array.from(document.querySelectorAll("#tela input.ct-n, #tela #pt-aval")).filter(x => x.offsetParent !== null);
    const k = todos.indexOf(el);
    if (k >= 0 && k < todos.length - 1) todos[k + 1].focus(); else el.blur();
  }
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (!d.matches || !d.matches("details.sec") || !d.id) return;
  if (d.open) { ABERTOS.add(d.id); ABERTOS.delete("-" + d.id); } else { ABERTOS.delete(d.id); ABERTOS.add("-" + d.id); }
}, true);
function mudarPontoFixo(el){
  const i = inspPor(S.inspId); if (!i) return;
  const k = el.dataset.pf, j = +el.dataset.j;
  const limpo = el.value.replace(/[^\d.,]/g, "").slice(0, 6); if (limpo !== el.value) el.value = limpo;
  const arr = i.pontoFixo[k] || (i.pontoFixo[k] = []);
  arr[j] = limpo === "" ? null : num(limpo);
  tocar(i); salvar();
  const med = pfMedia(arr), tot = arr.reduce((s, x) => s + num(x), 0);
  const t = document.getElementById("pf-t-" + k), m = document.getElementById("pf-m-" + k);
  if (t) t.textContent = med == null ? "—" : fmtNum(tot, 0);
  if (m) m.textContent = med == null ? "—" : fmtNum(med, 1);
}

function concluirPonto(){
  const i = inspPor(S.inspId); if (!i) return;
  const p = i.pontos[S.pontoIdx]; if (!p) return;
  const c = campoPor(i.campoId) || {};
  const av = plantasDoPonto(p, pppDo(c)), soma = somaPendoes(p);
  const seguir = () => {
    const primeira = !p.feito;
    p.feito = true;
    if (!p.t) p.t = Math.round(Date.now() / 1000);
    const pegou = (primeira || !p.gps) ? gpsNoPonto(p, p.gps && p.gps.fonte === "manual" ? false : true) : false;
    if (!pegou && !p.gps && (GPS.watch != null || GPS.sim)) {
      const alvo = p;
      gpsUmaVez(12000).then(f => { if (f && !alvo.gps) { gpsNoPonto(alvo, true); tocar(i); salvar(); } });
    }
    tocar(i); salvar(); vibrar();
    let prox = -1;
    for (let k = S.pontoIdx + 1; k < i.pontos.length; k++) if (!pontoFeito(i.pontos[k])) { prox = k; break; }
    if (prox < 0) prox = i.pontos.findIndex(x => !pontoFeito(x));
    const cbp = cbDoCampo(c, i.pontos.length);
    const txt = "Ponto " + p.i + " contado" + (p.gps ? " · ±" + Math.round(p.gps.acc || 0) + " m" : "") +
      (cbp && prox >= 0 ? " · Próximo: pule " + cbp.pularInt + " blocos (≈ " + fmtNum(cbp.metrosInt, 0) + " m)" : "");
    if (prox >= 0) { ir("ponto", {pontoIdx:prox}, {substituir:true}); aviso(txt); }
    else {
      if (!i.exemplo && !i.edicao) i.travada = true;      /* v2.4: concluída = travada */
      salvar();
      voltarPara("insp");
      /* o voltar de tela termina num evento do navegador (popstate), que fecha diálogo aberto:
         o convite para salvar a cópia só abre depois que a tela voltou */
      setTimeout(() => dialogo({titulo:"Todos os pontos contados",
        texto:"Salve uma cópia desta Caderneta fora do app" + (ehIOS() ? " (Compartilhar › Salvar em Arquivos)" : " (vai para a pasta Download)") +
              ". Se o celular quebrar ou os dados do navegador forem apagados, é ela que guarda as inspeções.",
        botoes:[{rotulo:"Depois", valor:null}, {rotulo:"Relatório", valor:"rel"}, {rotulo:"Salvar cópia", valor:"copia", classe:"pri"}]})
        .then(v => { if (v === "copia") salvarCopia(); else if (v === "rel") ir("rel"); }), 400);
    }
  };
  if (soma > av) {
    confirmar("A soma não fecha", "Os pendões anotados (" + soma + ") passam das plantas avaliadas (" + av + "). Concluir assim mesmo?", "Concluir").then(ok => { if (ok) seguir(); });
    return;
  }
  seguir();
}

/* ---------------------------------------------------------------- enviar ao PC */
async function enviarAoPC(modo){
  const tudo = !!(document.getElementById("enviar-tudo") || {}).checked;
  const novas = inspsParaEnviar();
  const soNovas = !tudo && novas.length > 0;
  const pac = pacoteParaPC(soNovas);
  pac.fotos = await fotosDoPacote(pac.inspecoes.concat(pac.registros || []));
  if (!pac.inspecoes.length && !pac.campos.length) { aviso("Nada para enviar — as inspeções de exemplo não vão para o PC"); return; }
  const nome = MARCA_ARQ + "caderneta_" + carimbo() + ".vana.json";
  const r = await entregarArquivo(nome, JSON.stringify(montarPacote(pac), null, 1), "application/json", modo);
  if (r === "cancelado") { aviso("Envio cancelado"); return; }
  marcarEnviadas(pac.inspecoes);
  render();
  const txt = {compartilhado:"Arquivo compartilhado", baixado:"Arquivo salvo em Downloads", salvo:"Arquivo salvo", copiado:"Conteúdo copiado"}[r] || "Arquivo gerado";
  aviso(txt + " · " + pac.inspecoes.length + " inspeção(ões)");
}

/* ---------------------------------------------------------------- receber */
async function receberArquivo(){
  const arq = await escolherArquivo(".json,application/json,text/plain");
  if (!arq) return;
  let d;
  try { d = JSON.parse(await lerTexto(arq)); } catch (e) { aviso("Esse arquivo não é um .json válido"); return; }
  return processarRecebido(d, arq.name || "arquivo");
}
/* v2.4: o que chegou do PC (arquivo ou Wi-Fi). silencioso = devolve o resumo em vez de mostrar */
async function processarRecebido(d, nomeArq, silencioso){
  if (d && d.formato === FORMATO_VANA) {      /* v2.4: confere o pacote antes de usar qualquer coisa dele */
    const a = abrirPacote(d);
    if (a.erro) { aviso(a.erro, null, 7000); return; }
    d = a.conteudo;
  }
  if (!TESTE && d && (d.teste === true || d.formato === FORMATO_PACOTE_TESTE)) { aviso("Esse arquivo é do ambiente de TESTE e não pode ser aberto aqui"); return; }
  d = desembrulharTeste(d);
  if (d && (d.formato === FORMATO_PACOTE || d.formato === FORMATO_PACOTE_TESTE)) {
    const up = (d.usuario && d.usuario.codigo) ? {codigo:String(d.usuario.codigo), nome:String(d.usuario.nome || "")} : null;
    let outro = false, extra = "";
    if (up && DB.usuario && DB.usuario.codigo !== up.codigo) {      /* campos de outro inspetor */
      const ok = await dialogo({titulo:"Campos de outro inspetor",
        texto:"Este arquivo é de " + (up.nome || up.codigo) + " (" + up.codigo + "). Esta Caderneta é de " + (DB.usuario.nome || DB.usuario.codigo) +
              ". Receber os campos dele para fazer inspeções para ele?",
        botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Receber", valor:true, classe:"pri"}]});
      if (!ok) return;
      outro = true;
    }
    await fazerCopia("antes de receber campos do PC");

function estadioTexto(v){
  if (!v) return "";
  if (typeof v === "string") return v.trim();
  const sel = v.sel || [];
  const ns = sel.filter(s => REG_FOLHAS.indexOf(s) >= 0).map(s => parseInt(s, 10)).sort((a, b) => a - b);
  const partes = [];
  if (ns.length === 1) partes.push(ns[0] + " FOLHA" + (ns[0] > 1 ? "S" : "") + " PARA ABRIR PENDÃO");
  else if (ns.length > 1) partes.push("DE " + ns[0] + " A " + ns[ns.length - 1] + " FOLHAS PARA ABRIR PENDÃO");
  sel.filter(s => REG_FOLHAS.indexOf(s) < 0).forEach(s => partes.push(s.toUpperCase()));
  const txt = partes.join(" E "), extra = (v.txt || "").trim();
  return (txt + (txt && extra ? ", " : "") + extra).trim();
}
function linhaCampoReg(r, c){

  if (safra) { const m = safra.match(/([A-Za-zÀ-ÿ]+)\s*(\d+)/); campo += m ? " " + m[1].toUpperCase() + ":" + m[2] : (/^\d+$/.test(safra) ? " VER:" + safra : " " + safra); }
  if (c && c.pivo) campo += " PIVÔ: " + c.pivo;
  if (r.gleba) { const m = String(r.gleba).match(/(\d+)/); campo += m ? " GLEBA-" + String(+m[1]).padStart(2, "0") : " " + r.gleba; }
  return campo;
}

    "CAMPO: " + linhaCampoReg(r, c), "HÍBRIDO: " + (d.hibrido || (c && c.hibrido) || "-"), "", "*OBSERVAÇÕES*"];

    let frase = "ISOLAMENTO MONITORADO EM RELAÇÃO " + quem;

    const t = estadioTexto(d[k]); if (t) L.push("", rot + ": " + t);

function mensagemSnpReg(lista){

  });
  return grupos.map(g => {

async function lerQrWifi(){

    botoes:[{rotulo:"Cancelar", valor:null}], aoAbrir:veu => {

async function pedirWifi(caminho, init){

    catch (e) { if (!espaco) throw e; r = await fetch(url, Object.assign({cache:"no-store"}, init || {})); }

        else if (e.target.dataset.glP != null) { st.pct[+e.target.dataset.glP] = e.target.value; pintar(veu); }
      });
      veu.addEventListener("click", e => {
        const b = e.target.closest("button[data-gl-n],button[data-gl-m],button[data-gl-sat]"); if (!b) return;
        if (b.dataset.glSat != null) { DB.cfg.glSat = b.dataset.glSat === "1"; salvar(); }
        if (b.dataset.glN) { st.n = +b.dataset.glN; if (st.pct.length > st.n) st.pct.length = st.n; }
        if (b.dataset.glM) st.modo = b.dataset.glM;
        montar(veu);
      });
    }});
  if (!r || !r.res) return;
  await aplicarDivisao(c, r.res.glebas, {modo:r.modo, n:r.res.glebas.length, rumo:Math.round(r.rumo * 10) / 10, inverter:r.inverter,
    fracoes:r.res.fracoes, pcts:r.modo === "meio" ? [] : r.pct.slice(0, r.n)});
}
function maiorAnelLL(aneis){ return aneis.reduce((m, a) => areaHaLL(a) > areaHaLL(m) ? a : m, aneis[0]); }
async function dividirPorPartes(c){
  const arq = await escolherArquivo(".kml,.kmz,.geojson,.json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz");
  if (!arq) return;
  let lista;
  try { lista = await lerArquivoLimite(arq); } catch (e) { aviso(e.message || "Não consegui ler o arquivo"); return; }
  if (!lista.length) { aviso("Nenhum polígono (área) no arquivo"); return; }
  if (lista.length > 12) lista = lista.slice(0, 12);
  const marc = lista.map((x, k) => x.gleba || (lista.length <= 4 ? GL_NOMES[k] : ""));
  const base = lista.map(x => maiorAnelLL(x.aneis));
  const pintar = veu => {
    let erro = "", gl = [];
    try { gl = glMarcarPartes(lista.map((x, k) => ({aneis:x.aneis, gleba:marc[k]}))); } catch (e) { erro = e.message; }
    const d = svgGlebas(base, lista.map((x, k) => ({anel:base[k], gleba:marc[k], areaHa:x.areaHa})), null);
    veu.querySelector("#gl-desenho").innerHTML = d.svg;
    veu.querySelector("#gl-erro").textContent = erro || (gl.length ? "" : "Marque pelo menos uma parte.");
    veu.querySelector("#gl-leg").textContent = gl.length ? glResumo(gl) : "";
    veu.querySelector("#gl-lista").innerHTML = lista.map((x, k) => '<div class="linha" style="gap:8px"><span class="cresce peq">' + esc(x.nome || "parte " + (k + 1)) + " · " + fmtNum(x.areaHa, 1) + ' ha</span><select data-gl-s="' + k + '">' +
      ['<option value="">fora</option>'].concat(GL_NOMES.map(g => '<option' + (marc[k] === g ? " selected" : "") + ">" + g + "</option>")).join("") + "</select></div>").join("");
    const ap = veu.querySelector('.btns button[data-k="1"]'); if (ap) ap.disabled = !!erro || !gl.length;
    veu.querySelectorAll("#gl-svg polygon[data-gl]").forEach(pg => pg.addEventListener("click", () => {
      const k = +pg.dataset.gl, i = GL_NOMES.indexOf(marc[k]); marc[k] = i < 0 ? "G1" : (i < 3 ? GL_NOMES[i + 1] : ""); pintar(veu);
    }));
  };
  const ok = await dialogo({titulo:"Marcar partes prontas", fecharFora:false,
    html:'<div class="pilha" style="gap:10px"><p class="peq mut" style="margin:0">' + esc(arq.name || "arquivo") + ": " + lista.length + " parte(s). Toque numa parte (ou escolha na lista) para dizer qual gleba é.</p>" +
      '<div id="gl-desenho"></div><div id="gl-leg" class="peq" style="text-align:center;font-weight:600"></div><div id="gl-erro" class="peq" style="color:var(--r3);min-height:1em"></div><div id="gl-lista" class="pilha" style="gap:6px"></div></div>',
    botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Aplicar", classe:"pri", valor:true}],
    aoAbrir:veu => { pintar(veu); veu.addEventListener("change", e => { if (e.target.dataset.glS != null) { marc[+e.target.dataset.glS] = e.target.value; pintar(veu); } }); }});
  if (!ok) return;
  let gl;
  try { gl = glMarcarPartes(lista.map((x, k) => ({aneis:x.aneis, gleba:marc[k]}))); } catch (e) { aviso(e.message); return; }
  if (!gl.length) return;
  await aplicarDivisao(c, gl, {modo:"partes", n:gl.length, arquivo:arq.name || ""});
}
/* grava a divisão: um campo por gleba (os que já existem ficam com o mesmo id — e as inspeções) */
async function aplicarDivisao(c, glebas, par){
  const em = Date.now(), antes = glebasDoCampo(c), novos = new Set(glebas.map(g => g.gleba));
  const sobram = antes.filter(x => !novos.has(normGleba(x.gleba)));
  const comInsp = sobram.filter(x => inspsDoCampo(x.id).length);
  const txt = glResumo(glebas) + (sobram.length ? ". " + sobram.map(x => x.gleba).join(", ") + (comInsp.length ? " continua(m) na lista (tem inspeções)" : " sai(em) da lista") : "") +
    (antes.length ? ". As inspeções já feitas continuam com a gleba delas." : ".");
  if (!(await confirmar("Aplicar a divisão?", txt, "Aplicar"))) return;
  await fazerCopia("antes de dividir em glebas");
  const dv = Object.assign({}, par, {em, origem:"celular"});
  const areaTot = areaPivoDo(c) || glebas.reduce((s, g) => s + g.areaHa, 0);
  glebas.forEach(g => {
    let x = antes.find(y => normGleba(y.gleba) === g.gleba);
    if (!x) {
      x = Object.assign(novoCampo(), clone(c), {id:uid(), gleba:g.gleba, origem:"celular", historico:[], nPontos:"", criado:em,
        caminho:{forma:"", graus:null, espelho:false}, divisao:null});
      DB.campos.push(x);
    }
    const aneis = (g.aneis || [g.anel]).map(a => a.map(p => [+(+p[0]).toFixed(7), +(+p[1]).toFixed(7)]));
    x.limite = aneis; x.limiteNome = GL_MODOS[par.modo] + (par.arquivo ? " · " + par.arquivo : "");
    x.area = +g.areaHa.toFixed(2); x.areaPivo = +num(areaTot).toFixed(2);
    const ct = centroLL(aneis); x.lat = +ct.lat.toFixed(6); x.lon = +ct.lon.toFixed(6);
    x.divisao = Object.assign({}, dv, {forma:g.forma}); x.alterado = em;
  });
  sobram.filter(x => !inspsDoCampo(x.id).length && x.origem === "celular").forEach(x => { DB.campos.splice(DB.campos.indexOf(x), 1); });
  c.divisao = Object.assign({}, dv, {glebas:glebas.map(g => g.gleba)}); c.alterado = em;
  salvar(); render(); aviso("Campo dividido: " + glebas.map(g => g.gleba).join(", "));
}

/* ---------------------------------------------------------------- cópias de segurança */
async function carregarCopias(){
  const el = document.getElementById("lista-copias"); if (!el) return;
  const todas = (await idbTodos("copias")).sort((a, b) => b.t - a.t);
  if (!document.getElementById("lista-copias")) return;
  if (!idb) { el.innerHTML = '<p class="peq mut" style="margin:0">Este navegador não deixa guardar cópias extras. Envie o arquivo para o computador com frequência.</p>'; return; }
  if (!todas.length) { el.innerHTML = '<p class="peq mut" style="margin:0">As cópias aparecem depois de alguns minutos de uso (uma a cada 3 minutos, guarda as 15 últimas).</p>'; return; }
  el.innerHTML = '<p class="peq mut" style="margin:0">Guardadas automaticamente neste aparelho. Se algo sumir, volte para uma delas.</p><div class="lista">' + todas.map(x =>
    '<div class="item" style="cursor:default"><div class="t1" style="font-size:16px">' + quandoTxt(x.t) + '</div><div class="t2">' + x.campos + " campo(s) · " + x.insps + " inspeção(ões)" + (x.motivo ? " · " + esc(x.motivo) : "") +
    '</div><div class="dir"><button class="btn peq" data-a="restaurar-copia" data-t="' + x.t + '">Voltar a esta</button></div></div>').join("") + "</div>";
}
async function restaurarCopia(t){
  const x = (await idbTodos("copias")).find(y => y.t === t); if (!x) { aviso("Cópia não encontrada"); return; }
  if (!(await confirmar("Voltar para a cópia de " + quandoTxt(t) + "?", "O que está agora no aparelho é guardado numa nova cópia antes.", "Voltar a esta"))) return;
  await fazerCopia("antes de restaurar");
  try { const cfg = DB.cfg; aplicar(JSON.parse(x.txt)); DB.cfg = Object.assign({}, CFG_PADRAO, DB.cfg, {tema:cfg.tema, sol:cfg.sol}); }
  catch (e) { aviso("Cópia ilegível"); return; }
  salvar(); S.campoId = S.inspId = null; PILHA.length = 0; ir("campos", null, {substituir:true}); aviso("Cópia restaurada");
}

/* =====================================================================
   INÍCIO — abre os dados, cria o exemplo na primeira vez, liga o modo
   instalável (sem internet) quando o app vem de um endereço https.
   ===================================================================== */
function semearExemplo(){
  const cLat = -15.5605, cLon = -54.2953, areaPivo = 100;
  const r = Math.sqrt(areaPivo * 1e4 / Math.PI), P = projetor(cLat, cLon);
  const meia = [];
  for (let k = 0; k <= 48; k++) { const a = Math.PI + Math.PI * k / 48; const q = P.ll(r * Math.cos(a), r * Math.sin(a)); meia.push([+q.lon.toFixed(7), +q.lat.toFixed(7)]); }
  const c = novoCampo();
  Object.assign(c, {codigo:"EXEMPLO", gleba:"G1", safra:"27", pivo:"3", fazenda:"Fazenda Exemplo", cooperante:"Cooperante Exemplo",
    municipio:"Primavera do Leste", estado:"MT", area:50, areaPivo:areaPivo, hibrido:"HIBRIDO 1234PRO3", proporcao:"4:1", machos:2,
    rc:"Representante Exemplo", at:"AT Exemplo", lat:cLat, lon:cLon, limite:[meia], limiteNome:"exemplo (meio pivô)",
    exemplo:true, origem:"celular", obs:"Campo fictício para mostrar o app. Apague em Dados › Apagar os dados de exemplo."});
  DB.campos.push(c);
  const plano = planoDoCampo(c, 15);
  const ruido = (p, k) => ({lat:p.lat + Math.sin(k * 7.3) * 0.00003, lon:p.lon + Math.cos(k * 5.1) * 0.00003});
  const montar = (numero, diasAtras, contagens, feitos, cam, extra) => {
    const i = novaInspecao(c);
    const t0 = Math.round(Date.now() / 1000) - diasAtras * 86400 - 3 * 3600;
    Object.assign(i, {numero:numero, data:somaDias(hojeISO(), -diasAtras), hora:"07:40", exemplo:true, enviadoEm:0,
      tempo:"Sol", temperatura:"Alta", ventos:"Leves"}, extra || {});
    i.trilha = [];
    i.pontos.forEach((p, k) => {
      if (k >= feitos) return;
      p.c = Object.assign({}, contagens[k]); p.feito = true; p.t = t0 + k * 240;
      const g = ruido(plano.pontos[k], k + numero);
      p.gps = {lat:+g.lat.toFixed(7), lon:+g.lon.toFixed(7), acc:4 + (k % 4), t:p.t * 1000, fonte:"exemplo"};
      const ant = k ? ruido(plano.pontos[k - 1], k - 1 + numero) : {lat:g.lat - 0.0004, lon:g.lon - 0.0006};
      for (let s = 1; s <= 6; s++) { const f = s / 6; i.trilha.push([+(ant.lat + (g.lat - ant.lat) * f).toFixed(7), +(ant.lon + (g.lon - ant.lon) * f).toFixed(7), p.t - 200 + s * 30, 5, 0]); }
    });
    i.caminhamento = cam;
    const ult = i.pontos[Math.max(0, feitos - 1)].gps;
    if (cam.PNP) i.marcas.push({k:"PNP", lat:ult.lat + 0.0002, lon:ult.lon - 0.0001, acc:5, t:Date.now(), fonte:"exemplo"});
    if (cam.RPF) i.marcas.push({k:"RPF", lat:ult.lat - 0.0001, lon:ult.lon + 0.0002, acc:5, t:Date.now(), fonte:"exemplo"});
    i.alterado = Date.now() - diasAtras * 86400000;
    DB.inspecoes.push(i);
    return i;
  };
  const er1 = [14, 18, 22, 19, 25, 27, 21, 24, 30, 26, 23, 28, 20, 25, 22], m11 = [22, 25, 30, 28, 31, 35, 27, 29, 33, 30, 26, 32, 24, 28, 27], m21 = [6, 8, 7, 9, 10, 12, 8, 7, 11, 9, 8, 10, 6, 7, 9];
  const c1 = er1.map((v, k) => ({ER:v, M1P:m11[k], M2P:m21[k], PNNP:[1, 0, 2, 0, 1, 0, 0, 1, 0, 2, 0, 1, 0, 0, 1][k], PBNP:[0, 1, 0, 0, 1, 0, 1, 0, 0, 0, 1, 0, 0, 1, 0][k], PNP:k === 6 ? 1 : 0}));
  montar(1, 2, c1, 15, {PNNP:12, PBNP:5, PNP:1}, {situacao:"Em despendoamento", proxima:hojeISO()});
  const er2 = [38, 44, 41, 47, 52, 49, 45, 50, 46], m12 = [46, 52, 49, 55, 58, 53, 51, 56, 54], m22 = [18, 21, 19, 24, 26, 22, 20, 25, 23];
  const c2 = er2.map((v, k) => ({ER:v, M1P:m12[k], M2P:m22[k], PNNP:[0, 1, 0, 2, 0, 1, 0, 0, 1][k], TCNP:[1, 0, 0, 0, 1, 0, 0, 0, 0][k], PSENP:k === 5 ? 1 : 0, PNP:k === 3 ? 1 : 0}));
  const i2 = montar(2, 0, c2, 9, {PNNP:7, PSENP:3, PNP:2, RPF:1}, {situacao:"Pleno florescimento", proxima:somaDias(hojeISO(), 2), hora:agoraHHMM()});
  return i2;
}

function montarCasca(){
  const abas = [["campos", "campos", "Campos"], ["agenda", "agenda", "Agenda"], ["contagem", "contagem", "Contagem"], ["mapa", "mapa", "Mapa"], ["rel", "relatorio", "Relatório"], ["dados", "dados", "Dados"]];
  document.getElementById("abas").innerHTML = abas.map(([a, i, r]) => '<button type="button" data-aba="' + a + '" aria-current="false">' + ico(i) + "<span>" + r + "</span>" + (a === "dados" ? '<span class="bolinha" hidden></span>' : "") + "</button>").join("");
  document.getElementById("marca").outerHTML = MARCA;
  document.getElementById("b-sol").innerHTML = ico("sol");
  if (TESTE) {
    const tn = document.querySelector(".topo-nome");
    if (tn) tn.insertAdjacentHTML("beforeend", '<span class="selo-teste">TESTE</span>');
  }
}

function registrarPWA(){
  if (emVisualizador() || !/^https?:$/.test(location.protocol)) return;
  const cab = document.head || document.getElementsByTagName("head")[0];
  if (cab && !document.querySelector('link[rel="manifest"]')) { const l = document.createElement("link"); l.rel = "manifest"; l.href = ARQ_MANIFEST; cab.appendChild(l); }
  if (cab && !document.querySelector('link[rel="apple-touch-icon"]')) { const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = "icone-180.png"; cab.appendChild(l); }
  if (!("serviceWorker" in navigator)) return;
  let recarregando = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (recarregando) return; recarregando = true; descarregar(); location.reload(); });
  navigator.serviceWorker.register(TESTE ? "sw.js?teste=1" : "sw.js").then(reg => {
    const oferecer = w => aviso("Versão nova do app pronta", {rotulo:"Atualizar", fn:() => w.postMessage("pular-espera")}, 15000);
    if (reg.waiting && navigator.serviceWorker.controller) oferecer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) oferecer(w); });
    });
  }).catch(() => {});
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); instalarEvt = e; if (S.tela === "dados") render(); });
window.addEventListener("appinstalled", () => { instalarEvt = null; aviso("App instalado"); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (["insp", "ponto", "mapa"].indexOf(S.tela) >= 0 && DB.cfg.gpsLigado && !GPS.sim) gpsLigar();
    manterTelaAcesa(S.tela === "ponto" || S.tela === "insp");
    pintarTopo();
  } else if (!GPS.sim) { gpsParar(); if (GPS.estado !== "negado" && GPS.estado !== "bloqueado") GPS.estado = GPS.ult ? GPS.estado : "parado"; }
});

async function iniciar(){
  SV.ok = testarArmazenamento() ? null : false;
  if (SV.ok === false) SV.erro = "aba anônima ou dados do site bloqueados";
  pedirPersistencia();
  let semeado = false;
  const local = lerLocal();
  /* v2.4: dados da versão anterior (2.3 ou 2.0) — guarda como estavam antes de atualizar */
  const anterior = local && local.versaoApp !== VERSAO_APP ? {txt:JSON.stringify(local), versao:local.versaoApp || "anterior",
    campos:(local.campos || []).length, insps:(local.inspecoes || []).length} : null;
  if (local) aplicar(local);
  else {
    const v1 = lerV1();
    if (v1 && aplicar(v1)) setTimeout(() => aviso("Dados da Caderneta anterior trazidos para esta versão"), 600);
  }
  if (!DB.campos.length && !DB.inspecoes.length && !DB.cfg.semExemplo) { semearExemplo(); semeado = true; }
  DB.inspecoes.forEach(retravar);           /* edição deixada aberta: trava ao reabrir o app */
  montarCasca();
  aplicarTema();
  try { history.replaceState({n:0}, ""); } catch (e) {}
  render();
  idb = await idbAbrir();
  SV.idb = !!idb;
  if (idb) {
    const txt = await idbGet("kv", "db");
    if (txt) {
      try {
        const d = JSON.parse(txt);
        const temDados = (d.campos || []).some(c => !c.exemplo) || (d.inspecoes || []).some(i => !i.exemplo);
        if (temDados && (semeado || (d.salvoEm || 0) > (DB.salvoEm || 0))) {
          aplicar(d); aplicarTema(); render(); aviso("Dados recuperados da cópia interna do aparelho");
        }
      } catch (e) {}
    }
    if (anterior) {
      await idbPut("copias", {t:Date.now() - 1, motivo:"antes de atualizar para a " + VERSAO_APP + " (dados da versão " + anterior.versao + ", como estavam)",
                              campos:anterior.campos, insps:anterior.insps, txt:anterior.txt});
      setTimeout(() => aviso("Caderneta atualizada para a " + VERSAO_APP + ". Os dados de antes ficaram guardados em Dados › Cópias."), 700);
    }
    DB.versaoApp = VERSAO_APP;
    gravarAgora();
    fazerCopia("ao abrir o app");
  } else { DB.versaoApp = VERSAO_APP; if (semeado || !local || anterior) gravarAgora(); }
  registrarPWA();
  setInterval(pintarTopo, 30000);
  if (copiaAtrasada()) setTimeout(() => aviso("Mais de 24 h sem cópia de segurança fora do app", {rotulo:"Salvar cópia", fn:salvarCopia}, 9000), 1500);
}
iniciar();

})();
