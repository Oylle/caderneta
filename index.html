/* cripto.js */
/* =====================================================================
   v2.5 — CHAVE DE PROTEÇÃO. Os arquivos que saem da Caderneta (para o PC e a cópia de
   segurança) vão criptografados com a chave do PC pareado: AES-256-GCM do próprio navegador
   (WebCrypto), com o conteúdo comprimido antes. A chave chega SÓ pelo QR code na tela do PC
   (troca pelo Wi-Fi, Menu › Usuário e aparelhos, ou o kit impresso) e fica neste aparelho.
   Mesmo formato do programa do PC (cronograma/cripto.py).
   ===================================================================== */
const FORMATO_CRIPTO = "vana-cripto", CRIPTO_ALG = "A256GCM", PREFIXO_CHAVE_QR = "VANA-CHAVE:";
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function b32Enc(u8){
  let bits = 0, val = 0, out = "";
  for (const b of u8) { val = ((val << 8) | b) & 0xFFFF; bits += 8; while (bits >= 5) { bits -= 5; out += B32[(val >> bits) & 31]; } }
  if (bits > 0) out += B32[(val << (5 - bits)) & 31];
  return out;
}
function b32Dec(txt){
  let t = String(txt || "").trim();
  if (t.toUpperCase().indexOf(PREFIXO_CHAVE_QR) === 0) t = t.slice(PREFIXO_CHAVE_QR.length);
  t = t.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (t.length !== 52 || /[^A-Z2-7]/.test(t)) return null;
  const out = new Uint8Array(32); let bits = 0, val = 0, k = 0;
  for (const ch of t) { val = ((val << 5) | B32.indexOf(ch)) & 0xFFFF; bits += 5; if (bits >= 8) { bits -= 8; if (k < 32) out[k++] = (val >> bits) & 255; } }
  return k === 32 ? out : null;
}
function u8B64(u8){
  let s = ""; const P = 0x8000;
  for (let i = 0; i < u8.length; i += P) s += String.fromCharCode.apply(null, u8.subarray(i, i + P));
  return btoa(s);
}
function b64U8(b64){ const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function kidDe(u8){
  const pre = new TextEncoder().encode("vana-chave"), tudo = new Uint8Array(pre.length + u8.length);
  tudo.set(pre); tudo.set(u8, pre.length);
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", tudo));
  return Array.from(h.slice(0, 6), b => b.toString(16).padStart(2, "0")).join("");
}
async function _fluxo(u8, tr){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(tr)).arrayBuffer()); }
function criptoDisponivel(){ return !!(window.crypto && crypto.subtle); }
async function cifrarTexto(txt, tipo, chave){
  let corpo = new TextEncoder().encode(txt), gz = false;
  if (typeof CompressionStream !== "undefined") { corpo = await _fluxo(corpo, new CompressionStream("gzip")); gz = true; }
  const kid = await kidDe(chave), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await crypto.subtle.importKey("raw", chave, {name:"AES-GCM"}, false, ["encrypt"]);
  const aad = new TextEncoder().encode(FORMATO_CRIPTO + "|1|" + tipo + "|" + kid + "|" + (gz ? 1 : 0));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv:iv, additionalData:aad}, k, corpo));
  const env = {formato:FORMATO_CRIPTO, versao:1, alg:CRIPTO_ALG, tipo:tipo, chave:kid, gz:gz};
  if (TESTE) env.teste = true;
  env.iv = u8B64(iv); env.dados = u8B64(ct);
  return env;
}
/* envelope -> texto. Erro com .semChave = código quando a chave não está aqui. */
async function abrirEnvelope(env, chaves){
  if (!(num(env.versao) <= 1) || env.alg !== CRIPTO_ALG) throw new Error("Esse arquivo protegido é de uma versão mais nova. Atualize a Caderneta.");
  const b32 = (chaves || {})[env.chave], chave = b32 ? b32Dec(b32) : null;
  if (!chave) { const e = new Error("Falta a chave " + String(env.chave || "").slice(0, 4).toUpperCase()); e.semChave = env.chave; throw e; }
  let corpo;
  try {
    const k = await crypto.subtle.importKey("raw", chave, {name:"AES-GCM"}, false, ["decrypt"]);
    const aad = new TextEncoder().encode(FORMATO_CRIPTO + "|1|" + env.tipo + "|" + env.chave + "|" + (env.gz ? 1 : 0));
    corpo = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64U8(env.iv), additionalData:aad}, k, b64U8(env.dados)));
  } catch (e) { throw new Error("O arquivo protegido chegou cortado ou foi alterado — nada foi aberto. Peça para enviar de novo."); }
  if (env.gz) {
    if (typeof DecompressionStream === "undefined") throw new Error("Este navegador não abre o arquivo comprimido. Atualize o Chrome.");
    corpo = await _fluxo(corpo, new DecompressionStream("gzip"));
  }
  return new TextDecoder().decode(corpo);
}
/* fim cripto.js */

/* =====================================================================
   v2.5 — SENHA (PIN) DO APP. Com o PIN ligado, tudo o que a Caderneta guarda no aparelho (dados,
   cópias automáticas e fotos) fica criptografado com uma chave aleatória (AES-256). Essa chave é
   guardada duas vezes, embrulhada: pelo PIN (PBKDF2, 600 mil voltas) e pela chave de proteção do
   PC pareado — esqueceu o PIN, a chave do PC (QR) destrava. O app pede o PIN ao abrir e depois de
   15 minutos fora.
   ===================================================================== */
const PIN = {meta:null, dek:null, raw:null, seq:0, escondido:0};
const PIN_VOLTAS = 600000, PIN_MIN = 15, CHAVE_PIN = CHAVE + ".pin";
function pinMeta(){ try { const t = localStorage.getItem(CHAVE_PIN); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function pinMetaGravar(m){
  try { if (m) localStorage.setItem(CHAVE_PIN, JSON.stringify(m)); else localStorage.removeItem(CHAVE_PIN); } catch (e) {}
  PIN.meta = m;
  if (typeof idb !== "undefined" && idb) idbPut("kv", m ? JSON.stringify(m) : "", "pin");     /* cópia: o navegador pode limpar só um dos dois */
}
async function _kekPin(pin, sal, voltas){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pin)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:sal, iterations:voltas, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
}
async function _embrulhar(kek, raw, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv, additionalData:new TextEncoder().encode(aad)}, kek, raw);
  return {iv:u8B64(iv), w:u8B64(new Uint8Array(ct))};
}
async function _desembrulhar(kek, e, aad){
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64U8(e.iv), additionalData:new TextEncoder().encode(aad)}, kek, b64U8(e.w)));
}
async function _usarDek(raw){
  PIN.raw = raw;
  PIN.dek = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt", "decrypt"]);
}
async function _embrulharPC(m){
  const ch = chaveAtualU8();
  if (!ch || !PIN.raw) { delete m.pc; return m; }
  const k = await crypto.subtle.importKey("raw", ch, {name:"AES-GCM"}, false, ["encrypt"]);
  m.pc = Object.assign({kid:DB.chaveAtual}, await _embrulhar(k, PIN.raw, "vana-pin-pc"));
  return m;
}
async function pinAbrir(pin){
  const m = PIN.meta || pinMeta(); if (!m) return true;
  try { await _usarDek(await _desembrulhar(await _kekPin(pin, b64U8(m.sal), m.voltas), m.pin, "vana-pin")); return true; }
  catch (e) { return false; }
}
async function pinAbrirComChave(txt){
  const m = PIN.meta || pinMeta(); if (!m || !m.pc) return false;
  const u8 = b32Dec((String(txt).match(/[#&]k=([A-Za-z2-7]{52})/) || [])[1] || txt); if (!u8) return false;
  try {
    const k = await crypto.subtle.importKey("raw", u8, {name:"AES-GCM"}, false, ["decrypt"]);
    await _usarDek(await _desembrulhar(k, m.pc, "vana-pin-pc")); return true;
  } catch (e) { return false; }
}
async function pinDefinir(novo){
  const sal = crypto.getRandomValues(new Uint8Array(16));
  const m = {v:1, voltas:PIN_VOLTAS, sal:u8B64(sal), pin:await _embrulhar(await _kekPin(novo, sal, PIN_VOLTAS), PIN.raw, "vana-pin")};
  pinMetaGravar(await _embrulharPC(m));
}
async function cifrarLocal(txt){
  let corpo = new TextEncoder().encode(txt), gz = false;
  if (typeof CompressionStream !== "undefined") { corpo = await _fluxo(corpo, new CompressionStream("gzip")); gz = true; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, PIN.dek, corpo));
  return {cifrado:1, v:1, gz:gz, iv:u8B64(iv), dados:u8B64(ct)};
}
async function decifrarLocal(env){
  if (!PIN.dek) throw new Error("bloqueado");
  let corpo = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64U8(env.iv)}, PIN.dek, b64U8(env.dados)));
  if (env.gz) corpo = await _fluxo(corpo, new DecompressionStream("gzip"));
  return new TextDecoder().decode(corpo);
}
/* migra o que está no aparelho para criptografado (ligar) ou aberto (desligar) */
async function pinMigrar(cifrar){
  for (const r of await idbTodos("fotos")) {
    if (cifrar && r.blob && !r.cifra) await fotoPut(r);
    else if (!cifrar && r.cifra) { const a = await fotoGet(r.id); if (a) await idbPut("fotos", a); }
  }
  for (const c of await idbTodos("copias")) {
    try {
      const d = JSON.parse(c.txt);
      if (cifrar && !d.cifrado) await idbPut("copias", Object.assign({}, c, {txt:JSON.stringify(await cifrarLocal(c.txt))}));
      else if (!cifrar && d.cifrado) await idbPut("copias", Object.assign({}, c, {txt:await decifrarLocal(d)}));
    } catch (e) {}
  }
}
async function pinLigar(){

async function pinTrocar(){

async function pedirNumero(titulo, texto){

/* tela do PIN (ao abrir e na volta depois de 15 min). Devolve quando destravar. */
function telaPin(primeira){

      const m = PIN.meta || pinMeta();

document.addEventListener("visibilitychange", () => {

function chaveAtualU8(){ return (DB.chaveAtual && DB.chaves && DB.chaves[DB.chaveAtual]) ? b32Dec(DB.chaves[DB.chaveAtual]) : null; }
async function parearChave(texto, sem){
  const u8 = b32Dec(texto); if (!u8) return null;
  const kid = await kidDe(u8);
  DB.chaves = DB.chaves || {};
  const antes = DB.chaveAtual && DB.chaves[DB.chaveAtual] ? DB.chaveAtual : "";
  DB.chaves[kid] = b32Enc(u8);
  /* v2.5: a Caderneta já usava a chave de OUTRO computador (outra instalação, pasta de teste…):
     pergunta antes de trocar — senão os próximos arquivos só abrem no computador novo */
  let usar = true;
  if (antes && antes !== kid && !sem) {
    const v = await dialogo({titulo:"Chave de outro computador",
      texto:"Esta Caderneta manda os arquivos com a chave " + antes.slice(0, 4).toUpperCase() + ". A chave lida agora é a " + kid.slice(0, 4).toUpperCase() +
            ", de outro computador (ou de outra instalação do Vana).\n\nPassar a usar a nova? Se não, ela fica guardada só para abrir os arquivos daquele computador.",
      botoes:[{rotulo:"Só guardar", valor:"guardar"}, {rotulo:"Usar a " + kid.slice(0, 4).toUpperCase(), valor:"usar", classe:"pri"}]});
    usar = v === "usar";
  }
  if (usar) DB.chaveAtual = kid;
  salvar();
  if (PIN.meta && PIN.raw) pinMetaGravar(await _embrulharPC(Object.assign({}, PIN.meta)));   /* v2.5: esqueci o PIN -> chave do PC */
  return kid;
}
/* texto do arquivo que sai: protegido se houver chave; null se não houver e a pessoa cancelar */
async function textoProtegido(pac, perguntar){

      botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Enviar sem proteção", valor:"sem"}, {rotulo:"Parear agora", valor:"parear", classe:"pri"}]});

async function pedirChave(motivo, modo){

    botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Usar esta chave", valor:"ok", classe:"pri", coletar:veu => veu.querySelector("#ch-txt").value}]});

async function abrirProtegido(env){

function nPontosDoCampo(c){ return Math.round(num(c && c.nPontos)) || pontosRecomendados(c && c.area); }

/* v2.4: largura do bloco = (fileiras de fêmea + de macho) × espaçamento — de um macho ao outro.
   Vale a largura informada no campo; sem ela, a conta pela proporção (ex.: 4:1) e pelo espaçamento. */
function larguraPelaProporcao(prop, esp){
  const ns = String(prop || "").match(/\d+(?:[.,]\d+)?/g);
  let e = num(esp, 0);
  if (!ns || !e) return 0;
  if (e > 3) e = e / 100;                         /* espaçamento digitado em cm */
  const fil = ns.reduce((s, x) => s + num(x, 0), 0);
  return fil > 0 ? Math.round(fil * e * 1000) / 1000 : 0;
}
function larguraDo(c){ return num(c && c.larguraBloco, 0) || larguraPelaProporcao(c && c.proporcao, c && c.espacamento) || DB.cfg.larguraBloco || LARGURA_BLOCO; }
/* blocos a pular do campo (com a forma da gleba, se ela veio de uma divisão) */
function cbDoCampo(c, n){
  const dv = c && c.divisao, forma = c && c.gleba && dv && dv.forma;
  const opt = forma ? {areaGleba:num(c.area), forma:forma} : {};
  if (forma === "faixa" || forma === "parte") { const pl = planoDoCampo(c, n || nPontosDoCampo(c)); if (pl && pl.campo) opt.extensao = pl.campo; }
  return caminhamentoBlocos(areaPivoDo(c), larguraDo(c), n || nPontosDoCampo(c), !!(c && c.gleba), true, opt);
}
function areaPivoDo(c){
  if (!c) return 0;
  if (num(c.areaPivo)) return num(c.areaPivo);
  return c.gleba ? num(c.area) * 2 : num(c.area);
}

function itemDeInsp(i, campo){

function metDeHistorico(h){

             pct:Object.assign({}, h.pct || {}), fora:{}};
  const met = completar(m);
  met.fora = {};
  CH_FORA.forEach(k => { const v = num(h.fora && h.fora[k]); if (v) met.fora[k] = v; });
  const f = ks => ks.reduce((s, k) => s + (met.fora[k] || 0), 0);

  (campo.historico || []).forEach(h => {
    if (!h || !h.data || ja.has(num(h.numero) + "|" + h.data)) return;

/* ----------------------------------------------------------- IndexedDB */
let idb = null;
function idbAbrir(){
  return new Promise(res => {
    try {
      if (!window.indexedDB) return res(null);
      const r = indexedDB.open(NOME_IDB, 3);         /* v3 (2.4): loja "fotos" */
      r.onupgradeneeded = () => {
        const d = r.result;
        try { if (!d.objectStoreNames.contains("fotos")) d.createObjectStore("fotos", {keyPath:"id"}); } catch (e) {}
        try { if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); } catch (e) {}
        try { if (!d.objectStoreNames.contains("copias")) d.createObjectStore("copias", {keyPath:"t"}); } catch (e) {}
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
      setTimeout(() => res(null), 4000);
    } catch (e) { res(null); }
  });
}
function idbGet(loja, chave){
  return new Promise(res => {
    if (!idb) return res(null);
    try {
      const q = idb.transaction(loja, "readonly").objectStore(loja).get(chave);
      q.onsuccess = () => res(q.result == null ? null : q.result);
      q.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbPut(loja, valor, chave){
  return new Promise(res => {
    if (!idb) return res(false);
    try {
      const tx = idb.transaction(loja, "readwrite");
      if (chave === undefined) tx.objectStore(loja).put(valor); else tx.objectStore(loja).put(valor, chave);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbTodos(loja){
  return new Promise(res => {
    if (!idb) return res([]);
    try {
      const q = idb.transaction(loja, "readonly").objectStore(loja).getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => res([]);
    } catch (e) { res([]); }
  });
}
function idbApagar(loja, chave){
  return new Promise(res => {
    if (!idb) return res(false);
    try {
      const tx = idb.transaction(loja, "readwrite");
      tx.objectStore(loja).delete(chave);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}

function gravarTexto(txt){
  let ok = false;

  catch (e) { SV.erro = (e && e.name === "QuotaExceededError") ? "memória do navegador cheia" : "o navegador bloqueou"; }
  if (idb) { idbPut("kv", txt, "db").then(r => { if (r && !ok) { SV.ok = true; SV.erro = ""; SV.soIdb = true; pintarTopo(); } }); }
  SV.ok = ok || (SV.idb && !!idb); SV.quando = Date.now();
  if (ok) SV.erro = "";
  pintarTopo();
  agendarCopia();
}
function agendarCopia(){
  if (tCopia) return;
  const espera = Math.max(5000, 180000 - (Date.now() - ultimaCopia));
  tCopia = setTimeout(() => { tCopia = null; fazerCopia(""); }, espera);
}
async function fazerCopia(motivo){
  if (!idb) return;
  ultimaCopia = Date.now();
  let txt = JSON.stringify(DB);
  if (PIN.dek) txt = JSON.stringify(await cifrarLocal(txt));
  await idbPut("copias", {t:Date.now(), motivo:motivo || "", campos:DB.campos.length, insps:DB.inspecoes.length, txt:txt});
  const todas = (await idbTodos("copias")).sort((a, b) => a.t - b.t);
  for (let k = 0; k < todas.length - 15; k++) await idbApagar("copias", todas[k].t);
}

function aplicar(d){
  if (!d || typeof d !== "object") return false;
  if (d.versao === 2 || d.formato === FORMATO && d.versao >= 2) {
    const n = novoDB();
    n.aparelho = d.aparelho || n.aparelho;
    n.usuario = (d.usuario && d.usuario.codigo) ? {codigo:String(d.usuario.codigo), nome:String(d.usuario.nome || "")} : null;
    n.campos = (d.campos || []).map(normalizarCampo);
    n.inspecoes = (d.inspecoes || []).map(normalizarInsp);
    n.lixeira = Array.isArray(d.lixeira) ? d.lixeira : [];
    n.agenda = Array.isArray(d.agenda) ? d.agenda : [];            /* v2.4: agenda do PC e justificativas */
    n.agendaInfo = d.agendaInfo || null;
    n.eventos = Array.isArray(d.eventos) ? d.eventos : [];
    n.motivos = Array.isArray(d.motivos) ? d.motivos : null;
    n.colheitas = (d.colheitas && typeof d.colheitas === "object" && !Array.isArray(d.colheitas)) ? d.colheitas : {};
    n.registros = Array.isArray(d.registros) ? d.registros : [];
    n.versaoApp = d.versaoApp || "";           /* dados gravados por uma versão anterior: "" */
    n.cfg = Object.assign({}, CFG_PADRAO, d.cfg || {});
    n.salvoEm = d.salvoEm || 0;
    n.regras = (d.regras && typeof d.regras === "object") ? d.regras : null;        /* v2.5: regras do PC — só em dados antigos (migrarRegras cifra) */
    n.regrasCif = (d.regrasCif && typeof d.regrasCif === "object") ? d.regrasCif : null;   /* etapa 20: cifradas com a chave do aparelho */
    n.licenca = (d.licenca && typeof d.licenca === "object") ? d.licenca : null;     /* v2.5: licença do PC (resumo) */
    n.chaves = (d.chaves && typeof d.chaves === "object" && !Array.isArray(d.chaves)) ? d.chaves : {};   /* v2.5: chave(s) de proteção */
    n.chaveAtual = typeof d.chaveAtual === "string" ? d.chaveAtual : "";
    n.licencaCel = (d.licencaCel && typeof d.licencaCel === "object") ? d.licencaCel : null;        /* v2.5 (etapa 20) */
    n.relogioMax = num(d.relogioMax);
    n.licUsadas = Array.isArray(d.licUsadas) ? d.licUsadas : [];
    DB = n;
    return true;
  }
  if (Array.isArray(d.campos) && Array.isArray(d.inspecoes)) { DB = migrarV1(d); return true; }
  return false;
}

function normalizarCampo(c){
  const n = Object.assign(novoCampo(), c || {});
  n.caminho = Object.assign({forma:"", graus:null, espelho:false}, n.caminho || {});
  if (!Array.isArray(n.historico)) n.historico = [];
  if (n.limite && !Array.isArray(n.limite)) n.limite = null;
  return n;
}
function normalizarInsp(i){
  const n = Object.assign({}, i);
  n.pontos = (n.pontos || []).map((p, k) => Object.assign(novoPonto(k + 1), p, {c:Object.assign({}, p.c || {})}));
  n.caminhamento = Object.assign({}, n.caminhamento || {});
  n.marcas = Array.isArray(n.marcas) ? n.marcas : [];
  n.trilha = Array.isArray(n.trilha) ? n.trilha : [];
  n.pontoFixo = Object.assign({reps:3, obs:""}, n.pontoFixo || {});
  if (typeof n.obs === "string") n.obs = {livre:n.obs, pm1:"", pm2:"", ef:""};
  n.obs = Object.assign({livre:"", pm1:"", pm2:"", ef:""}, n.obs || {});
  ["estigmaSeco", "monitoramento", "lider", "jaleco", "situacao", "isolamento", "tempo", "temperatura", "ventos",
   "representante", "at", "proxima", "hora", "recomendacoes"].forEach(k => { if (n[k] == null) n[k] = ""; });
  if (n.recomAuto == null) n.recomAuto = true;
  if (!Array.isArray(n.status)) n.status = [];
  if (!n.alterado) n.alterado = n.criado || Date.now();
  if (!n.enviadoEm) n.enviadoEm = 0;
  if (!n.seguroPC) n.seguroPC = 0;
  if (!Array.isArray(n.historico)) n.historico = [];
  if (!Array.isArray(n.fotos)) n.fotos = [];
  /* v2.4: inspeção concluída fica travada. As antigas: travadas se completas e de outro dia. */
  if (n.travada == null) n.travada = !n.exemplo && n.pontos.length > 0 && n.pontos.every(pontoFeito) && String(n.data) < hojeISO();
  return n;
}
/* versão 1 (a Caderneta anterior) -> versão 2 */
function migrarV1(d){
  const db = novoDB();
  const c1 = d.cfg || {};
  db.cfg.plantasPorPonto = num(c1.plantasPorPonto, 100) || 100;
  if (c1.tema === "dark" || c1.tema === "light" || c1.tema === "misto") db.cfg.tema = c1.tema;
  db.campos = (d.campos || []).map(c => {
    const n = novoCampo();
    const coord = lerCoord(c.coordenadas || "");
    Object.assign(n, {id:c.id || uid(), codigo:c.codigo || "", gleba:c.gleba || "", safra:c.ver || "",
      pivo:c.pivo || "", fazenda:c.fazenda || "", cooperante:c.cooperante || "", municipio:c.municipio || "",
      estado:c.estado || "MT", nucleo:c.nucleo || "", area:c.area || "", hibrido:c.hibrido || "",
      femea:c.femea || "", macho:c.macho || "",
      proporcao:(c.propF && c.propM) ? c.propF + ":" + c.propM : "", machos:2,
      nPontos:c.nContagens || "", plantasPorPonto:c.plantasPorPonto || 100, exportacao:c.exportacao || "Não",
      plantio:c.plantioIni || "", plantioFim:c.plantioFim || "", rc:c.rc || "", at:c.at || "",
      lat:coord ? coord[0] : null, lon:coord ? coord[1] : null, obs:c.obs || "",
      exemplo:c.codigo === "DEMO-01", criado:c.criado || Date.now(), alterado:Date.now()});
    return n;
  });
  db.inspecoes = (d.inspecoes || []).map(i => {
    const n = normalizarInsp(i);
    n.obs = {livre:textoObs(i), pm1:"", pm2:"", ef:""};
    n.pontos.forEach(p => { p.feito = pontoFeito(p); });
    return n;
  });
  return db;
}
function lerCoord(txt){
  if (!txt) return null;
  const n = String(txt).replace(/[°º]/g, " ").match(/-?\d+(?:[.,]\d+)?/g);
  if (!n || n.length < 2) return null;
  const v = n.map(x => parseFloat(x.replace(",", ".")));
  if (Math.abs(v[0]) > 90 || Math.abs(v[1]) > 180) return null;
  return v;
}

function restaurarDaLixeira(id){
  const k = DB.lixeira.findIndex(x => x.id === id);
  if (k < 0) return false;
  const x = DB.lixeira[k];

}

/* ----------------------------------------------------------- envio ao PC */
/* v2.4 — onde está cada inspeção:
     "local"    só no celular (nova ou alterada depois do último envio);
     "enviada"  o arquivo saiu, mas o PC ainda não confirmou;
     "segura"   o PC confirmou, pelo recibo, que tem esta mesma versão.
   Só o recibo do PC torna a inspeção segura. Editar a inspeção a tira desse estado. */
function estadoEnvio(i){
  const alt = i.alterado || 0;
  if ((i.seguroPC || 0) >= alt) return "segura";
  return (i.enviadoEm || 0) >= alt ? "enviada" : "local";
}
function inspsNaoSeguras(){
  return DB.inspecoes.filter(i => !i.exemplo && estadoEnvio(i) !== "segura" && metricas(i, campoPor(i.campoId)).temDados);
}
function etqEnvio(i){
  const e = estadoEnvio(i);
  return e === "segura" ? '<span class="etq ok">segura no PC</span>'
       : e === "enviada" ? '<span class="etq">enviada</span>' : '<span class="etq envio">só no celular</span>';
}
/* Recibo do PC: [{id, alterado}] = as inspeções (e a versão de cada uma) que o computador já tem. */
/* v2.5: inspeções completadas/corrigidas no PC voltam para cá (antes só vinha o resumo e os pontos
   lançados no PC não apareciam). Inspeção que NÃO foi mexida aqui depois do envio: fica igual à do PC.
   Mexida aqui também: junta — os pontos já contados aqui ficam, os vazios recebem os do PC — e ela
   volta a ficar "para enviar", para o PC receber a versão juntada. */
function pontoIgual(a, b, ppp){
  const ca = (a && a.c) || {}, cb = (b && b.c) || {};
  const ks = new Set(Object.keys(ca).concat(Object.keys(cb)));
  for (const k of ks) if (num(ca[k]) !== num(cb[k])) return false;
  /* "avaliadas" vazio = o padrão de plantas por ponto do campo */
  return !!(a && a.feito) === !!(b && b.feito) && (!b.feito || (num(a.avaliadas) || ppp) === (num(b.avaliadas) || ppp));
}
function aplicarEdicoesPC(lista){
  const r = {atualizadas:0, juntadas:0};
  (Array.isArray(lista) ? lista : []).forEach(e => {
    const i = inspPor(String(e && e.id)); if (!i || !Array.isArray(e.pontos)) return;
    if (e.versao && i.pcVersao === e.versao) return;                      /* já aplicada */
    const mexidaAqui = (i.alterado || 0) > num(e.alterado);
    const velhos = i.pontos || [], ppp = pppDo(campoPor(i.campoId));
    let mudou = false;
    const novos = e.pontos.map((p, k) => {
      const v = velhos[k];
      if (v && v.feito && (mexidaAqui || pontoIgual(v, p, ppp))) return v;     /* o contado aqui fica (com GPS, hora, fotos) */
      if (!p.feito && v) return v;
      mudou = true;
      return Object.assign(novoPonto(k + 1), {id:v ? v.id : uid(), avaliadas:p.avaliadas == null ? null : num(p.avaliadas), c:Object.assign({}, p.c || {}),
        feito:!!p.feito, gps:p.gps || (v && v.gps) || null, t:num(p.t) || (v ? num(v.t) : 0), obs:v ? v.obs || "" : "", doPC:true});
    });
    for (let k = e.pontos.length; k < velhos.length; k++) if (velhos[k] && velhos[k].feito) novos.push(velhos[k]);   /* não perde ponto contado aqui */
    if (!mexidaAqui && e.caminhamento && JSON.stringify(e.caminhamento) !== JSON.stringify(i.caminhamento || {})) { i.caminhamento = Object.assign({}, i.caminhamento || {}, e.caminhamento); mudou = true; }
    if (!mexidaAqui && e.estigmaSeco !== "" && e.estigmaSeco != null && num(e.estigmaSeco) !== num(i.estigmaSeco)) { i.estigmaSeco = e.estigmaSeco; mudou = true; }
    if (!mexidaAqui && num(e.numero) > 0 && num(e.numero) !== num(i.numero)) { i.numero = num(e.numero); mudou = true; }      /* v2.5: nº corrigido no PC */
    i.pcVersao = e.versao || "";
    if (!mudou) return;
    i.pontos = novos;
    delete i.assin;                                    /* mudança que veio do PC: assina de novo */
    if (mexidaAqui) { tocar(i); r.juntadas++; }        /* volta a ir para o PC, já juntada */
    else { i.seguroPC = Math.max(i.seguroPC || 0, i.alterado || 0); r.atualizadas++; }
  });
  return r;
}
function aplicarRecibo(lista, deQuem){
  let n = 0;
  const meu = DB.usuario ? DB.usuario.codigo : "";
  (Array.isArray(lista) ? lista : []).forEach(rc => {
    const i = inspPor(String(rc && rc.id)); if (!i) return;
    const c = campoPor(i.campoId), donoCampo = (c && c.dono) || meu;
    if (deQuem && donoCampo && donoCampo !== deQuem) return;      /* o recibo vale para as inspeções do dono daquele PC */
    const antes = estadoEnvio(i);
    if (num(rc.alterado) > (i.seguroPC || 0)) i.seguroPC = num(rc.alterado);
    if (antes !== "segura" && estadoEnvio(i) === "segura") n++;

}

/* Pacote de troca (arquivo "….vana.json"), igual ao do programa do PC (cronograma/pacote.py):
   o conteúdo vai como TEXTO, com a impressão digital (SHA-256) desse texto ao lado. Quem recebe
   confere antes de usar: arquivo cortado ou alterado é recusado inteiro. */
function montarPacote(conteudo, tipo){
  const txt = JSON.stringify(conteudo), itens = {};
  Object.keys(conteudo).forEach(k => { if (Array.isArray(conteudo[k])) itens[k] = conteudo[k].length; });
  const p = {formato:FORMATO_VANA, versao:1, tipo:tipo || "celular-para-pc"};
  if (TESTE) p.teste = true;
  p.origem = {usuario:DB.usuario, aparelho:{id:DB.aparelho, nome:nomeAparelho(), tipo:"celular"}, app:ROTULO_APP};
  p.gerado_em = new Date().toISOString();
  p.conferencia = {sha256:sha256Hex(txt), itens:itens};
  p.conteudo = txt;
  return p;
}
/* v2.5: esta Caderneta passa a usar o usuário do PC (a mesma pessoa): o que era do usuário
   antigo (dono e autor) passa para o novo. */
function adotarUsuario(up) {
  const velho = DB.usuario ? DB.usuario.codigo : "";
  const trocar = o => {
    if (!o) return;
    let mudou = false;
    if (o.dono === velho) { o.dono = up.codigo; mudou = true; }
    if (o.autor === velho) { o.autor = up.codigo; mudou = true; }
    if (mudou && "enviadoEm" in o) o.enviadoEm = 0;           /* vão de novo para o PC, já com o usuário certo */
  };
  ["campos", "inspecoes", "eventos", "colheitas", "registros"].forEach(k => {
    const v = DB[k]; (Array.isArray(v) ? v : Object.values(v || {})).forEach(trocar);
  });
  DB.usuario = {codigo:up.codigo, nome:up.nome || up.codigo};
  salvar();
  return "Caderneta agora usa o usuário " + (up.nome || up.codigo) + " (" + up.codigo + ")" + (velho ? "; o que era de " + velho + " passou para ele." : ".");
}

function abrirPacote(d){
  if (!(num(d.versao) <= 1)) return {erro:"Esse arquivo foi feito por uma versão mais nova. Atualize a Caderneta."};
  if (d.teste && !TESTE) return {erro:"Esse arquivo é do ambiente de TESTE e não pode ser aberto aqui"};
  const c = d.conferencia || {};
  if (typeof d.conteudo !== "string" || !c.sha256) return {erro:"Arquivo incompleto — nada foi recebido"};
  if (sha256Hex(d.conteudo) !== c.sha256) return {erro:"O arquivo chegou cortado ou alterado — nada foi recebido. Peça para enviar de novo."};
  let cont;
  try { cont = JSON.parse(d.conteudo); } catch (e) { return {erro:"Arquivo incompleto — nada foi recebido"}; }
  for (const k in (c.itens || {})) if ((cont[k] || []).length !== c.itens[k]) return {erro:"Arquivo incompleto — nada foi recebido"};
  return {cab:d, conteudo:cont};
}

/* Tudo o que é seu neste aparelho (campos e inspeções, menos os exemplos), do jeito que está

/* ---------------------------------------------------- fotos com GPS (v2.4) */
/* A foto é tirada pela câmera, reduzida (lado maior 1600 px, ~300 KB) e recebe uma faixa com
   campo, inspeção, ponto, data, hora e coordenada. A coordenada vem do GPS do app na hora da
   foto (não depende dos dados da imagem, que o Android às vezes apaga). A imagem fica na loja
   "fotos" do aparelho; a inspeção guarda só os dados dela (i.fotos). Vai para o PC no pacote e
   na cópia de segurança. Só as marcadas com "Relatório" entram no relatório do PC. */
const FOTO_LADO = 1600, FOTO_ALVO = 420000;

/* v2.5: com PIN, as fotos também ficam criptografadas no aparelho */
async function fotoGet(id){
  const r = await idbGet("fotos", id);
  if (!r || !r.cifra) return r;
  if (!PIN.dek) return null;
  try {
    const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:r.cifra.iv}, PIN.dek, r.cifra.dados);
    return {id:r.id, blob:new Blob([plano], {type:r.mime || "image/jpeg"}), mime:r.mime};
  } catch (e) { return null; }
}
async function fotoPut(reg){
  if (!PIN.dek || !reg.blob) return idbPut("fotos", reg);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const dados = await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, PIN.dek, await reg.blob.arrayBuffer());
  return idbPut("fotos", {id:reg.id, mime:reg.mime, cifra:{iv:iv, dados:dados}});
}
function lerImagem(arq){

    im.onload = () => { res({im, u}); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("imagem ilegível")); };
    im.src = u;
  });
}

function blobParaB64(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(b); }); }

  if (!arq) return;

  try { img = await lerImagem(arq); } catch (e) { aviso("Não consegui abrir a foto"); return; }
  const esc0 = Math.min(1, FOTO_LADO / Math.max(img.im.naturalWidth || 1, img.im.naturalHeight || 1));
  const w = Math.max(1, Math.round(img.im.naturalWidth * esc0)), hh = Math.max(1, Math.round(img.im.naturalHeight * esc0));

    : nomeCampo(c) + " · inspeção " + i.numero + (idxPonto != null ? " · ponto " + (idxPonto + 1) : "");
  const linha2 = agora.toLocaleDateString("pt-BR") + " " + agora.toTimeString().slice(0, 5) + " · " +
    (g ? g.lat.toFixed(6) + ", " + g.lon.toFixed(6) + " ±" + Math.round(g.acc || 0) + " m" : "sem GPS");

    lat:g ? +g.lat.toFixed(7) : null, lon:g ? +g.lon.toFixed(7) : null, acc:g ? Math.round(g.acc || 0) : null,
    fonte:g ? (g.fonte || "gps") : "", legenda:"", autor:DB.usuario ? DB.usuario.nome || DB.usuario.codigo : "",
    relatorio:true, w:w, h:hh, bytes:blob.size});   /* v2.4: foto vai para o relatório (desmarque se não quiser) */
  tocar(i); salvar(); render();
  aviso("Foto gravada" + (g ? " com GPS ±" + Math.round(g.acc || 0) + " m" : " (sem GPS)"));
}

/* Pacote de campos do programa do PC: cadastro, limite do pivô/gleba e histórico das contagens. */
function receberPacote(d, dono){
  const res = {novos:0, atualizados:0, historico:0};
  const meu = DB.usuario ? DB.usuario.codigo : "";
  const deOutro = !!(dono && meu && dono.codigo !== meu);
  (d.campos || []).forEach(pc => {
    const cod = normContrato(pc.codigo), gl = normGleba(pc.gleba);
    if (!cod) return;
    /* v2.4: o campo é de quem mandou o pacote. O mesmo contrato pode existir duas vezes aqui —
       o seu e o de outro inspetor — e um nunca toma o lugar do outro. */
    let c = DB.campos.find(x => normContrato(x.codigo) === cod && normGleba(x.gleba) === gl && !x.exemplo &&
                                (deOutro ? x.dono === dono.codigo : (!x.dono || x.dono === meu)));
    if (!c) { c = novoCampo(); c.codigo = cod; c.gleba = gl; c.origem = "pc"; DB.campos.push(c); res.novos++; }
    else res.atualizados++;
    const dvPC = pc.divisao || null, dvAqui = c.divisao || null;
    const manterDivisao = !!(dvAqui && dvAqui.origem === "celular" && num(dvAqui.em) > num(dvPC && dvPC.em));
    if (!manterDivisao && dvPC) c.divisao = dvPC;
    if (manterDivisao) res.divisaoMantida = (res.divisaoMantida || 0) + 1;
    ["safra", "pivo", "fazenda", "cooperante", "municipio", "estado", "nucleo", "area", "areaPivo", "hibrido",
     "femea", "macho", "proporcao", "espacamento", "machos", "nPontos", "plantasPorPonto", "larguraBloco", "exportacao",
     "plantio", "plantioFim", "rc", "at", "lat", "lon", "nInspecoes"].forEach(k => {
      if (manterDivisao && (k === "area" || k === "areaPivo" || k === "lat" || k === "lon")) return;
      if (pc[k] !== undefined && pc[k] !== null && pc[k] !== "") c[k] = pc[k];
    });
    if (Array.isArray(pc.limite) && pc.limite.length && !manterDivisao) { c.limite = pc.limite; c.limiteNome = pc.limiteNome || "limite do PC"; }
    if (Array.isArray(pc.historico)) { c.historico = pc.historico; res.historico += pc.historico.length; }
    if (dono) { c.dono = dono.codigo; c.donoNome = dono.nome || ""; }
    if (num(pc.isoEm) > num(c.isoEm)) {                      /* v2.5 (etapa 21): isolado por (vale o mais novo) */
      c.isoGlebas = Array.isArray(pc.isoGlebas) ? pc.isoGlebas : []; c.isoContratos = Array.isArray(pc.isoContratos) ? pc.isoContratos : [];
      c.isoTexto = pc.isoTexto || ""; c.isoEm = num(pc.isoEm);
    }
    c.alterado = Date.now();
    /* v2.5 (etapa 20): inspeção feita antes de o campo ter RC/AT fica com os do campo (o PC faz o mesmo) */
    DB.inspecoes.forEach(i => { if (i.campoId !== c.id || i.exemplo) return;
      if (!i.representante && c.rc) i.representante = c.rc;
      if (!i.at && c.at) i.at = c.at; });
  });
  /* v2.4: agenda do computador (só a do próprio usuário). A justificativa que o PC já aplicou
     sai da lista — a tarefa dela não volta como pendente. */
  if (!deOutro && Array.isArray(d.agenda)) {
    DB.agenda = d.agenda;
    DB.agendaInfo = {em:Date.now(), gerada:d.gerado_em || ""};
    if (Array.isArray(d.motivos) && d.motivos.length) DB.motivos = d.motivos;
    DB.eventos = (DB.eventos || []).filter(e => d.agenda.some(t => t.id === e.tarefa));
    res.agenda = d.agenda.length;
  }
  /* v2.4: registros do computador (visitas, SNP, irregularidades): vale o mais novo */
  if (!deOutro && Array.isArray(d.registros)) {
    DB.registros = DB.registros || [];
    d.registros.forEach(x => {
      if (!x || !x.id || !REG_TIPOS[x.tipo]) return;
      const r = regPor(x.id);
      if (!r) DB.registros.push(Object.assign({fotos:[], obs:""}, x, {enviadoEm:num(x.alterado), doPC:true}));
      else if (num(x.alterado) > num(r.alterado)) Object.assign(r, {dados:x.dados, data:x.data, contrato:x.contrato, gleba:x.gleba, alterado:num(x.alterado), enviadoEm:num(x.alterado)});
    });

/* Junta (ou substitui) uma cópia da própria Caderneta (v1 ou v2). */
function juntarCopia(d, substituir){
  const antes = DB;
  const tmp = novoDB();
  DB = tmp;
  const ok = aplicar(d);
  const vindo = DB;
  DB = antes;
  if (!ok) return null;
  if (substituir) {
    vindo.cfg = Object.assign({}, antes.cfg);
    vindo.aparelho = antes.aparelho;
    vindo.lixeira = antes.lixeira;
    vindo.chaves = antes.chaves; vindo.chaveAtual = antes.chaveAtual;          /* v2.5: a chave e as regras ficam */
    vindo.regras = vindo.regras || null;
    vindo.regrasCif = antes.regrasCif || null;              /* etapa 20: as daqui (a chave é deste aparelho) */
    vindo.licencaCel = antes.licencaCel || vindo.licencaCel || null;
    vindo.licUsadas = antes.licUsadas || vindo.licUsadas || [];
    vindo.relogioMax = Math.max(num(antes.relogioMax), num(vindo.relogioMax));
    vindo.licenca = vindo.licenca || antes.licenca;
    DB = vindo;
    return {campos:vindo.campos.length, inspecoes:vindo.inspecoes.length};
  }
  let nc = 0, ni = 0, na = 0;
  if (!DB.usuario && vindo.usuario) DB.usuario = vindo.usuario;      /* restaurar num celular novo traz o usuário */
  const idsC = new Set(DB.campos.map(c => c.id));
  vindo.campos.forEach(c => { if (!idsC.has(c.id)) { DB.campos.push(c); nc++; } });
  vindo.inspecoes.forEach(i => {
    const k = DB.inspecoes.findIndex(x => x.id === i.id);
    if (k < 0) { DB.inspecoes.push(i); ni++; }
    else if ((i.alterado || 0) > (DB.inspecoes[k].alterado || 0)) { DB.inspecoes[k] = i; na++; }
  });
  return {campos:nc, inspecoes:ni, atualizadas:na};
}

  if (["meio", "fatias", "faixas"].indexOf(modo) < 0) throw new Error("modo desconhecido: " + modo);

    const ang = rumoAng(o.rumo); let nx = -Math.sin(ang), ny = Math.cos(ang);
    if (o.inverter) { nx = -nx; ny = -ny; }
    const vs = a.map(p => nx * p[0] + ny * p[1]), v1 = Math.max.apply(null, vs);

    const ar = pk.length >= 3 ? Math.abs(areaPol(pk)) : 0;
    return {gleba:GL_NOMES[k], anel:pk.map(p => { const q = P.ll(p[0], p[1]); return [q.lon, q.lat]; }), areaHa:ar / 1e4, fracao:ar / total, forma:GL_FORMA[modo]};
  });
  const cl = c ? P.ll(c[0], c[1]) : null;
  return {glebas, centro:cl ? [cl.lon, cl.lat] : null, totalHa:total / 1e4, raioM:Math.sqrt(total / Math.PI), modo,

}
/* partes: [{aneis, gleba}] — cada gleba é uma parte (as sem nome ficam de fora) */
function glMarcarPartes(partes){
  const por = {};
  partes.forEach(p => {
    const g = normGleba(p.gleba); if (!g) return;
    if (por[g]) throw new Error("A " + g + " foi marcada em duas partes — cada gleba é uma parte.");
    por[g] = {gleba:g, anel:p.aneis[0], aneis:p.aneis, areaHa:areaHaLL(p.aneis[0]), forma:"parte"};
  });
  const nomes = Object.keys(por).sort();
  if (nomes.length > GL_MAX) throw new Error("No máximo " + GL_MAX + " glebas por campo.");
  const tot = nomes.reduce((s, g) => s + por[g].areaHa, 0) || 1;
  return nomes.map(g => Object.assign(por[g], {fracao:por[g].areaHa / tot}));
}
function glResumo(gl){ return gl.map(g => g.gleba + " " + fmtNum(g.areaHa, 1) + " ha (" + fmtPct(g.fracao * 100) + ")").join(" · "); }

/* ---------------------------------------------------------- limite: KML / KMZ / GeoJSON */
function detectarGleba(txt){
  const m = (" " + String(txt || "").toUpperCase()).match(/[^A-Z]G(?:LEBA)?[\s_\-]*0?(\d{1,2})(?!\d)/);
  return m ? "G" + (+m[1]) : "";
}
function lerKML(txt){
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("O arquivo KML está com defeito.");
  const out = [];
  const marcas = doc.getElementsByTagName("Placemark");
  for (let i = 0; i < marcas.length; i++) {
    const pm = marcas[i];
    const nomeEl = pm.getElementsByTagName("name")[0], descEl = pm.getElementsByTagName("description")[0];
    const nome = nomeEl ? nomeEl.textContent.trim() : "", desc = descEl ? descEl.textContent.trim() : "";
    const extra = Array.from(pm.getElementsByTagName("SimpleData")).concat(Array.from(pm.getElementsByTagName("Data")))
      .map(e => (e.getAttribute("name") || "") + " " + e.textContent).join(" ");
    const pols = pm.getElementsByTagName("Polygon");
    for (let j = 0; j < pols.length; j++) {
      const ob = pols[j].getElementsByTagName("outerBoundaryIs")[0] || pols[j];
      const co = ob.getElementsByTagName("coordinates")[0];
      if (!co) continue;
      const anel = co.textContent.trim().split(/\s+/).map(t => t.split(",").map(Number)).filter(v => v.length >= 2 && isFinite(v[0]) && isFinite(v[1])).map(v => [v[0], v[1]]);
      if (anel.length >= 3) out.push({nome: nome || ("Polígono " + (out.length + 1)), aneis:[anel], texto: nome + " " + desc + " " + extra});
    }
  }
  return out;
}
function lerGeoJSON(d){
  const out = [];
  const feats = d.type === "FeatureCollection" ? d.features : (d.type === "Feature" ? [d] : [{type:"Feature", geometry:d, properties:{}}]);
  feats.forEach((f, k) => {
    const g = f.geometry; if (!g) return;
    const props = f.properties || {};
    const nome = props.name || props.nome || props.Name || props.NOME || ("Polígono " + (k + 1));
    const texto = nome + " " + Object.keys(props).map(x => x + " " + props[x]).join(" ");
    const pols = g.type === "Polygon" ? [g.coordinates] : (g.type === "MultiPolygon" ? g.coordinates : []);
    pols.forEach(p => { const a = (p[0] || []).map(v => [v[0], v[1]]); if (a.length >= 3) out.push({nome:String(nome), aneis:[a], texto}); });
  });
  return out;
}
async function lerZipPrimeiroKML(buf){
  const v = new DataView(buf), u8 = new Uint8Array(buf);
  let fim = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  if (fim < 0) throw new Error("KMZ inválido.");
  const n = v.getUint16(fim + 10, true); let p = v.getUint32(fim + 16, true);
  for (let k = 0; k < n; k++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const metodo = v.getUint16(p + 10, true), tam = v.getUint32(p + 20, true);
    const ln = v.getUint16(p + 28, true), le = v.getUint16(p + 30, true), lc = v.getUint16(p + 32, true), off = v.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln));
    p += 46 + ln + le + lc;
    if (!/\.kml$/i.test(nome)) continue;
    const ln2 = v.getUint16(off + 26, true), le2 = v.getUint16(off + 28, true);
    const dados = u8.subarray(off + 30 + ln2 + le2, off + 30 + ln2 + le2 + tam);
    if (metodo === 0) return new TextDecoder().decode(dados);
    if (metodo === 8 && typeof DecompressionStream !== "undefined") {
      const s = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(s).text();
    }
    throw new Error("Este celular não consegue abrir KMZ. Salve como KML no Google Earth e tente de novo.");
  }

}
async function lerArquivoLimite(arq){
  const nome = arq.name || "";

  if (/\.kmz$/i.test(nome)) lista = lerKML(await lerZipPrimeiroKML(await arq.arrayBuffer()));
  else {
    const txt = await arq.text();
    if (/^\s*[{[]/.test(txt)) lista = lerGeoJSON(JSON.parse(txt));
    else lista = lerKML(txt);
  }
  lista.forEach(x => { x.areaHa = areaHaLL(x.aneis[0]); x.gleba = detectarGleba(x.texto) || (lista.length === 1 ? detectarGleba(nome) : ""); });
  return lista.filter(x => x.areaHa > 0.05);
}

/* ---------------------------------------------------------- desenho do mapa */
const COR_PT = {r0:"var(--r0f)", r1:"var(--r1f)", r2:"var(--r2f)", r3:"var(--r3f)", rn:"var(--azul)"};
/* opc: {aneis, plano, trilha, pontos:[{n, lat, lon, cls, feito, sim}], marcas, eu:{lat,lon,acc}, alvoN, altura} */
function mapaSVG(opc){
  const L = 600;
  const todos = [];
  (opc.aneis || []).forEach(a => a.forEach(p => todos.push({lat:p[1], lon:p[0]})));
  if (opc.plano) opc.plano.pontos.forEach(p => todos.push(p));
  (opc.trilha || []).forEach(t => todos.push({lat:t[0], lon:t[1]}));
  (opc.pontos || []).forEach(p => todos.push(p));
  (opc.marcas || []).forEach(p => todos.push(p));
  (opc.fotos || []).forEach(p => todos.push(p));
  if (opc.eu && (!todos.length || opc.incluirEu)) todos.push(opc.eu);
  if (!todos.length) return "";
  const lat0 = todos.reduce((s, p) => s + p.lat, 0) / todos.length, lon0 = todos.reduce((s, p) => s + p.lon, 0) / todos.length;
  const P = projetor(lat0, lon0);
  const xy = todos.map(p => P.xy(p.lat, p.lon));
  let x0 = Math.min.apply(null, xy.map(p => p[0])), x1 = Math.max.apply(null, xy.map(p => p[0]));
  let y0 = Math.min.apply(null, xy.map(p => p[1])), y1 = Math.max.apply(null, xy.map(p => p[1]));
  const lado = Math.max(x1 - x0, y1 - y0, 60), pad = lado * 0.08 + 8;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const asp = Math.min(1.25, Math.max(0.62, (y1 - y0 + 2 * pad) / Math.max(1, x1 - x0 + 2 * pad)));
  const W = L, H = Math.round(L * asp);
  const esc = Math.min(W / (x1 - x0 + 2 * pad || 1), H / (y1 - y0 + 2 * pad || 1));
  const X = (lat, lon) => { const q = P.xy(lat, lon); return [(W / 2 + (q[0] - cx) * esc), (H / 2 - (q[1] - cy) * esc)]; };
  const f = v => Math.round(v * 10) / 10;
  const pts = arr => arr.map(p => { const q = X(p.lat, p.lon); return f(q[0]) + "," + f(q[1]); }).join(" ");
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Mapa da inspeção">';
  s += '<rect width="' + W + '" height="' + H + '" fill="var(--sup3)"/>';
  (opc.aneis || []).forEach(a => {
    s += '<polygon points="' + pts(a.map(p => ({lat:p[1], lon:p[0]}))) + '" fill="var(--campo)" stroke="var(--tinta2)" stroke-width="2" stroke-linejoin="round"/>';
  });
  if (opc.plano) {
    s += '<polyline points="' + pts(opc.plano.linha) + '" fill="none" stroke="var(--azul)" stroke-width="2.5" stroke-dasharray="7 6" opacity=".75"/>';
    opc.plano.pontos.forEach((p, i) => {
      const q = X(p.lat, p.lon), alvo = opc.alvoN === i + 1;
      s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="' + (alvo ? 13 : 9) + '" fill="var(--sup)" stroke="' + (alvo ? "var(--polen-fill)" : "var(--azul)") + '" stroke-width="' + (alvo ? 4 : 2) + '" stroke-dasharray="' + (alvo ? "0" : "3 3") + '"/>';
      s += '<text x="' + f(q[0]) + '" y="' + f(q[1] + 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--azul)" font-family="var(--f-titulo)">' + (i + 1) + "</text>";
    });
  }
  if (opc.trilha && opc.trilha.length > 1)
    s += '<polyline points="' + pts(opc.trilha.map(t => ({lat:t[0], lon:t[1]}))) + '" fill="none" stroke="var(--gps)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>';
  (opc.marcas || []).forEach(m => {
    const q = X(m.lat, m.lon);
    s += '<rect x="' + f(q[0] - 6) + '" y="' + f(q[1] - 6) + '" width="12" height="12" rx="2" fill="' + (m.pol ? "var(--r3f)" : "var(--polen-fill)") + '" stroke="var(--sup)" stroke-width="1.5"/>';
  });
  /* v2.5: fotos com GPS — alfinete com câmera (nº do ponto, ou C = caminhamento) */
  (opc.fotos || []).forEach(ft => {
    const q = X(ft.lat, ft.lon), x = f(q[0]), y = f(q[1]);
    s += '<g transform="translate(' + x + "," + y + ')"><title>Foto' + (ft.ponto ? " do ponto " + ft.ponto : " do caminhamento") + "</title>" +
      '<path d="M0 0 L-9 -14 A11 11 0 1 1 9 -14 Z" fill="var(--sup)" stroke="var(--tinta)" stroke-width="1.6"/>' +
      '<rect x="-6.5" y="-23" width="13" height="9" rx="2" fill="var(--tinta)"/><circle cx="0" cy="-18.5" r="2.6" fill="var(--sup)"/></g>';
  });
  (opc.pontos || []).forEach(p => {
    const q = X(p.lat, p.lon);
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="12" fill="' + (COR_PT[p.cls] || "var(--azul)") + '" stroke="var(--sup)" stroke-width="2.5"' + (p.sim ? ' stroke-dasharray="4 2"' : "") + "/>";
    s += '<text x="' + f(q[0]) + '" y="' + f(q[1] + 4.5) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="var(--f-titulo)">' + p.n + "</text>";
  });
  if (opc.eu) {
    const q = X(opc.eu.lat, opc.eu.lon), r = Math.max(8, (opc.eu.acc || 0) * esc);
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="' + f(Math.min(r, W)) + '" fill="var(--gps)" opacity=".16"/>';
    s += '<circle cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="8" fill="var(--gps)" stroke="#fff" stroke-width="3"/>';
  }
  // norte e escala
  s += '<g transform="translate(' + (W - 30) + ',34)"><path d="M0 -18 L8 6 L0 1 L-8 6 Z" fill="var(--tinta)"/><text y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tinta)" font-family="var(--f-titulo)">N</text></g>';
  const alvoM = (W * 0.28) / esc, pot = Math.pow(10, Math.floor(Math.log10(alvoM)));
  const passo = [1, 2, 5, 10].map(k => k * pot).filter(v => v <= alvoM).pop() || pot;
  const larg = passo * esc;
  s += '<g transform="translate(14,' + (H - 16) + ')"><rect x="0" y="-5" width="' + f(larg) + '" height="5" fill="var(--tinta)"/>';
  s += '<text x="' + f(larg + 6) + '" y="0" font-size="12" fill="var(--tinta)" font-family="var(--f-texto)">' + fmtDist(passo) + "</text></g>";
  return s + "</svg>";
}

/* ---------------------------------------------------------- gráfico de linhas (evolução) */
/* series: [{nome, cor, valores:[{x(dia), y}]}] ; eixoY em % */
function graficoSVG(series, opc){
  opc = opc || {};
  const W = 600, H = opc.altura || 190, mL = 40, mR = 14, mT = 12, mB = 26;
  const xs = [], ys = [];
  series.forEach(s => s.valores.forEach(v => { xs.push(v.x); ys.push(v.y); }));
  if (xs.length < 2) return "";
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) { x0 -= 1; x1 += 1; }
  const yMax = Math.max(10, Math.ceil(Math.max.apply(null, ys) / 10) * 10);
  const X = x => mL + (x - x0) / (x1 - x0) * (W - mL - mR), Y = y => mT + (1 - y / yMax) * (H - mT - mB);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + (opc.rotulo || "Evolução") + '">';
  for (let k = 0; k <= 4; k++) {
    const y = yMax * k / 4, yy = Y(y).toFixed(1);
    s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--linha)" stroke-width="1"/>';
    s += '<text x="' + (mL - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + fmtNum(y, 0) + "%</text>";
  }
  const dias = Array.from(new Set(xs)).sort((a, b) => a - b);
  const passo = Math.max(1, Math.ceil(dias.length / 6));
  dias.forEach((d, k) => { if (k % passo === 0 || k === dias.length - 1) s += '<text x="' + X(d).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + dataCurta(isoDeDia(d)) + "</text>"; });
  series.forEach(se => {
    const v = se.valores.slice().sort((a, b) => a.x - b.x);
    if (!v.length) return;
    if (v.length > 1) s += '<polyline points="' + v.map(p => X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ") + '" fill="none" stroke="' + se.cor + '" stroke-width="2.5" stroke-linejoin="round"/>';
    v.forEach((p, k) => { s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (k === v.length - 1 ? 4.5 : 3) + '" fill="' + se.cor + '"/>'; });
  });
  return s + "</svg>";
}

/* gps.js */
/* =====================================================================
   GPS — fica ligado enquanto você conta (watchPosition), grava a posição
   de cada ponto ao concluir, desenha a trilha andada e explica por que
   o GPS não funciona quando o navegador bloqueia. Sem GPS: simulação.
   ===================================================================== */
const GPS = {estado:"parado", motivo:"", ult:null, watch:null, sim:null, ouvintes:[], desde:0};
const MOTIVOS = {
  semHttps:"O app foi aberto como arquivo ou por um endereço sem https — o navegador só libera o GPS no app instalado por um endereço https (veja Ajustes › Instalar no celular).",
  iframe:"Esta é a prévia aberta dentro de outra página (como o visualizador do Claude), que não libera o GPS. No app instalado no celular o GPS funciona. Aqui dá para usar a simulação.",
  negado:"A permissão de localização foi negada. Android: toque no cadeado ao lado do endereço › Permissões › Local › Permitir. iPhone: Ajustes › Privacidade › Serviços de Localização › Safari (ou Caderneta) › Ao Usar o App, com Localização Precisa ligada.",
  semAparelho:"Este navegador não tem acesso ao GPS.",
  semSinal:"O aparelho não achou a posição. Confira se a Localização está ligada no celular e espere alguns segundos a céu aberto."

function politicaBloqueia(){
  try { const p = document.permissionsPolicy || document.featurePolicy; return !!(p && p.allowsFeature && !p.allowsFeature("geolocation")); }
  catch (e) { return false; }

  try { if (window.self !== window.top) return true; } catch (e) { return true; }
  return !!(window.claude && typeof window.claude.use === "function");

function gpsDiagnostico(){
  if (!("geolocation" in navigator)) return {ok:false, estado:"indisponivel", motivo:MOTIVOS.semAparelho};
  if (politicaBloqueia() || (emVisualizador() && !window.isSecureContext)) return {ok:false, estado:"bloqueado", motivo:MOTIVOS.iframe};
  if (!window.isSecureContext) return {ok:false, estado:"bloqueado", motivo:MOTIVOS.semHttps};

  const d = gpsDiagnostico();
  if (!d.ok) { GPS.estado = d.estado; GPS.motivo = d.motivo; avisarGPS(); return; }
  if (GPS.watch != null) return;
  if (!GPS.ult) { GPS.estado = "pedindo"; GPS.motivo = "Procurando satélites…"; }

    GPS.watch = navigator.geolocation.watchPosition(gpsOk, gpsErro, {enableHighAccuracy:true, maximumAge:2000, timeout:30000});
  } catch (e) { GPS.estado = "erro"; GPS.motivo = String(e && e.message || e); }

}
function gpsParar(){
  if (GPS.watch != null) { try { navigator.geolocation.clearWatch(GPS.watch); } catch (e) {} GPS.watch = null; }
}
function gpsDesligar(){ gpsParar(); if (!GPS.sim) { GPS.estado = "parado"; GPS.motivo = ""; } avisarGPS(); }
function gpsOk(pos){
  if (GPS.sim) return;

  GPS.estado = c.accuracy <= 15 ? "ok" : (c.accuracy <= 40 ? "fraco" : "ruim");
  GPS.motivo = "";
  registrarTrilha(GPS.ult);
  avisarGPS();
}

    const pol = politicaBloqueia() || emVisualizador();
    GPS.estado = pol ? "bloqueado" : "negado"; GPS.motivo = pol ? MOTIVOS.iframe : MOTIVOS.negado;
  } else if (e && e.code === 2) {
    if (!GPS.ult) { GPS.estado = "sem-sinal"; GPS.motivo = MOTIVOS.semSinal; }
  } else if (!GPS.ult) { GPS.estado = "pedindo"; GPS.motivo = "Ainda procurando satélites…"; }

}
function gpsFresco(maxMs){
  if (!GPS.ult) return null;
  return (Date.now() - GPS.ult.t) <= (maxMs || 20000) ? GPS.ult : null;
}
function gpsUmaVez(ms){
  return new Promise(res => {
    const f = gpsFresco(8000); if (f) return res(f);
    if (GPS.sim) return res(GPS.ult);
    const d = gpsDiagnostico(); if (!d.ok) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(p => {
        const c = p.coords;
        GPS.ult = {lat:c.latitude, lon:c.longitude, acc:c.accuracy || 0, t:Date.now(), fonte:"gps"};
        if (GPS.estado !== "ok") GPS.estado = c.accuracy <= 15 ? "ok" : (c.accuracy <= 40 ? "fraco" : "ruim");
        avisarGPS(); res(GPS.ult);

    } catch (e) { res(null); }

}
function textoGPS(){
  const u = GPS.ult, velho = u && (Date.now() - u.t) > 45000;
  switch (GPS.estado) {
    case "ok": case "fraco": case "ruim": return velho ? "sem atualizar" : "±" + Math.round(u.acc) + " m";
    case "simulado": return "simulado";
    case "pedindo": return "GPS…";
    case "parado": return "GPS desl.";
    case "sem-sinal": return "sem sinal";

  }
}
function classeGPS(){
  const u = GPS.ult, velho = u && (Date.now() - u.t) > 45000;
  if (GPS.estado === "simulado") return "sim";
  if (GPS.estado === "ok") return velho ? "fraco" : "ok";
  if (GPS.estado === "fraco" || GPS.estado === "ruim") return "fraco";
  if (GPS.estado === "pedindo" || GPS.estado === "sem-sinal") return "busca";
  if (GPS.estado === "parado") return "";

/* ---------------------------------------------------------------- trilha */
let tTrilha = null;
/* v2.5: o caminhamento só é medido com a contagem ATIVA — começou (ou está no 1º ponto), não está
   pausada e ainda falta ponto. Terminou a contagem: a trilha para, mesmo com o GPS ligado. */
function contagemAtiva(i){
  return !!(i && !inspTravada(i) && !pausaAberta(i) && !i.pontos.every(pontoFeito) &&
            (i.pontos.some(pontoFeito) || (S.tela === "ponto" && S.inspId === i.id)));
}
function registrarTrilha(fix){
  if (!DB.cfg.gpsTrilha || !fix) return;
  if (["insp", "ponto", "mapa"].indexOf(S.tela) < 0) return;
  const i = inspPor(S.inspId); if (!contagemAtiva(i)) return;
  if (fix.fonte !== "simulado" && i.data !== hojeISO()) return;      // não mexe em inspeção antiga
  if (fix.acc > (DB.cfg.gpsPrecisao || 30)) return;
  const tr = i.trilha, u = tr[tr.length - 1];
  if (u && distM({lat:u[0], lon:u[1]}, fix) < 5) return;
  tr.push([+fix.lat.toFixed(7), +fix.lon.toFixed(7), Math.round(fix.t / 1000), Math.round(fix.acc), fix.fonte === "simulado" ? 1 : 0]);
  if (tr.length > 4000) tr.splice(0, tr.length - 4000);
  clearTimeout(tTrilha); tTrilha = setTimeout(salvar, 4000);
}
/* metros andados (pela trilha) desde um instante; sem trilha, null */
/* v2.4: tempo da inspeção — do 1º ao último ponto concluído (o mesmo cálculo do PC, eficiencia.py) */
function eficienciaInsp(i){
  const pts = i.pontos.filter(p => p.feito && p.t).sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  const ini = pts[0].t, fim = pts[pts.length - 1].t;
  const pausa = segPausado(i, ini, fim) / 60, dur = (fim - ini) / 60 - pausa;      /* v2.5: tempo pausado fica fora */
  if (dur <= 0) return null;
  const tr = (i.trilha || []).filter(x => x[2] >= ini && x[2] <= fim && !naPausa(i, x[2]));
  let km = null;
  if (tr.length >= 2) {
    km = 0;
    for (let k = 1; k < tr.length; k++) if (!segPausado(i, tr[k - 1][2], tr[k][2]))
      km += distM({lat:tr[k - 1][0], lon:tr[k - 1][1]}, {lat:tr[k][0], lon:tr[k][1]}) / 1000;
  }
  return {dur:dur, n:pts.length, porPonto:dur / (pts.length - 1), km:km, ini:ini, fim:fim, pausa:pausa};
}

/* v2.5: PAUSA DA CONTAGEM — para ir a outra gleba (ou outro campo) e voltar sem encerrar.
   i.pausas = [[início, fim|null], …] em segundos. O tempo pausado não entra no tempo da inspeção
   (nem no PC: eficiencia.py desconta igual). Abrir um ponto de uma inspeção retoma ela e pausa a
   outra que estava em andamento hoje (a partir do último ponto contado nela). */
function agoraSeg(){ return Math.round(Date.now() / 1000); }
function pausaAberta(i){ return !!(i && (i.pausas || []).some(p => p[1] == null)); }
function emAndamento(i){ return !!(i && !inspTravada(i) && i.pontos.some(pontoFeito) && !i.pontos.every(pontoFeito)); }
function ultimoPontoT(i){ return i.pontos.reduce((m, p) => Math.max(m, pontoFeito(p) && p.t ? p.t : 0), 0); }
function pausar(i, desde){
  if (!i || pausaAberta(i) || !emAndamento(i)) return false;
  if (!Array.isArray(i.pausas)) i.pausas = [];
  const ag = agoraSeg(), ult = (i.pausas[i.pausas.length - 1] || [0, 0])[1] || 0;
  i.pausas.push([Math.max(ult, Math.min(desde || ag, ag)), null]);
  tocar(i); return true;
}
function retomar(i){
  const p = i && (i.pausas || []).find(x => x[1] == null); if (!p) return false;
  p[1] = agoraSeg();
  if (p[1] - p[0] < 10) i.pausas.splice(i.pausas.indexOf(p), 1);      // toque sem querer: não conta
  tocar(i); return true;
}
function segPausado(i, ini, fim){
  const ag = agoraSeg();
  return (i.pausas || []).reduce((s, p) => s + Math.max(0, Math.min(fim, p[1] == null ? ag : p[1]) - Math.max(ini, p[0])), 0);
}
function naPausa(i, t){ return (i.pausas || []).some(p => t > p[0] && t < (p[1] == null ? Infinity : p[1])); }
function inspsPausadas(excetoId){ return DB.inspecoes.filter(i => i.id !== excetoId && pausaAberta(i) && !inspTravada(i)); }
/* esta passa a ser a contagem ativa: retoma se estava pausada e pausa as outras em andamento hoje */
function ativarContagem(i){
  if (!i || inspTravada(i) || i.edicao) return [];
  const mud = [];
  if (retomar(i)) mud.push("retomada");
  DB.inspecoes.forEach(o => {
    if (o.id !== i.id && !o.exemplo === !i.exemplo && o.data === hojeISO() && pausar(o, ultimoPontoT(o) || undefined)) mud.push(o);      // exemplo não mexe nas reais
  });
  if (mud.length) salvar();
  return mud;
}
function camposIrmaos(c){
  if (!c) return [];
  const cod = normContrato(c.codigo || ""), piv = String(c.pivo || "").trim(), faz = semAcento(c.fazenda || "").toLowerCase().trim();
  return DB.campos.filter(x => x.id !== c.id && ((cod && normContrato(x.codigo || "") === cod) ||
    (piv && String(x.pivo || "").trim() === piv && semAcento(x.fazenda || "").toLowerCase().trim() === faz)))
    .sort((a, b) => String(a.gleba || "").localeCompare(String(b.gleba || ""), "pt-BR", {numeric:true}));
}
function inspAbertaHoje(c){ return inspsDoCampo(c.id).filter(x => x.data === hojeISO() && !inspTravada(x)).pop() || null; }
function htmlPausadas(excetoId){
  return inspsPausadas(excetoId).map(i => {
    const c = campoPor(i.campoId), m = metricas(i, c), p = i.pausas.find(x => x[1] == null);
    return '<div class="nota linha pausa"><span class="cresce">' + ico("pausa") + ' <b>' + esc(nomeCampo(c)) + " · nº " + esc(i.numero) + "</b> pausada às " +
      hhmm(p[0] * 1000) + " · " + m.n + "/" + m.previstos + ' pontos</span><button class="btn peq pri" data-a="retomar-insp" data-id="' + i.id + '">Retomar</button></div>';
  }).join("");
}
function txtDuracao(min){ const h = Math.floor(min / 60), m = Math.round(min - h * 60); return h ? h + "h" + String(m).padStart(2, "0") : m + " min"; }
function andadoDesde(insp, tSeg){
  const tr = (insp.trilha || []).filter(t => t[2] >= tSeg);
  if (tr.length < 2) return null;
  let d = 0; for (let k = 1; k < tr.length; k++) d += distM({lat:tr[k - 1][0], lon:tr[k - 1][1]}, {lat:tr[k][0], lon:tr[k][1]});
  return d;
}
/* grava a posição no ponto (só melhora; coordenada digitada não é trocada) */
function gpsNoPonto(p, forcar){
  const f = gpsFresco(30000); if (!f) return false;
  if (p.gps && p.gps.fonte === "manual" && forcar !== "manual") return false;
  if (!forcar && p.gps && (p.gps.acc || 999) <= f.acc) return false;
  p.gps = {lat:+f.lat.toFixed(7), lon:+f.lon.toFixed(7), acc:Math.round(f.acc), t:f.t, fonte:f.fonte || "gps"};
  return true;
}

/* ---------------------------------------------------------------- simulação (demonstração) */
const SIM_BASE = {lat:-15.6010, lon:-56.0970};      /* v2.5: ponto neutro (centro de Cuiabá), não é campo de ninguém */
function campoDaSimulacao(){
  const i = inspPor(S.inspId), c = i ? campoPor(i.campoId) : campoPor(S.campoId);
  if (c && formaDoCampo(c)) return c;
  const v = Object.assign({}, c || {}, {gleba:"", lat:SIM_BASE.lat, lon:SIM_BASE.lon, area:num(c && c.area) || 50, limite:null});
  if (c && c.lat != null) { v.lat = c.lat; v.lon = c.lon; }
  return v;
}
function alvoDaSimulacao(){
  const i = inspPor(S.inspId); const c = campoDaSimulacao();
  const n = i ? i.pontos.length : nPontosDoCampo(c);
  const pl = planoDoCampo(c, n || 15); if (!pl) return null;
  let k = 0;
  if (i) { const idx = S.tela === "ponto" && S.pontoIdx != null ? S.pontoIdx : i.pontos.findIndex(p => !pontoFeito(p)); k = idx < 0 ? n - 1 : idx; }
  return pl.pontos[Math.min(k, pl.pontos.length - 1)];
}
function gpsSimular(ligar){
  if (!ligar) {
    if (GPS.sim) clearInterval(GPS.sim.timer);
    GPS.sim = null; GPS.ult = null; GPS.estado = "parado"; GPS.motivo = "";
    avisarGPS();
    if (DB.cfg.gpsLigado) gpsLigar();
    return;
  }
  gpsParar();
  GPS.sim = {timer:null, pos:null};
  GPS.estado = "simulado"; GPS.motivo = "Posições inventadas para demonstração — não valem como dado de campo.";
  const passo = () => {
    const alvo = alvoDaSimulacao() || SIM_BASE;
    let p = GPS.sim.pos;
    if (!p) p = {lat:alvo.lat - 0.0006, lon:alvo.lon - 0.0005};
    const d = distM(p, alvo);
    if (d > 3) {
      const k = Math.min(1, 9 / d);
      p = {lat:p.lat + (alvo.lat - p.lat) * k, lon:p.lon + (alvo.lon - p.lon) * k};
    } else {
      p = {lat:alvo.lat + (Math.random() - 0.5) * 0.00002, lon:alvo.lon + (Math.random() - 0.5) * 0.00002};
    }
    GPS.sim.pos = p;
    GPS.ult = {lat:p.lat, lon:p.lon, acc:4 + Math.round(Math.random() * 3), t:Date.now(), fonte:"simulado"};
    registrarTrilha(GPS.ult);
    avisarGPS();
  };
  GPS.sim.timer = setInterval(passo, 1000);
  passo();
}

let trava = null;
async function manterTelaAcesa(ligar){
  try {
    if (ligar && DB.cfg.telaAcesa && "wakeLock" in navigator && document.visibilityState === "visible") {
      if (!trava) { trava = await navigator.wakeLock.request("screen"); trava.addEventListener("release", () => { trava = null; }); }
    } else if (!ligar && trava) { await trava.release(); trava = null; }
  } catch (e) { trava = null; }
}

function hhmm(t){ const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function quandoTxt(t){
  if (!t) return "nunca";
  const d = new Date(t), hoje = hojeISO();

  if (iso === hoje) return "hoje às " + hhmm(t);

/* ---------------------------------------------------------------- aviso (toast) */
let tAviso = null;
function aviso(txt, acao, ms){
  let el = document.querySelector(".aviso");
  if (!el) { el = document.createElement("div"); el.className = "aviso"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.innerHTML = "<span>" + esc(txt) + "</span>" + (acao ? '<button type="button">' + esc(acao.rotulo) + "</button>" : "");
  if (acao) el.querySelector("button").onclick = () => { el.remove(); acao.fn(); };
  clearTimeout(tAviso);
  tAviso = setTimeout(() => { el.remove(); }, ms || (acao ? 6000 : 2600));
}

/* ---------------------------------------------------------------- diálogos */
const DLG = {atual:null};   // diálogo aberto (o Voltar do celular fecha ele em vez de mudar de tela)
function dialogo(o){
  const botoes = o.botoes || [{rotulo:"OK", valor:true, classe:"pri"}];
  return new Promise(res => {
    const veu = document.createElement("div");
    veu.className = "veu";
    const foco = document.activeElement;
    veu.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-label="' + esc(o.titulo || "") + '">' +
      (o.titulo ? "<h3>" + esc(o.titulo) + "</h3>" : "") + (o.html || (o.texto ? "<p>" + esc(o.texto) + "</p>" : "")) +
      '<div class="btns">' + botoes.map((b, k) =>
        '<button type="button" class="btn ' + (b.classe || "") + '" data-k="' + k + '">' + esc(b.rotulo) + "</button>").join("") + "</div></div>";
    const fechar = v => { if (DLG.atual === fechar) DLG.atual = null; veu.remove(); document.removeEventListener("keydown", tecla); try { foco && foco.focus && foco.focus(); } catch (e) {} res(v); };
    DLG.atual = fechar;
    const tecla = e => { if (e.key === "Escape") fechar(null); };
    veu.addEventListener("click", e => {
      const b = e.target.closest("button[data-k]");
      if (b) { const bt = botoes[+b.dataset.k]; fechar(bt.coletar ? bt.coletar(veu) : bt.valor); return; }
      if (e.target === veu && o.fecharFora !== false) fechar(null);
    });
    document.addEventListener("keydown", tecla);
    document.body.appendChild(veu);
    if (o.aoAbrir) o.aoAbrir(veu, fechar);
    const alvo = veu.querySelector("[autofocus]") || veu.querySelector(".btn.pri") || veu.querySelector(".btn");
    if (alvo) setTimeout(() => alvo.focus(), 30);
  });
}
function confirmar(titulo, texto, sim, perigo){
  return dialogo({titulo, texto, botoes:[{rotulo:"Cancelar", valor:false}, {rotulo:sim || "Confirmar", valor:true, classe:perigo ? "perigo" : "pri"}]});
}

/* ---------------------------------------------------------------- copiar */
function copiarTexto(txt, rotulo){
  const ok = () => aviso((rotulo || "Texto") + " copiado");
  const manual = () => dialogo({titulo:"Copie o texto", html:'<p>Toque e segure no texto e escolha Copiar.</p><textarea class="msg" style="width:100%;min-height:220px" readonly>' + esc(txt) + "</textarea>",
    aoAbrir:v => { const t = v.querySelector("textarea"); t.focus(); t.select(); }});
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(ok, () => velho() || manual()); return; }
  } catch (e) {}
  if (!velho()) manual();
  function velho(){
    try {
      const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); const r = document.execCommand("copy"); ta.remove(); if (r) ok(); return r;
    } catch (e) { return false; }
  }
}

/* ---------------------------------------------------------------- entregar arquivo */
/* modo: "compartilhar" (menu do celular) ou "salvar" (Downloads). Devolve o que aconteceu. */
async function entregarArquivo(nome, texto, mime, modo){
  const blob = texto instanceof Blob ? texto : new Blob([texto], {type:mime + ";charset=utf-8"});
  if (emVisualizador() && window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl && dl.save) { await dl.save({filename:nome, data:texto}); return "salvo"; }
    } catch (e) { if (e && e.code === "declined") return "cancelado"; }
  }
  if (modo !== "salvar") {
    try {
      const f = new File([blob], nome, {type:mime});
      if (navigator.canShare && navigator.canShare({files:[f]}) && navigator.share) {
        await navigator.share({files:[f], title:nome});
        return "compartilhado";
      }
    } catch (e) { if (e && e.name === "AbortError") return "cancelado"; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return "baixado";
  } catch (e) {}
  if (typeof texto !== "string") { aviso("Não consegui salvar o arquivo neste navegador."); return "cancelado"; }
  copiarTexto(texto, "Conteúdo do arquivo");
  return "copiado";
}
function podeCompartilharArquivo(){
  try { return !!(navigator.canShare && navigator.canShare({files:[new File(["x"], "x.json", {type:"application/json"})]})); }
  catch (e) { return false; }
}
function vibrar(){ try { if (DB.cfg.vibrar && navigator.vibrate) navigator.vibrate(9); } catch (e) {} }
/* abre o seletor de arquivos do aparelho */
function escolherArquivo(aceita, captura){
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = aceita || ""; inp.style.display = "none";
    if (captura) inp.setAttribute("capture", captura);          /* abre direto a câmera no celular */
    inp.onchange = () => { res(inp.files && inp.files[0] ? inp.files[0] : null); inp.remove(); };
    document.body.appendChild(inp); inp.click();
  });
}
function lerTexto(arq){ return arq.text ? arq.text() : new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result)); fr.onerror = j; fr.readAsText(arq); }); }
function carimbo(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes());
}

const ABERTOS = new Set(["sec-pontos", "sec-enviar"]);

  return '<details class="sec" id="' + id + '"' + aberto(id, opc.aberto) + '><summary><span class="st">' + titulo + "</span>" +
    (resumo ? '<span class="sr2">' + resumo + "</span>" : "") + '</summary><div class="sec-c' + (opc.liso ? " liso" : "") + '">' + corpo + "</div></details>";
}
function selo(cl, curto){
  const nome = curto ? cl.nome.replace("Risco ", "") : cl.nome;
  return '<span class="selo ' + cl.css + '"><i></i>' + esc(nome) + "</span>";
}
function voltar(destino){ return '<button class="btn-ico" data-a="voltar" data-para="' + destino + '" aria-label="Voltar">' + ico("esq") + "</button>"; }
function fIn(bind, rot, val, o){

  const extra = (o.t === "n" ? ' inputmode="decimal"' : "") + (o.t === "i" ? ' inputmode="numeric" pattern="[0-9]*"' : "") + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : "") + (o.lista ? ' list="' + o.lista + '"' : "");

    '<input id="f-' + bind + '" type="' + tipo + '" data-b="' + bind + '"' + (o.t ? ' data-t="' + o.t + '"' : "") + ' value="' + esc(val == null ? "" : val) + '"' + extra + ">" +
    (o.dica ? '<span class="dica">' + o.dica + "</span>" : "") + "</div>";
}
function fSel(bind, rot, opcoes, val, o){

    opcoes.map(x => { const v = Array.isArray(x) ? x[0] : x, r = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(r) + "</option>"; }).join("") +
    "</select>" + (o.dica ? '<span class="dica">' + o.dica + "</span>" : "") + "</div>";
}
function fTa(bind, rot, val, o){
  o = o || {};
  return '<div class="f tudo"><label for="f-' + bind + '">' + esc(rot) + '</label><textarea id="f-' + bind + '" data-b="' + bind + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : "") + (o.ro ? " readonly" : "") + ' rows="' + (o.linhas || 3) + '">' + esc(val == null ? "" : val) + "</textarea>" + (o.dica ? '<span class="dica">' + o.dica + "</span>" : "") + "</div>";
}
function fChk(bind, rot, val, o){
  o = o || {};
  return '<label class="chk"><input type="checkbox" data-b="' + bind + '" data-t="b"' + (val ? " checked" : "") + (o.id ? ' id="' + o.id + '"' : "") + "> <span>" + rot + "</span></label>";
}
function avisoPrevia(){
  if (emVisualizador()) return '<div class="faixa-previa"><b>Prévia.</b> Aqui o visualizador desliga o GPS, o PDF e o menu Compartilhar. Para usar no campo, instale o app no celular (aba Ajustes › Instalar no celular). Para testar o mapa, use a simulação do GPS.</div>';

function dentroDoCampo(c){ return [c.fazenda, c.hibrido, num(c.area) ? fmtNum(num(c.area), 1).replace(",0", "") + " ha" : ""].filter(Boolean).join(" · "); }

/* ================================================================= CAMPOS */
/* próxima inspeção do campo pela data marcada na última (ou "hoje" se já foi feita hoje) */
function agendaDoCampo(c){
  const u = ultimaInsp(c.id), hoje = hojeISO();
  if (u && u.data === hoje) return {tipo:"feita", txt:"feita hoje"};
  /* v2.4: com a agenda do computador, vale a tarefa dele */
  const t = (DB.agenda || []).filter(x => /^(Contagem|Isolamento|Visita)/.test(x.fase) && !eventoDa(x) && campoDaTarefa(x) === c)
    .sort((a, b) => a.data < b.data ? -1 : 1)[0];
  if (t) {
    const d = diaNum(t.data) - diaNum(hoje);
    if (d < 0) return {tipo:"atrasada", txt:t.fase + " atrasada " + (-d) + " dia" + (d === -1 ? "" : "s"), d};
    if (d === 0) return {tipo:"hoje", txt:t.fase + " hoje", d};
    return {tipo:"futura", txt:t.fase + " " + dataCurta(t.data), d};
  }
  if (!u) return null;
  if (!u.proxima) return null;
  const fase = (() => { try { return contexto(u).fase.codigo; } catch (e) { return ""; } })();
  if (fase === "final") return {tipo:"fim", txt:"encerrar"};
  const d = diaNum(u.proxima) - diaNum(hoje);
  if (d < 0) return {tipo:"atrasada", txt:"atrasada " + (-d) + " dia" + (d === -1 ? "" : "s"), d};
  if (d === 0) return {tipo:"hoje", txt:"prevista hoje", d};
  return {tipo:"futura", txt:"próxima " + dataCurta(u.proxima), d};
}
function telaCampos(){
  const q = semAcento(S.busca || "").toLowerCase().trim();
  const ativ = c => { const u = ultimaInsp(c.id); return Math.max(u ? (u.alterado || 0) : 0, c.alterado || 0); };
  const AG = {}; DB.campos.forEach(c => { AG[c.id] = agendaDoCampo(c); });
  const peso = c => { const a = AG[c.id]; return !a ? 3 : a.tipo === "atrasada" ? 0 : a.tipo === "hoje" ? 1 : a.tipo === "feita" ? 2 : 3; };
  let lista = DB.campos.slice().sort((a, b) => peso(a) - peso(b) || ativ(b) - ativ(a));
  if (q) lista = lista.filter(c => semAcento([c.codigo, c.gleba, c.fazenda, c.hibrido, c.cooperante, c.municipio, c.pivo].join(" ")).toLowerCase().indexOf(q) >= 0);
  const reg = regiaoSel();
  if (reg) lista = lista.filter(c => regiaoDe(c.codigo) === reg);
  const pend = inspsParaEnviar().length;
  const nHoje = DB.campos.filter(c => AG[c.id] && (AG[c.id].tipo === "hoje" || AG[c.id].tipo === "atrasada")).length;
  let h = '<div class="cab"><div class="cresce"><h2>Campos</h2><div class="sub">' + DB.campos.length + " campo(s) · " + DB.inspecoes.length + " inspeção(ões) neste aparelho" +
    (nHoje ? " · <b>" + nHoje + " para inspecionar hoje</b>" : "") + "</div></div></div>";
  h += '<div class="pilha">' + avisoPrevia() + htmlLicenca() + htmlLembreteCopia() + htmlPausadas();
  if (pend) h += '<div class="nota alerta linha"><span class="cresce"><b>' + pend + (pend === 1 ? " inspeção ainda não foi" : " inspeções ainda não foram") + "</b> para o computador.</span>" +
                 '<button class="btn peq" data-a="ir" data-para="dados">' + ico("compartilhar") + " Enviar</button></div>";
  h += '<div class="btns"><button class="btn pri" data-a="novo-campo">' + ico("mais") + ' Novo campo</button><button class="btn" data-a="receber">' + ico("receber") + " Receber do PC</button></div>";
  h += htmlRegioes();
  if (DB.campos.length > 5) h += '<div class="busca">' + ico("busca") + '<input id="busca" type="search" placeholder="Buscar contrato, fazenda, híbrido…" value="' + esc(S.busca) + '" autocomplete="off"></div>';
  return h + '<div id="lista-campos">' + htmlListaCampos(lista, AG, reg) + "</div></div>";
}
/* v2.5: a lista é redesenhada sozinha ao digitar na busca — o campo de busca não é recriado,
   então o teclado (numérico ou de letras) continua o mesmo que a pessoa escolheu */
function htmlListaCampos(lista, AG, reg){
  let h = "";
  if (!DB.campos.length) {
    h += '<div class="cartao"><div class="vazio"><h3>Nenhum campo ainda</h3><p>Receba os campos do programa do computador (com área, híbrido e limite do pivô) ou crie um campo aqui mesmo.</p></div></div>';
  } else if (!lista.length) {
    h += '<p class="mut">Nenhum campo' + (S.busca ? " com “" + esc(S.busca) + "”" : "") + (reg ? " na região " + esc(reg) : "") + ".</p>";
  } else {
    h += '<div class="lista">';
    lista.forEach(c => {
      const u = ultimaInsp(c.id), ag = AG[c.id];
      const tag = ag && ag.tipo !== "futura" ? '<span class="etq ' + ({atrasada:"atraso", hoje:"envio", feita:"ok", fim:""}[ag.tipo] || "") + '">' + esc(ag.txt) + "</span>"
              : (ag ? '<span class="mut">' + esc(ag.txt) + "</span>" : "");
      let dir = (ag ? "" : '<span class="mut">sem inspeção</span>') + tag;      /* v2.4: a tarefa do PC aparece mesmo sem inspeção */
      if (u) {
        const m = metricas(u, c);
        dir = selo(m.classe, true) + '<span class="mut">nº ' + esc(u.numero) + " · " + dataCurta(u.data) + "</span>" + tag;
      }
      h += '<button class="item" data-a="abrir-campo" data-id="' + c.id + '"><div class="t1">' + esc(c.codigo || "(sem código)") +
        (c.gleba ? '<span class="gl">' + esc(c.gleba) + "</span>" : "") + (c.exemplo ? ' <span class="etq">exemplo</span>' : "") +
        (c.dono && DB.usuario && c.dono !== DB.usuario.codigo ? ' <span class="etq envio">de ' + esc(c.donoNome || c.dono) + "</span>" : "") + "</div>" +
        '<div class="t2">' + esc(dentroDoCampo(c) || "toque para preencher os dados") + "</div>" +
        '<div class="dir">' + dir + "</div></button>";
    });
    h += "</div>";
  }
  return h;
}
