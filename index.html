<!-- v2.5: sem fonte do Google (nenhum pedido a terceiros ao abrir o app); títulos na fonte condensada do próprio aparelho -->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Caderneta de campo: uma coluna larga como a mão, números grandes, barra de abas embaixo.
   Paleta: azul de contagem (o mesmo das contagens no programa do PC) + ouro do pólen,
   neutros frios puxados para o azul; verde/amarelo/laranja/vermelho só para o RISCO. */
:root{
  --fundo:#ECF0F5; --sup:#FFFFFF; --sup2:#E3E9F1; --sup3:#F5F7FA;
  --tinta:#0E1726; --tinta2:#3E4A60; --tinta3:#66728A;
  --linha:#D0D8E3; --linha2:#AAB5C7;
  --azul:#1D4F9C; --azul-forte:#153B77; --sobre-azul:#FFFFFF; --azul-suave:#DBE5F6;
  --polen:#8F6000; --polen-fill:#F2B400; --polen-suave:#FFF1C4;
  --r0:#0B7A2A; --r0s:#DCF1E1; --r0f:#0CA30C;
  --r1:#855600; --r1s:#FFEFC2; --r1f:#FAB219;
  --r2:#A3401A; --r2s:#FBE3D8; --r2f:#EC835A;
  --r3:#AE1F27; --r3s:#F9DADA; --r3f:#D03B3B;
  --rn:#5C687E; --rns:#E3E9F1; --rnf:#B4B2AB;
  --gps:#0B7FC0; --gps-suave:#D7ECF8; --campo:#E2EDE3;
  --sombra:0 1px 2px rgb(14 23 38 / .07), 0 10px 26px -16px rgb(14 23 38 / .40);
  --veu:rgb(9 15 26 / .52);
  --f-titulo:"Barlow Semi Condensed","Roboto Condensed","sans-serif-condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --f-texto:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --raio:14px; --raio-p:10px;
  --tam:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="misto"]){
  --fundo:#0B1018; --sup:#131A25; --sup2:#1A2331; --sup3:#0F151F;
  --tinta:#E6ECF5; --tinta2:#A9B4C8; --tinta3:#7C889E;
  --linha:#253042; --linha2:#36435B;
  --azul:#7FA8F5; --azul-forte:#A9C4F8; --sobre-azul:#0A1734; --azul-suave:#18294A;
  --polen:#F2C04A; --polen-fill:#E5A800; --polen-suave:#2E2510;
  --r0:#5BCB78; --r0s:#123220; --r0f:#2DB84B;
  --r1:#F4C24E; --r1s:#33290F; --r1f:#F0B024;
  --r2:#F39A72; --r2s:#3A2117; --r2f:#EC835A;
  --r3:#F27F7F; --r3s:#3B171A; --r3f:#E05252;
  --rn:#97A3B8; --rns:#1A2331; --rnf:#6E7686;
  --gps:#58B9F2; --gps-suave:#0F2B3F; --campo:#15241A;
  --sombra:0 1px 2px rgb(0 0 0 / .45), 0 10px 26px -14px rgb(0 0 0 / .8);
  --veu:rgb(0 0 0 / .62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fundo:#0B1018; --sup:#131A25; --sup2:#1A2331; --sup3:#0F151F;
  --tinta:#E6ECF5; --tinta2:#A9B4C8; --tinta3:#7C889E;
  --linha:#253042; --linha2:#36435B;
  --azul:#7FA8F5; --azul-forte:#A9C4F8; --sobre-azul:#0A1734; --azul-suave:#18294A;
  --polen:#F2C04A; --polen-fill:#E5A800; --polen-suave:#2E2510;
  --r0:#5BCB78; --r0s:#123220; --r0f:#2DB84B;
  --r1:#F4C24E; --r1s:#33290F; --r1f:#F0B024;
  --r2:#F39A72; --r2s:#3A2117; --r2f:#EC835A;
  --r3:#F27F7F; --r3s:#3B171A; --r3f:#E05252;
  --rn:#97A3B8; --rns:#1A2331; --rnf:#6E7686;
  --gps:#58B9F2; --gps-suave:#0F2B3F; --campo:#15241A;
  --sombra:0 1px 2px rgb(0 0 0 / .45), 0 10px 26px -14px rgb(0 0 0 / .8);
  --veu:rgb(0 0 0 / .62);
  color-scheme:dark;
}
/* v2.5 (etapa 21) — tema MISTO: as duas barras (topo e abas) no escuro, o conteúdo no claro,
   sobre um fundo cinza-azulado um tom abaixo. O escuro emoldura; os números ficam no claro,
   que se lê melhor no sol. As variáveis do escuro valem só dentro das barras. */
:root[data-theme="misto"]{ --fundo:#D9E0EA; --sup2:#E6EBF2; --linha:#C7D0DD; color-scheme:light; }
:root[data-theme="misto"] .topo, :root[data-theme="misto"] .abas{
  --fundo:#0B1018; --sup:#131A25; --sup2:#1A2331; --sup3:#0F151F;
  --tinta:#E6ECF5; --tinta2:#A9B4C8; --tinta3:#7C889E;
  --linha:#253042; --linha2:#36435B;
  --azul:#7FA8F5; --azul-forte:#A9C4F8; --sobre-azul:#0A1734; --azul-suave:#18294A;
  --polen:#F2C04A; --polen-fill:#E5A800; --polen-suave:#2E2510;
  --r0:#5BCB78; --r0s:#123220; --r0f:#2DB84B;
  --r1:#F4C24E; --r1s:#33290F; --r1f:#F0B024;
  --r2:#F39A72; --r2s:#3A2117; --r2f:#EC835A;
  --r3:#F27F7F; --r3s:#3B171A; --r3f:#E05252;
  --rn:#97A3B8; --rns:#1A2331; --rnf:#6E7686;
  --gps:#58B9F2; --gps-suave:#0F2B3F; --campo:#15241A;
  --sombra:0 1px 2px rgb(0 0 0 / .45), 0 10px 26px -14px rgb(0 0 0 / .8);
  --veu:rgb(0 0 0 / .62);
  color:var(--tinta); border-color:#253042;
}
:root[data-theme="misto"] .topo{ box-shadow:0 6px 18px -10px rgb(9 15 26 / .55); }
:root[data-theme="misto"] .topo-user{ background:#2E2510; color:#F2C04A; }
/* Modo sol: contraste máximo para ler com o sol no rosto (sempre claro) */
:root[data-sol="1"]{
  --fundo:#FFFFFF; --sup:#FFFFFF; --sup2:#E9EDF3; --sup3:#FFFFFF;
  --tinta:#000000; --tinta2:#1B2433; --tinta3:#3A4559;
  --linha:#8D99AD; --linha2:#4C586E;
  --azul:#0F3F8C; --azul-forte:#0A2F6B; --sobre-azul:#FFFFFF; --azul-suave:#D2DFF5;
  --polen:#6E4800; --polen-suave:#FFE79A;
  --r0:#06601F; --r1:#6A4400; --r2:#8A3010; --r3:#931018; --rn:#3A4559;
  --campo:#E6F1E7; --sombra:none; --tam:16.5px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--f-texto);
  font-size:var(--tam);line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-titulo);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:.005em}
a{color:var(--azul)}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}

/* ---------------------------------------------------------------- casca */
.app{min-height:100%;display:flex;flex-direction:column}
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--sup);
  border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;padding:8px 16px}
.marca{width:34px;height:34px;flex:none;border-radius:9px}
.topo-txt{min-width:0;flex:1}
.topo-nome{font-family:var(--f-titulo);font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.1}
.topo-sub{font-size:12px;color:var(--tinta3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-sub b{font-weight:600}
.topo-user{margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--azul-suave);color:var(--azul-forte);font-size:12px;font-weight:600;font-family:var(--f-texto);vertical-align:2px;letter-spacing:0;white-space:nowrap}
.topo-acoes{display:flex;gap:6px;align-items:center}
.nd-bt{margin-top:8px}
.nd-bt[aria-pressed="true"]{background:var(--polen-suave);border-color:var(--polen);color:var(--polen)}
.nd-txt{font-size:.55em;color:var(--polen);font-weight:700}
.iso-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-iso{border:1px solid var(--linha2);background:var(--sup);color:var(--tinta2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.chip-iso[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul)}
.btn-ico{min-width:40px;height:40px;border-radius:11px;border:1px solid var(--linha);background:var(--sup3);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;cursor:pointer;color:var(--tinta2)}
.btn-ico:active{transform:scale(.96)}
.chip-gps{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip-gps i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rnf)}
.chip-gps.ok i{background:var(--r0f);box-shadow:0 0 0 3px var(--r0s)}
.chip-gps.fraco i{background:var(--r1f);box-shadow:0 0 0 3px var(--r1s)}
.chip-gps.busca i{background:var(--gps);animation:pisca 1.1s infinite}
.chip-gps.sim i{background:var(--polen-fill)}
.chip-gps.erro i{background:var(--r3f)}
@keyframes pisca{50%{opacity:.25}}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:14px 16px calc(98px + env(safe-area-inset-bottom,0px))}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sup);border-top:1px solid var(--linha);
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
.abas button{position:relative;background:none;border:0;border-radius:12px;padding:6px 1px 5px;cursor:pointer;color:var(--tinta3);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-titulo);font-weight:600;
  font-size:11.5px;letter-spacing:0}
@media (max-width:380px){.abas button{font-size:10.5px}.abas button .ico{width:21px;height:21px}}
.abas button .ico{width:22px;height:22px}
.abas button[aria-current="page"]{color:var(--azul);background:var(--azul-suave)}
.abas .bolinha{position:absolute;top:1px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:8px;background:var(--r3f);
  color:#fff;font-size:10px;line-height:16px;font-family:var(--f-texto);font-weight:700;padding:0 4px}

/* ---------------------------------------------------------------- blocos */
.pilha{display:flex;flex-direction:column;gap:14px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha > .cresce{flex:1;min-width:0}
.cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.cab h2{font-size:25px;font-weight:700}
.cab .sub{color:var(--tinta2);font-size:13.5px;margin-top:3px}
.rotulo{font-family:var(--f-titulo);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra)}
.cartao.pad{padding:14px 15px}
.nota{font-size:13.5px;color:var(--tinta2);background:var(--sup2);border-radius:var(--raio-p);padding:10px 12px}
.nota b{color:var(--tinta)}
.nota.alerta{background:var(--r1s);color:var(--tinta)}
.nota.erro{background:var(--r3s);color:var(--tinta)}
.vazio{text-align:center;padding:30px 18px;color:var(--tinta2)}
.vazio h3{font-size:19px;margin-bottom:6px;color:var(--tinta)}
.mono{font-family:var(--f-mono)}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--azul);text-decoration:underline;cursor:pointer}
.tag-atual{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--azul-suave);color:var(--azul);font-family:var(--f-texto);font-size:12px;font-weight:700;vertical-align:2px}
.chaves .item{display:block;cursor:default}
.chaves .item .dir.btns{display:flex;flex-direction:row;justify-content:flex-start;align-items:center;gap:8px;margin-top:9px;text-align:left}
.chaves .item .dir.btns .btn{min-height:38px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--tinta3)}
.peq{font-size:12.5px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;
  border-radius:12px;border:1px solid var(--linha2);background:var(--sup3);color:var(--tinta);cursor:pointer;
  font-family:var(--f-titulo);font-weight:600;font-size:16px;letter-spacing:.01em;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul)}
.btn.perigo{color:var(--r3);border-color:var(--r3)}
.btn.peq{min-height:38px;padding:0 12px;font-size:14.5px;border-radius:10px}
.btn.largo{width:100%}
.btn.grande{min-height:56px;font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:9px;flex-wrap:wrap}
.btns > .btn{flex:1 1 auto}

/* campos de formulário */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.form.um{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.tudo,.form>.tudo{grid-column:1/-1}
.f > label{font-family:var(--f-titulo);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta2)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid var(--linha2);border-radius:10px;background:var(--sup3)}
.f textarea{min-height:92px;resize:vertical;line-height:1.5}
.f .dica{font-size:12px;color:var(--tinta3)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--azul);outline-offset:1px;background:var(--sup)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14.5px}
.chk input{width:22px;height:22px;accent-color:var(--azul);flex:none}
.chips-reg{display:flex;flex-wrap:wrap;gap:6px}
.chip-reg{border:1px solid var(--linha2);background:var(--sup3);color:var(--tinta2);border-radius:999px;padding:6px 11px;min-height:36px;font-family:var(--f-titulo);font-weight:600;font-size:14px;cursor:pointer}
.chip-reg[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul)}
.seg{display:inline-flex;border:1px solid var(--linha2);border-radius:11px;overflow:hidden;background:var(--sup3)}
.seg button{border:0;background:none;padding:0 13px;min-height:40px;cursor:pointer;font-family:var(--f-titulo);font-weight:600;font-size:14.5px;color:var(--tinta2)}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--sobre-azul)}
.seg.regioes{align-self:flex-start;max-width:100%;overflow-x:auto}
ol.passos{margin:0;padding-left:20px;line-height:1.55;color:var(--tinta2)}ol.passos li{margin:0 0 4px}
.qq{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:4px;padding:0;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:var(--azul);font:700 13px/1 var(--f-texto);cursor:pointer;vertical-align:1px}
.risco .qq{color:inherit;opacity:.85}
.explica p{margin:0 0 10px;line-height:1.55}.explica p:last-child{margin:0}
.seg.regioes .n{font-weight:500;opacity:.75;font-size:13px;margin-left:2px}
.frases{display:flex;flex-wrap:wrap;gap:7px}
.frases button{border:1px dashed var(--linha2);background:var(--sup3);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--tinta2)}
.tab-copiar{padding:8px 12px 12px;gap:8px}
#trava-pin{position:fixed;inset:0;z-index:9999;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:var(--azul-forte);padding:20px}
#trava-pin .tp-caixa{background:var(--sup);color:var(--tinta);border-radius:18px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
#trava-pin .tp-marca{font-family:var(--f-titulo);font-size:20px}
#trava-pin input{width:100%;box-sizing:border-box;min-width:0;font-size:28px;letter-spacing:.35em;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--linha2)}
#trava-pin .tp-erro{color:var(--r3);margin:0}
.lic-pedido{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.qr-lic{flex:none;border-radius:8px;border:1px solid var(--linha)}.lic-txt{font-size:12px;overflow-wrap:anywhere}
.st-on{display:inline-flex;max-width:100%;border-radius:999px;overflow:hidden;border:1px solid var(--azul)}
.frases .st-on button{border:0;border-radius:0;background:var(--azul);color:var(--sobre-azul);font-weight:600}
.frases .st-on .st-onde{background:var(--azul-suave);color:var(--azul-forte);font-weight:600;border-left:1px solid var(--azul)}

/* risco */
.selo{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-family:var(--f-titulo);
  font-weight:700;font-size:13px;letter-spacing:.03em;border:1px solid currentColor;white-space:nowrap}
.selo i{width:8px;height:8px;border-radius:50%;background:currentColor}
.r0{color:var(--r0)} .r1{color:var(--r1)} .r2{color:var(--r2)} .r3{color:var(--r3)} .rn{color:var(--rn)}
.selo.r0{background:var(--r0s)} .selo.r1{background:var(--r1s)} .selo.r2{background:var(--r2s)} .selo.r3{background:var(--r3s)} .selo.rn{background:var(--rns)}
.risco{border-radius:var(--raio);padding:14px 15px;border:1.5px solid currentColor;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.risco.r0{background:var(--r0s)} .risco.r1{background:var(--r1s)} .risco.r2{background:var(--r2s)} .risco.r3{background:var(--r3s)} .risco.rn{background:var(--rns)}
.risco .classe{font-family:var(--f-titulo);font-weight:700;font-size:23px;letter-spacing:.01em;text-transform:uppercase}
.risco .valor{font-family:var(--f-titulo);font-weight:700;font-size:42px;line-height:.95;font-variant-numeric:tabular-nums;text-align:right}
.risco .valor small{font-size:15px;font-weight:600;display:block;letter-spacing:.06em;margin-top:7px;line-height:1.1}
.risco .motivo{grid-column:1/-1;color:var(--tinta2);font-size:13px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:9px 11px;min-width:0}
.tile .k{font-family:var(--f-titulo);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta3)}
.tile .v{font-family:var(--f-titulo);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .n{font-size:11.5px;color:var(--tinta3);line-height:1.25}

/* listas de campos e inspeções */
.lista{display:flex;flex-direction:column;gap:9px}
.item{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;cursor:pointer;
  text-align:left;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;box-shadow:var(--sombra)}
.item:active{background:var(--sup3)}
.item .t1{font-family:var(--f-titulo);font-weight:700;font-size:19px;letter-spacing:.01em;min-width:0}
.item .t1 .gl{font-weight:600;color:var(--azul);margin-left:4px}
.item .t2{font-size:13px;color:var(--tinta2);min-width:0;grid-column:1}
.item .dir{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.item .dir .mut{font-size:12px}
.etq{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sup2);color:var(--tinta2);vertical-align:2px}
.etq.envio{background:var(--polen-suave);color:var(--polen)}
.etq.ok{background:var(--r0s);color:var(--r0)}
.item[data-trav]{position:relative;overflow:hidden;touch-action:pan-y}
.item .deslize{position:absolute;top:0;right:0;bottom:0;width:104px;display:flex;align-items:center;justify-content:center;background:var(--azul);color:#fff;font-weight:700;font-size:16px;transform:translateX(100%);transition:transform .16s}
.item.deslizado .deslize{transform:none}
.nota.trava{display:flex;gap:10px;align-items:center}
.fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.foto{margin:0;background:var(--sup3);border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sup2)}
.foto figcaption{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 8px;font-size:12px;color:var(--tinta2)}
.foto figcaption .chk{grid-column:1}
.foto figcaption .leg{grid-column:1/-1;min-height:36px;padding:6px 8px;border:1px solid var(--linha2);border-radius:8px;background:var(--sup);font:inherit;font-size:13px}
.foto figcaption .btn{grid-column:2;grid-row:2}
.etq.atraso{background:var(--r2s);color:var(--r2)}
.busca{position:relative}
#lista-campos{display:contents}
.busca input{width:100%;min-height:46px;padding:9px 12px 9px 38px;border:1px solid var(--linha2);border-radius:12px;background:var(--sup)}
.busca .ico{position:absolute;left:12px;top:14px;color:var(--tinta3)}

/* seções recolhíveis */
details.sec{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden}
details.sec > summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:10px;min-height:52px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .st{font-family:var(--f-titulo);font-weight:700;font-size:17px}
details.sec > summary .sr2{font-size:12.5px;color:var(--tinta3);margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--tinta3);border-bottom:2px solid var(--tinta3);transform:rotate(45deg);margin:-4px 4px 0 6px;flex:none}
details.sec[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.sec[open] > summary{border-bottom:1px solid var(--linha)}
.sec-c{padding:14px 15px}
.sec-c.liso{padding:0}

/* grade de pontos */
.pontos{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
.pt{border:1.5px solid var(--linha2);background:var(--sup3);border-radius:11px;min-height:58px;padding:5px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.pt b{font-family:var(--f-titulo);font-size:20px;font-weight:700;line-height:1}
.pt small{font-size:10.5px;color:var(--tinta3);font-variant-numeric:tabular-nums}
.pt.feito{border-color:var(--azul);background:var(--azul-suave)}
.pt.pol{border-color:var(--r3);background:var(--r3s)}
.pt.pol small{color:var(--r3)}
.pt.atual{box-shadow:0 0 0 3px var(--polen-fill)}
.pt .g{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gps)}
.pt .g.sim{background:var(--polen-fill)}

/* contadores: − [número] + */
.ct-grupo{padding:4px 0}
.ct-tit{display:flex;align-items:baseline;gap:8px;padding:10px 15px 2px}
.ct-tit b{font-family:var(--f-titulo);font-weight:700;font-size:18px;letter-spacing:.01em}
.ct-tit span{font-size:12.5px;color:var(--tinta3)}
.ct-par{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 12px 10px;border-bottom:1px solid var(--linha)}
.ct-par:last-child{border-bottom:0}
.ct-um{display:grid;grid-template-columns:1fr;gap:8px;padding:4px 12px 10px;border-bottom:1px solid var(--linha)}
.ct{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-rows:auto auto;gap:3px 5px;align-items:center;
  border-radius:12px;padding:6px;background:var(--sup3);border:1px solid var(--linha)}
.ct.pol{background:var(--polen-suave);border-color:color-mix(in srgb,var(--polen-fill) 55%,var(--linha))}
.ct-r{grid-column:1/-1;font-family:var(--f-titulo);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);
  display:flex;align-items:center;gap:6px;padding:0 2px}
.ct.pol .ct-r{color:var(--polen)}
.ct-r .grao{width:8px;height:8px;border-radius:50%;background:var(--polen-fill);flex:none}
.ct-b{height:48px;border-radius:11px;border:1px solid var(--linha2);background:var(--sup);font-size:26px;line-height:1;cursor:pointer;
  color:var(--tinta);display:grid;place-items:center;font-family:var(--f-titulo);font-weight:600;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ct-b.mais{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul)}
.ct-b:active{transform:scale(.94)}
.ct-n{height:48px;width:100%;min-width:0;text-align:center;border:1.5px solid var(--linha2);border-radius:11px;background:var(--sup);
  font-family:var(--f-titulo);font-weight:700;font-size:27px;font-variant-numeric:tabular-nums;padding:0 2px;color:var(--tinta)}
.ct-n.zero{color:var(--tinta3);font-weight:600}
.ct-n:focus{outline:3px solid var(--azul);outline-offset:0;border-color:var(--azul)}

/* resumo do ponto */
.pt-cab{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:20;background:var(--fundo);padding:8px 0 10px;margin:-6px 0 0}
.pt-nav{display:flex;align-items:center;gap:10px}
.pt-nav h2{font-size:27px;font-weight:700}
.pt-nav h2 small{font-size:16px;color:var(--tinta3);font-weight:600}
.pt-soma{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;margin-top:9px;padding:9px 12px;border-radius:12px;background:var(--sup);border:1px solid var(--linha)}
.pt-soma .aval input{width:74px;height:42px;text-align:center;border:1.5px solid var(--linha2);border-radius:10px;background:var(--sup3);
  font-family:var(--f-titulo);font-weight:700;font-size:22px}
.pt-soma .grande{font-family:var(--f-titulo);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pt-soma .ok{color:var(--r0)} .pt-soma .mal{color:var(--r3)}
.pt-gps{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:var(--tinta2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sup);border:1px solid var(--linha);min-width:0}
.chip .ico{color:var(--gps)}
.nome-longo{font-weight:600}
.sobre-vana{margin:18px 2px 4px;padding:14px;border:1px solid var(--linha);border-radius:14px;background:var(--sup);display:grid;gap:10px}
.sv-logo svg{height:40px;width:auto;display:block}
.sv-orshu{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sv-orshu img{height:40px;width:auto}
.selo-teste{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#F2B400;color:#1B1B1B;font-family:system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;vertical-align:2px}
@media (max-width:430px){.nome-longo{display:none}}
.rodape-acao{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:30;
  padding:8px 16px;background:linear-gradient(to top,var(--fundo) 70%,transparent)}
.rodape-acao .dentro{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:9px}

/* mapa */
.mapa{border:1px solid var(--linha);border-radius:var(--raio);background:var(--sup);overflow:hidden;position:relative}
.mapa svg{display:block;width:100%;height:auto;touch-action:none}
.mapa .canto{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tinta2)}
.legenda i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.alvo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--raio);background:var(--gps-suave);border:1px solid var(--gps)}
.alvo .seta{width:46px;height:46px;flex:none;color:var(--gps)}
.alvo .dist{font-family:var(--f-titulo);font-weight:700;font-size:26px;line-height:1}

/* tabelas */
.tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linha);border-radius:12px;background:var(--sup)}
.pf-tab tr.pf-sep td{border-top:2px solid var(--linha)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--sup)}
thead th{font-family:var(--f-titulo);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);background:var(--sup3)}
thead th:first-child{background:var(--sup3)}
tbody tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--sup3)}
tr.tot td:first-child{background:var(--sup3)}
td.txt{text-align:left;white-space:normal;color:var(--tinta2);min-width:150px}
td.pol{color:var(--r3);font-weight:700}

/* mensagem */
.msg{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--sup3);border:1px solid var(--linha);
  border-radius:12px;padding:13px;max-height:56vh;overflow:auto;word-break:break-word}

/* gráfico */
.graf svg{display:block;width:100%;height:auto}
.graf .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tinta2);margin-top:6px}
.graf .leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* diálogo, aviso e barra de desfazer */
.veu{position:fixed;inset:0;background:var(--veu);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.veu{align-items:center}}
.dlg{background:var(--sup);color:var(--tinta);border-radius:18px;max-width:480px;width:100%;padding:18px;box-shadow:var(--sombra);max-height:86vh;overflow:auto}
.dlg h3{font-size:22px;margin-bottom:8px}
.dlg p{margin:0 0 12px;color:var(--tinta2);font-size:14.5px}
.dlg .btns{margin-top:14px}
.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:95;pointer-events:none;
  background:var(--tinta);color:var(--fundo);padding:11px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);
  display:flex;gap:14px;align-items:center;box-shadow:var(--sombra)}
.aviso button{pointer-events:auto;background:none;border:0;color:var(--polen-fill);font-weight:700;font-family:var(--f-titulo);font-size:15px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.faixa-previa{background:var(--polen-suave);color:var(--tinta);border:1px solid var(--polen-fill);border-radius:12px;padding:10px 12px;font-size:13px}

/* impressão (PDF) */
#imprimir{display:none}
@media print{
  :root{--fundo:#fff;--sup:#fff;--sup3:#fff;--tinta:#000;--tinta2:#222;--tinta3:#444;--linha:#bbb;--linha2:#888}
  .app,.veu,.aviso{display:none!important}
  body{background:#fff}
  #imprimir{display:block;padding:0 5mm;font-size:10pt}
  @page{size:A4;margin:12mm 10mm}
  .pr-cab{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:7px;margin-bottom:10px}
  .pr-cab h1{font-size:17pt}
  .pr-sec{margin:10px 0;break-inside:avoid}
  .pr-sec-fotos{break-inside:auto}
  .pr-fotos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pr-fotos figure{margin:0;break-inside:avoid}.pr-fotos img{width:100%;max-height:85mm;object-fit:contain;border:1px solid #bbb}
  .pr-fotos figcaption{font-size:7.5pt;color:#333;margin-top:2px}
  .pr-sec h3{font-size:10pt;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #888;padding-bottom:2px;margin-bottom:6px}
  .pr-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 14px;font-size:9pt}
  .pr-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pr-tile{border:1px solid #888;border-radius:4px;padding:4px 7px}
  .pr-tile .k{font-size:7.5pt;text-transform:uppercase;color:#333}
  .pr-tile .v{font-size:13pt;font-weight:700}
  #imprimir .tab-wrap{overflow:visible;border:0;border-radius:0}
  #imprimir table{font-size:7.5pt}
  #imprimir th,#imprimir td{padding:1.5px 3px;position:static}
  #imprimir td.txt{min-width:0}
  .pr-ass{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:9pt}
  .pr-ass div{border-top:1px solid #000;padding-top:4px;text-align:center}
  .pr-pe{margin-top:12px;border-top:1px solid #888;padding-top:5px;font-size:8pt;color:#444;display:flex;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .ct{grid-template-columns:40px minmax(0,1fr) 40px}
  .ct-b{height:46px}
  .ct-n{font-size:24px;height:46px}
  .form{grid-template-columns:1fr}
}
main.com-rodape{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.btn-ico[aria-pressed="true"]{background:var(--polen-suave);border-color:var(--polen-fill);color:var(--polen)}
.btn-ico:disabled{opacity:.35}
</style>

<div class="app">
  <header class="topo">
    <span id="marca"></span>
    <div class="topo-txt"><div class="topo-nome">Vana<span class="nome-longo"> Caderneta</span><span class="topo-user" id="topo-user" hidden></span></div><div class="topo-sub" id="topo-sub">abrindo…</div></div>
    <div class="topo-acoes">

      <button type="button" class="btn-ico" id="b-sol" aria-label="Modo sol: contraste máximo" aria-pressed="false"></button>
    </div>
  </header>
  <main id="tela"><p style="padding:24px;color:#66728A">Abrindo a Caderneta…</p></main>

</div>

<noscript><p style="padding:16px">A Caderneta precisa de JavaScript ligado no navegador.</p></noscript>

<script>
(function(){
"use strict";
/* dominio.js */
/* =====================================================================
   DOMÍNIO — regras de inspeção, iguais às do programa do PC
   (cronograma/config.py e cronograma/regras.py). Mesmos limites, mesmas
   notas, mesma mensagem: o número do celular bate com o do computador.
   ===================================================================== */
const VERSAO_APP = "2.5";
/* v2.4 — AMBIENTE DE TESTE. Com TESTE = true este app:
   • guarda os dados em chaves próprias: não enxerga nem altera os dados da Caderneta de uso
     real, mesmo publicado no mesmo site (onde o armazenamento do navegador é um só);
   • usa um cache offline próprio (sw.js?teste=1) e o manifest-teste.webmanifest;
   • marca os arquivos que gera: o programa e a Caderneta de uso real não importam nada deles.
   Só passa para false na liberação da 2.4 (ver README.md da pasta v2.4, "Liberação"). */
const TESTE = false;
const ROTULO_APP = "Vana Caderneta " + VERSAO_APP + (TESTE ? " TESTE" : "");
const ARQ_MANIFEST = TESTE ? "manifest-teste.webmanifest" : "manifest.webmanifest";
const MARCA_ARQ = TESTE ? "TESTE_" : "";      /* início do nome dos arquivos gerados */
if (TESTE) {
  try {
    const lk = document.querySelector('link[rel="manifest"]'); if (lk) lk.setAttribute("href", ARQ_MANIFEST);
    const mt = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (mt) mt.setAttribute("content", "Caderneta TESTE");
    document.title = "Caderneta TESTE";
  } catch (e) {}
}

/* ---------- tipos de planta de fêmea com pendão (PN, PM, PB, TC, PSE) */
const TIPOS = [
  {c:"PN",  nome:"Normal",     longo:"Planta normal",
   desc:"Pendão inteiro em planta de porte normal que ficou sem despendoar"},
  {c:"PM",  nome:"Média",      longo:"Planta média",
   desc:"Planta de porte intermediário — o corte passou acima/abaixo do pendão"},
  {c:"PB",  nome:"Baixa",      longo:"Planta baixa (dominada)",
   desc:"Planta baixa/dominada que a máquina não alcança; emite pendão depois"},
  {c:"TC",  nome:"Toco",       longo:"Toco",
   desc:"Pendão cortado pela metade que segue liberando pólen"},
  {c:"PSE", nome:"Engaiolado", longo:"Pendão sob espiga (engaiolado)",
   desc:"Pendão cortado que ficou preso nas folhas acima da espiga — libera pólen por ~5 dias"},
];
const COD_TIPOS = TIPOS.map(t => t.c);
const NOME_TIPO = {}; TIPOS.forEach(t => { NOME_TIPO[t.c] = t.nome; });
const CH_P  = COD_TIPOS.map(t => t + "P");    // polinizando
const CH_NP = COD_TIPOS.map(t => t + "NP");   // não polinizando
const CH_BASE = [];                           // compõem as plantas do ponto (com o P.T.)
TIPOS.forEach(t => CH_BASE.push(t.c + "P", t.c + "NP"));

const MACHOS = ["M1P", "M2P", "M3P"];
const SIGLA_MACHO = {M1P:"M.P.1", M2P:"M.P.2", M3P:"M.P.3"};
/* atípicas: rogue (fora de tipo) e tiguera (milho voluntário), na fêmea e no macho */
const ATIPICAS = [
  {k:"RPF",  s:"R.P.F",   n:"Rogue polinizando na fêmea",          grupo:"Rogue na fêmea",   pol:1},
  {k:"RNPF", s:"R.N.P.F", n:"Rogue não polinizando na fêmea",      grupo:"Rogue na fêmea"},
  {k:"TPF",  s:"T.P.F",   n:"Tiguera polinizando na fêmea",        grupo:"Tiguera na fêmea", pol:1},
  {k:"TNPF", s:"T.N.P.F", n:"Tiguera não polinizando na fêmea",    grupo:"Tiguera na fêmea"},
  {k:"RPM",  s:"R.P.M",   n:"Rogue polinizando no macho",          grupo:"Rogue no macho",   pol:1},
  {k:"RNPM", s:"R.N.P.M", n:"Rogue não polinizando no macho",      grupo:"Rogue no macho"},
  {k:"TPM",  s:"T.P.M",   n:"Tiguera polinizando no macho",        grupo:"Tiguera no macho", pol:1},
  {k:"TNPM", s:"T.N.P.M", n:"Tiguera não polinizando no macho",    grupo:"Tiguera no macho"},
];
const CH_ATIP = ATIPICAS.map(a => a.k);
const ATIP_POL = ["RPF", "TPF", "RPM", "TPM"];
/* pares POL / NÃO POL das atípicas, para a tela de contagem */
const PARES_ATIP = [
  {g:"Rogue na fêmea", p:"RPF", np:"RNPF"}, {g:"Tiguera na fêmea", p:"TPF", np:"TNPF"},

/* =================================================== números como no Python */
/* Formata com `casas` decimais arredondando como o Python (empate exato vai para o par:
   0,125 → 0,12). Assim F.F.P de 1 planta em 800 sai igual no celular e no PC. */
function fixo(x, casas){
  if (x == null || !isFinite(x)) return String(x);
  const neg = x < 0, a = Math.abs(x);
  let s = a.toFixed(casas);
  const t = a.toFixed(casas + 25);
  if (t.slice(-25) === "5" + "0".repeat(24)) {
    const base = t.slice(0, t.length - 25);
    const ultimo = +base.replace(".", "").slice(-1);
    if (ultimo % 2 === 0) s = base.endsWith(".") ? base.slice(0, -1) : base;
  }
  return (neg && +s !== 0 ? "-" : "") + s;
}
function arred(x, casas){ return parseFloat(fixo(x, casas)); }
/* sum() do Python 3.12+ (soma compensada de Neumaier): 0,333… + 0,5 + … dá o mesmo
   último dígito que no programa do PC — importa quando dois dias empatam na F.F.P. */
function somaPy(vals){
  let f = null, c = 0;
  for (const x of vals) {
    if (f === null) { f = 0 + x; continue; }
    const t = f + x;
    if (Math.abs(f) >= Math.abs(x)) c += (f - t) + x; else c += (x - t) + f;
    f = t;
  }
  if (f === null) return 0;
  if (c && isFinite(c)) f += c;
  return f;
}
function arredPar(x){ return arred(x, 0); }           // round() do Python
function num(v, padrao){
  if (padrao === undefined) padrao = 0;
  if (v == null || v === "") return padrao;
  if (typeof v === "number") return isFinite(v) ? v : padrao;
  const n = parseFloat(String(v).replace(",", ".").trim());
  return isFinite(n) ? n : padrao;
}
function fmtPct(v, casas){ if (casas == null) casas = 2; return v == null ? "—" : fixo(v, casas).replace(".", ",") + "%"; }
function fmtNum(v, casas){ if (casas == null) casas = 2; return v == null ? "—" : fixo(v, casas).replace(".", ","); }
function semAcento(s){ return String(s == null ? "" : s).normalize("NFKD").replace(/[̀-ͯ]/g, ""); }
function semAcentoMaius(s){ return semAcento(s).trim().toUpperCase(); }

/* ---------- contrato e gleba escritos do mesmo jeito que no programa do PC */
function normContrato(s){
  s = String(s == null ? "" : s).trim().toUpperCase();
  const m = s.match(/M2V\d{4}/);
  if (m) return m[0];
  if (/^\d{4}$/.test(s)) return "M2V" + s;
  return s;
}
function normGleba(s){
  s = String(s == null ? "" : s).trim().toUpperCase();
  if (!s || s === "NONE" || s === "-" || s === "0") return "";
  if (/^\d+$/.test(s)) return "G" + parseInt(s, 10);
  if (/^G\s*\d+$/.test(s)) return "G" + s.slice(1).trim();
  if (/^GLEBA\s*\d+$/.test(s)) return "G" + s.replace(/\D/g, "");
  return s.charAt(0) === "G" ? s : "G" + s;
}

/* ---------- datas (texto ISO aaaa-mm-dd) */
function diaNum(iso){ const p = String(iso).split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
function isoDeDia(n){ return new Date(n * 864e5).toISOString().slice(0, 10); }
function dataCurta(iso){ if (!iso) return ""; const p = String(iso).split("-"); return p[2] + "/" + p[1]; }
function dataBR(iso){ if (!iso) return ""; const p = String(iso).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(iso); }
function dataBRcurto(iso){ if (!iso) return ""; const p = String(iso).split("-"); return p[2] + "/" + p[1] + "/" + p[0].slice(2); }

/* =================================================== contagem */
function plantasDoPonto(p, ppp){
  return (p.avaliadas != null && p.avaliadas !== "") ? num(p.avaliadas) : ppp;
}
function somaPendoes(p){ return CH_BASE.reduce((s, k) => s + num(p.c && p.c[k]), 0); }
function ptDoPonto(p, ppp){ return Math.max(0, plantasDoPonto(p, ppp) - somaPendoes(p)); }
function pontoFeito(p){
  if (!p) return false;
  if (p.feito) return true;
  if (p.avaliadas != null && p.avaliadas !== "" && num(p.avaliadas) > 0) return true;
  return CH_PONTO.some(k => num(p.c && p.c[k]) > 0);
}
function polDoPonto(p){ return CH_P.reduce((s, k) => s + num(p.c && p.c[k]), 0); }

/* Soma os pontos feitos e converte em % sobre as plantas avaliadas.
   machos: quantos machos o campo tem (1–3) — os que não existem ficam "—", não 0%. */
function agregar(pontos, opc){
  opc = opc || {};
  const ppp = num(opc.ppp, PLANTAS_POR_PONTO) || PLANTAS_POR_PONTO;
  const nMachos = Math.max(1, Math.min(3, num(opc.machos, 2) || 2));
  const pts = (pontos || []).filter(pontoFeito);
  const m = {n: pts.length, previstos: (pontos || []).length, base: 0, soma: {}, pct: {}, fora: {}};
  if (!pts.length) return completar(m);
  m.base = pts.reduce((s, p) => s + plantasDoPonto(p, ppp), 0);
  if (m.base <= 0) return completar(m);
  const chaves = CH_BASE.concat(["ER"], MACHOS.slice(0, nMachos), CH_ATIP);
  if (pts.some(p => num(p.c && p.c.FP) > 0)) chaves.push("FP");
  chaves.forEach(k => {
    const s = pts.reduce((a, p) => a + num(p.c && p.c[k]), 0);
    m.soma[k] = s; m.pct[k] = s / m.base * 100;
  });
  /* v2.5 (etapa 21): P.T. só dos pontos já despendoados (P.T. > 0) — bloco que ainda não foi
     despendoado não entra (10 repetições, 3 sem despendoar → soma ÷ 7). E.R. e M.P. com todos. */
  const comPT = pts.filter(p => !p.nd && ptDoPonto(p, ppp) > 0);       /* nd: bloco marcado "não despendoado" */
  const sPT = comPT.reduce((a, p) => a + ptDoPonto(p, ppp), 0), bPT = comPT.reduce((a, p) => a + plantasDoPonto(p, ppp), 0);
  m.soma.PT = sPT; m.pct.PT = bPT > 0 ? sPT / bPT * 100 : 0;
  m.nPT = comPT.length;
  return completar(m);
}
function completar(m){
  const tem = Object.keys(m.pct).length > 0;
  const soma = ks => somaPy(ks.map(k => m.pct[k] || 0));
  m.temDados = tem;
  m.ffp = tem ? soma(CH_P) : null;
  m.ffnp = tem ? soma(CH_NP) : null;
  m.er = m.pct.ER == null ? null : m.pct.ER;
  m.pt = m.pct.PT == null ? null : m.pct.PT;
  const ms = MACHOS.filter(k => m.pct[k] != null).map(k => m.pct[k]);
  m.mp = ms.length ? Math.max.apply(null, ms) : null;
  m.atip = tem ? soma(ATIP_POL) : null;
  m.classe = classificarRisco(tem ? m.ffp : null, m.atip, m.er);
  m.notaDesp = notaDespendoamento(m.ffp, m.er);
  m.notaAtip = notaAtipicas(m.atip, m.er);
  m.get = k => (k === "FFP" ? m.ffp : (m.pct[k] == null ? null : m.pct[k]));
  return m;
}
/* métricas de uma inspeção (com o caminhamento) */
function metricas(insp, campo){
  campo = campo || {};
  const m = agregar(insp.pontos, {ppp: campo.plantasPorPonto, machos: campo.machos});
  m.fora = {};
  CH_FORA.forEach(k => { const v = num(insp.caminhamento && insp.caminhamento[k]); if (v) m.fora[k] = v; });
  const f = ks => ks.reduce((s, k) => s + (m.fora[k] || 0), 0);
  m.foraFemeaPol = f(CH_P); m.foraRoguePol = f(["RPF", "RPM"]);
  m.foraAtipPol = f(ATIP_POL); m.foraPolinizando = f(CH_P.concat(ATIP_POL));
  return m;
}
function composicao(m, polinizando){
  const suf = polinizando === false ? "NP" : "P", out = {};
  COD_TIPOS.forEach(t => { out[t] = m.pct[t + suf] || 0; });
  return out;
}

/* =================================================== classificação e notas */
function indice(valor, limites, casas){
  const v = arred(valor, casas);
  for (let i = 0; i < limites.length; i++) if (v <= limites[i]) return i;
  return limites.length - 1;
}
function classificarRisco(ffp, atip, er){
  if (ffp == null) return {nome:"Sem dados", css:"rn", motivo:"Sem contagem registrada", nivel:-1};
  if (!temRegras()) return {nome:"Sem regras", css:"rn", motivo:SEM_REGRAS, nivel:-1};
  const iF = indice(ffp, CLASSES.map(c => c[1]), 2);
  const iA = indice(atip || 0, CLASSES.map(c => c[2]), 3);
  const i = Math.max(iF, iA), nome = CLASSES[i][0];
  const mot = ["F.F.P " + fmtPct(ffp)];
  if (atip) mot.push("atípicas polinizando " + fmtPct(atip, 3));
  if (er != null && er < ER_MINIMO) mot.push("E.R. " + fmtPct(er, 2) + " (< " + ER_MINIMO + "%)");
  return {nome: nome, css: CLASSE_CSS[nome], motivo: mot.join(" · "), nivel: i};
}
function classePorNivel(n){
  if (n == null || n < 0 || !temRegras()) return {nome:"Sem dados", css:"rn", motivo:"", nivel:-1};
  return {nome: CLASSES[n][0], css: CLASSE_CSS[CLASSES[n][0]], motivo:"", nivel:n};
}
function colunaER(er){
  if (er == null || !NOTA_DESP_COLUNAS) return null;
  for (let j = 0; j < NOTA_DESP_COLUNAS.length; j++) if (arred(er, 1) <= NOTA_DESP_COLUNAS[j]) return j;
  return NOTA_DESP_COLUNAS.length - 1;
}
function notaDespendoamento(ffp, er){
  if (ffp == null || er == null || !NOTA_DESP) return null;
  return NOTA_DESP[indice(ffp, NOTA_DESP_LINHAS, 2)][colunaER(er)];
}
function notaAtipicas(atip, er){
  if (atip == null || er == null || !NOTA_ATIP) return null;
  return NOTA_ATIP[indice(atip, NOTA_ATIP_LINHAS, 2)][colunaER(er)];
}
function notaPorHa(total, area, tabela){
  if (!area || !tabela) return null;
  const v = arred(total / area, 3);
  for (let i = 0; i < tabela.length; i++) {
    if (i === 0 && v < tabela[i][0]) return tabela[i][1];
    if (i > 0 && v <= tabela[i][0]) return tabela[i][1];
  }
  return tabela[tabela.length - 1][1];
}
function notaCoincidencia(dias, lado){
  const tab = lado === "femea" ? COINC_FEMEA : COINC_POLINIZADOR;
  if (!tab) return [null, ""];
  dias = Math.abs(dias);
  for (const [lim, nota, txt] of tab) if (dias <= lim) return [nota, txt];
  return [tab[tab.length - 1][1], tab[tab.length - 1][2]];
}
/* v2.5: o "porquê" de cada número (ícone ?) — a conta com os números deste campo/inspeção */
const fx2 = (v, c) => v == null ? "—" : fmtPct(v, c == null ? 2 : c);
function faixasTxt(lims, casas, rotulos){
  return lims.map((l, j) => (j === lims.length - 1 && !isFinite(l) ? "acima de " + fmtPct(lims[j - 1], casas) : "até " + fmtPct(l, casas)) + " → " + rotulos[j]).join("; ");
}
function explicacao(k, X){
  if (!temRegras()) return "<p>" + esc(SEM_REGRAS) + "</p>";
  const p = s => "<p>" + s + "</p>";
  if (k === "classe") {
    const m = X, iF = m.ffp == null ? -1 : indice(m.ffp, CLASSES.map(c => c[1]), 2), iA = indice(m.atip || 0, CLASSES.map(c => c[2]), 3);
    if (m.ffp == null) return p("Sem contagem: ainda não há pontos contados.");
    return p("<b>P.P " + fx2(m.ffp) + "</b> → " + esc(CLASSES[iF][0]) + " (limites: " + CLASSES.slice(0, 3).map(c => fmtPct(c[1], 2)).join(" · ") + ").") +
      p("<b>Atípicas polinizando " + fx2(m.atip || 0, 3) + "</b> → " + esc(CLASSES[iA][0]) + " (limites: " + CLASSES.slice(0, 3).map(c => fmtPct(c[2], 2)).join(" · ") + ").") +
      p("Vale a pior das duas: <b>" + esc(CLASSES[Math.max(iF, iA)][0]) + "</b>. A P.P soma só os tipos que soltam pólen (POL); NPOL não entra." +
        (m.er != null && ER_MINIMO != null && m.er < ER_MINIMO ? " Atenção: E.R. " + fx2(m.er) + " ainda abaixo de " + ER_MINIMO + "% (início das inspeções)." : ""));
  }
  if (k === "desp" || k === "atip") {
    const ehD = k === "desp", v = ehD ? X.picoFfp : X.rogAtip, er = ehD ? X.picoErDia : X.rogEr, dia = ehD ? X.picoFfpData : X.rogData, nota = ehD ? X.notaDesp : X.notaRogue;
    const linhas = ehD ? NOTA_DESP_LINHAS : NOTA_ATIP_LINHAS, tab = ehD ? NOTA_DESP : NOTA_ATIP;
    if (v == null || er == null || !tab) return p("Ainda sem contagem com " + (ehD ? "P.P" : "atípicas") + " e E.R. no mesmo dia.");
    const li = indice(v, linhas, 2), co = colunaER(er);
    const colTxt = ["E.R. até " + fmtPct(NOTA_DESP_COLUNAS[0], 0), "E.R. de " + fmtPct(NOTA_DESP_COLUNAS[0] + 0.1, 1) + " a " + fmtPct(NOTA_DESP_COLUNAS[1], 0), "E.R. acima de " + fmtPct(NOTA_DESP_COLUNAS[1], 0)][co];
    return p("Vale o dia com " + (ehD ? "a maior P.P" : "mais atípicas polinizando") + ": <b>" + dataBR(dia) + "</b>.") +

      p("Diferença: <b>" + d + (d === 1 ? " dia" : " dias") + "</b>, " + (X.coincLado === "femea" ? "a fêmea chegou primeiro (tabela da fêmea)" : "o macho chegou primeiro (tabela do polinizador)") + ": " +
        tab.map(([lim, n, txt], j) => (isFinite(lim) ? "até " + lim + " d" : "mais") + " = " + n + " (" + txt + ")").join(" · ") + ".") +

      p("O somatório por hectare (caminhamento + pontos) aparece no relatório, mas não compõe a faixa.");

function dlgExplica(k, X, titulo){

function faixaQFS(notas){
  const ns = notas.filter(n => n);
  if (!ns.length) return ["Sem dados", "sem notas"];
  const n9 = ns.filter(n => n === 9).length, n5 = ns.filter(n => n === 5).length;
  if (n9 >= 1) return ["Amarela", n9 + " nota(s) 9"];
  if (n5 >= 2) return ["Amarela", n5 + " notas 5"];
  return ["Livre", n5 === 1 ? "uma nota 5" : "todas as notas 1"];
}
function isolamentoIrregular(v){
  const t = semAcento(v || "").toLowerCase().split(/\s+/).filter(Boolean).join(" ");
  if (t === "nao conforme") return true;
  if (t === "conforme") return false;
  return null;
}

/* =================================================== calculadoras */
function pontosRecomendados(area){
  if (!num(area) || !PONTOS_POR_AREA) return 18;
  for (const [lim, n] of PONTOS_POR_AREA) if (num(area) <= lim) return n;
  return PONTOS_POR_AREA[PONTOS_POR_AREA.length - 1][1];
}
/* Blocos pulados entre os pontos. areaHa = área do PIVÔ INTEIRO.
   Pivô inteiro: raio × 2; GLEBA (meio pivô): só o raio — NÃO multiplica por 2.
   Ida e volta: metade dos pontos na ida e metade na volta. */
/* v2.4 — gleba de uma divisão (opt = {areaGleba, forma, extensao}): fatia ou meio ("setor") anda
   do centro à borda (o raio); "faixa" ou "parte" usa a extensão da própria gleba no sentido da ida. */
/* v2.5 (etapa 21): 2ª conta — a mesma com ~10 blocos a menos (entra ~4 blocos antes do 1º ponto e
   para antes da borda no último). Os pontos se dividem pelos dois lados: 21 → 11 na ida e 10 na volta. */
function comEntrada(d, largura){
  if (!d) return d;
  const e = Math.max(0, num((DB && DB.cfg && DB.cfg.blocosEntrada) != null && DB.cfg.blocosEntrada !== "" ? DB.cfg.blocosEntrada : 10, 10));
  const uteis = Math.max(d.blocos - e, 1), n = Math.round(num(d.pontos));
  const ida = d.idaVolta ? Math.ceil(n / 2) : n, volta = d.idaVolta ? Math.floor(n / 2) : 0;
  const pul = k => k ? Math.max(1, Math.floor(uteis / k + 1e-9)) : null;
  d.entrada = e; d.blocosUteis = uteis; d.ptsIda = ida; d.ptsVolta = volta;
  d.pularIda = pul(ida); d.pularVolta = pul(volta);
  d.metrosIda = d.pularIda ? d.pularIda * largura : null; d.metrosVolta = d.pularVolta ? d.pularVolta * largura : null;
  return d;
}
function textoEntrada(cb){
  if (!cb || cb.pularIda == null) return "";
  if (!cb.ptsVolta) return cb.ptsIda + " pontos: pular " + cb.pularIda;
  if (cb.ptsIda === cb.ptsVolta) return cb.ptsIda + " por lado: pular " + cb.pularIda;
  return "ida " + cb.ptsIda + " pts: " + cb.pularIda + " · volta " + cb.ptsVolta + " pts: " + cb.pularVolta;
}
function caminhamentoBlocos(areaHa, largura, pontos, gleba, idaVolta, opt){
  areaHa = num(areaHa); largura = num(largura); opt = opt || {};
  if (!areaHa || !largura) return null;
  if (idaVolta == null) idaVolta = true;
  if (gleba && num(opt.areaGleba) && (opt.forma === "faixa" || opt.forma === "parte")) {
    const ag = num(opt.areaGleba), pts = num(pontos) || pontosRecomendados(ag);
    const ext = num(opt.extensao) || Math.sqrt(ag * 1e4), blocos = ext / largura, pp = idaVolta ? pts / 2 : pts;
    const pular = blocos / pp, pularInt = Math.max(1, Math.floor(pular + 1e-9));
    return comEntrada({raio:null, extensao:ext, blocos, pontos:pts, porPerna:pp, pular, pularInt, metrosInt:pularInt * largura,
            metros:pular * largura, gleba:true, idaVolta:!!idaVolta, areaContada:ag, formaGleba:opt.forma}, largura);
  }
  const areaContada = gleba ? (num(opt.areaGleba) || areaHa / 2) : areaHa;
  pontos = num(pontos) || pontosRecomendados(areaContada);
  const raio = Math.sqrt(areaHa / Math.PI) * 100;
  const extensao = gleba ? raio : 2 * raio;
  const blocos = extensao / largura;
  const porPerna = idaVolta ? pontos / 2 : pontos;
  const pular = blocos / porPerna;
  /* v2.4: no campo se pulam blocos INTEIROS — arredonda para baixo, para o caminhamento caber no campo */
  const pularInt = Math.max(1, Math.floor(pular + 1e-9));
  return comEntrada({raio, extensao, blocos, pontos, porPerna, pular, pularInt, metrosInt: pularInt * largura, metros: pular * largura,
          gleba: !!gleba, idaVolta: !!idaVolta, areaContada}, largura);
}

/* =================================================== fase da curva */
/* itens da série: {data, numero, er, mp, seco} (da própria caderneta ou do histórico do PC) */
function cmpItem(a, b){ return a.data < b.data ? -1 : a.data > b.data ? 1 : (num(a.numero) - num(b.numero)); }
function faseCurva(atual, historico, nPlan){
  const ant = (historico || []).filter(c => cmpItem(c, atual) < 0).sort(cmpItem);
  const er = atual.er, mp = atual.mp;
  const vazio = {codigo:"sem", texto:FASES_CURVA.sem, final:false, erPico:null, mpPico:null, detalhe:""};
  if (er == null && mp == null) return vazio;
  if (!temRegras()) return Object.assign(vazio, {texto:"Sem regras (receba os campos do PC)"});
  const ers = ant.map(c => c.er).filter(v => v != null);
  const mps = ant.map(c => c.mp).filter(v => v != null);
  const erPico = (ers.length || er != null) ? Math.max.apply(null, ers.concat(er != null ? [er] : [])) : null;
  const mpPico = (mps.length || mp != null) ? Math.max.apply(null, mps.concat(mp != null ? [mp] : [])) : null;
  const erCaindo = er != null && ers.length > 0 && erPico >= CURVA_PICO_MIN_ER && er < erPico * CURVA_QUEDA;
  const mpCaindo = mp != null && mps.length > 0 && mpPico >= CURVA_PICO_MIN_MP && mp < mpPico * CURVA_QUEDA;
  const seco = atual.seco != null && atual.seco !== "" && num(atual.seco) >= ESTIGMA_SECO_FIM;
  const ultima = !!num(nPlan) && num(atual.numero) >= num(nPlan);
  const det = [];
  if (er != null && ers.length) det.push("E.R. " + fmtPct(ers[ers.length - 1], 2) + "→" + fmtPct(er, 2) + " (pico " + fmtPct(erPico, 2) + ")");
  if (mp != null && mps.length) det.push("pólen " + fmtPct(mps[mps.length - 1], 2) + "→" + fmtPct(mp, 2) + " (pico " + fmtPct(mpPico, 2) + ")");
  if (seco) det.push("estigma seco " + fmtPct(num(atual.seco), 2));
  if (ultima) det.push("contagem " + atual.numero + " de " + nPlan + " previstas");
  let cod;
  if (seco) cod = "final";
  else if (erCaindo && (mpCaindo || !mps.length || ultima)) cod = ultima ? "final" : "queda";
  else if (erCaindo || (ultima && (mpCaindo || (er != null && er >= 85)))) cod = "queda";
  else if (er != null && er < ER_MINIMO && !ers.length) cod = "pre";
  else if (er != null && erPico && er >= 50 && er >= erPico * CURVA_QUEDA) cod = "pico";
  else cod = "subida";
  return {codigo: cod, texto: FASES_CURVA[cod], final: cod === "queda" || cod === "final",
          erPico, mpPico, detalhe: det.join(" · ")};
}

/* =================================================== recomendações */
function recomendacoes(ctx){
  /* ctx: {insp, met, itemAtual, historico (itens), anteriorMet, nPlan} */
  const met = ctx.met, insp = ctx.insp, r = [];
  if (!met.temDados) return "• Registre ao menos um ponto de contagem.";
  if (!temRegras()) return "• " + SEM_REGRAS;
  const fase = faseCurva(ctx.itemAtual, ctx.historico, ctx.nPlan);
  const cl = met.classe, ffp = met.ffp, er = met.er;
  if (fase.final) {
    if (fase.codigo === "queda" && cl.nivel >= 3 && er != null && er >= ER_ENTRADA_QUEDA)
      r.push("CRÍTICO com o florescimento em queda (" + cl.motivo + "), mas a fêmea ainda está " +
             "receptiva (E.R. " + fmtPct(er, 2) + "): avaliar com o RC uma entrada PONTUAL só nos focos.");
    else
      r.push(cl.nome + " (" + cl.motivo + "). " + fase.texto + ": NÃO é necessária entrada de " +
             "equipe — pendões e estigmas já estão em queda. Registrar e seguir o acompanhamento até o encerramento.");
  } else {
    const acao = {3:"CRÍTICO — NECESSÁRIO ENTRADA imediata (repasse de despendoamento)",
      2:"Risco alto — NECESSÁRIO ENTRADA urgente (repasse)",
      1:"Risco moderado — programar entrada/repasse nas áreas com pendão",
      0:"Risco baixo — sem necessidade de entrada; manter padrão de despendoamento e frequência de inspeção"};
    r.push(acao[cl.nivel] + " (" + cl.motivo + ").");
  }
  if (cl.nivel >= 1 && !fase.final) {
    const comp = composicao(met), tot = somaPy(COD_TIPOS.map(t => comp[t]));
    if (tot) {
      const ordem = COD_TIPOS.slice().sort((a, b) => comp[b] - comp[a]);   // estável, como o sorted do Python
      const focos = ordem.filter(t => comp[t]).map(t => NOME_TIPO[t] + " " + fmtPct(comp[t] / tot * 100));
      r.push("Composição da F.F.P: " + focos.join(" · ") + ".");
      r.push("Foco: " + ACAO_TIPO[ordem[0]] + ".");
    }
  }
  if (met.atip) r.push("Eliminar plantas atípicas (rogue/tiguera) polinizando e mapear separadamente " +
                       "fêmea e macho; enviar fotos para a Qualidade.");
  if (er != null) r.push("Estigma receptivo " + fmtPct(er, 2) + " — " + fase.texto.toLowerCase() +
                         (fase.detalhe ? " (" + fase.detalhe + ")" : "") + ".");
  if (fase.codigo === "final") r.push("Encerrar as inspeções quando ≥ " + ESTIGMA_SECO_FIM + "% de estigma seco e " +
                                      fmtPct(PENDAO_TIRADO_META, 1) + " de pendão tirado (exceto problema de coincidência).");
  const machos = MACHOS.filter(k => met.pct[k] != null).map(k => [k, met.pct[k]]);
  if (machos.length >= 2 && machos.some(x => x[1]) && !fase.final) {
    let menor = machos[0]; machos.forEach(x => { if (x[1] < menor[1]) menor = x; });
    r.push("Acompanhar " + SIGLA_MACHO[menor[0]] + " (" + fmtPct(menor[1], 2) + "), o menor índice de pólen, para sincronia com a espiga.");
  }
  if (met.pt != null && met.pt && met.pt < PENDAO_TIRADO_META)
    r.push("Pendão tirado em " + fmtPct(met.pt, 2) + " (meta " + fmtPct(PENDAO_TIRADO_META, 1) + ").");
  if (met.foraPolinizando) {
    const det = COD_TIPOS.filter(t => met.fora[t + "P"]).map(t => Math.trunc(met.fora[t + "P"]) + " " + NOME_TIPO[t].toLowerCase());
    r.push("Remover as " + Math.trunc(met.foraPolinizando) + " plantas polinizando vistas no caminhamento" +
           (det.length ? " (" + det.join(", ") + ")" : "") + ".");
  }
  if (isolamentoIrregular(insp.isolamento)) r.push("Isolamento NÃO conforme — comunicar o responsável e registrar irregularidade (informar precisão do GPS).");
  const ant = (ctx.historico || []).filter(c => cmpItem(c, ctx.itemAtual) < 0).sort(cmpItem);
  if (ant.length) {
    const a = ant[ant.length - 1];
    if (a.ffp != null && ffp != null && ffp > a.ffp)
      r.push("F.F.P subiu de " + fmtPct(a.ffp) + " para " + fmtPct(ffp) + " desde a contagem nº " + a.numero + " (" + dataCurta(a.data) + ").");
  }
  return r.map(x => "• " + x).join("\n");
}

/* =================================================== observações sugeridas */
function observacoesSugeridas(ctx){
  const met = ctx.met;
  const fase = faseCurva(ctx.itemAtual, ctx.historico, ctx.nPlan);
  const est = {pre:"INICIANDO A EMISSAO.", subida:"RECEPTIVOS E SUBINDO.", pico:"RECEPTIVOS, NO PICO.",
               queda:"RECEPTIVOS, COMECANDO A SECAR.", final:"SECOS E SECANDO."}[fase.codigo];
  const linhas = [];
  if (est) linhas.push("- ESTIGMAS - " + est);
  const ant = (ctx.historico || []).filter(c => cmpItem(c, ctx.itemAtual) < 0).sort(cmpItem);
  const a = ant.length ? ant[ant.length - 1] : null;
  MACHOS.forEach((k, i) => {
    const v = met.pct[k];
    if (v == null) return;
    const va = a && a.machos ? a.machos[k] : null;
    const caindo = va != null && v < va * 0.85;
    let txt;
    if (caindo && v <= 30) txt = "POLINIZADO, SECANDO.";
    else if (caindo) txt = "POLINIZANDO, EVENTUAIS SECOS E SECANDO.";
    else if (v >= 50) txt = "POLINIZANDO.";
    else if (v >= 10) txt = "INICIANDO A POLINIZACAO.";
    else txt = (va != null && va > 30) ? "POLINIZADO E ABERTOS." : "PENDOES ABRINDO.";
    linhas.push("- MACHO" + (i + 1) + ": " + txt);
  });
  return linhas.join("\n\n");
}

/* =================================================== mensagem (modelo da equipe) */
const MSG_PADRAO = {decimal:".", maiusculas:true, recomendacao:"risco", proxima:false};
function nMsg(v, casas, dec){
  if (v == null) return "-";
  let t = fixo(arred(+v, casas), casas);
  if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, "");
  return (t || "0").replace(".", dec || ".");
}
function mensagemWhatsapp(ctx){
  /* ctx: {insp, campo, met, recTexto, obsTexto, opc} */
  const opc = Object.assign({}, MSG_PADRAO, ctx.opc || {});
  const i = ctx.insp, c = ctx.campo || {}, met = ctx.met, cl = met.classe, d = opc.decimal;
  let campo = (c.codigo || "").trim() || "-";
  const safra = String(c.safra || "").trim();
  if (safra) {
    const m = safra.match(/([A-Za-zÀ-ÿ]+)\s*(\d+)/);
    campo += m ? " " + m[1].toUpperCase() + ":" + m[2] : (/^\d+$/.test(safra) ? " VER:" + safra : " " + safra);
  }
  if (c.pivo) campo += " PIVÔ: " + c.pivo;
  if (c.gleba) {
    const m = String(c.gleba).match(/(\d+)/);
    campo += m ? " GLEBA-" + String(+m[1]).padStart(2, "0") : " " + c.gleba;
  }
  const hib = c.hibrido || "-";        /* como está no cadastro */
  const rc = i.representante || c.rc || "-";
  let situacao = cl.nome.toUpperCase().startsWith("RISCO") ? cl.nome : "RISCO " + cl.nome;
  if (cl.nivel < 0) situacao = "SEM DADOS";
  /* v2.4: modelo padrão da equipe (acentos, ano com 4 dígitos, STATUS MONITORAMENTO sem dois-pontos) */
  const L = ["*INSPEÇÃO DE FLORESCIMENTO*",
    "DATA: " + dataBR(i.data),
    "NÚMERO: " + i.numero,
    "CAMPO: " + campo,
    "REPRESENTANTE DE CAMPO: " + rc,
    "HÍBRIDO: " + hib];
  const iso = fraseIsolado(c);                       /* v2.5 (etapa 21) */
  if (iso) L.push(iso);
  L.push("*SITUACAO DO CAMPO: " + semAcentoMaius(situacao) + "*");
  const stS = statusExtras(i, "s");
  if (stS.length) L.push("*STATUS: " + stS.join(" / ") + "*");        /* v2.5: status extras */
  L.push("", "*CONTAGEM:*");
  if (met.ffp) L.push("P.P: " + nMsg(met.ffp, 3, d));   /* só quando há polinizando */
  L.push("PT: " + nMsg(met.pt, 2, d), "ER: " + nMsg(met.er, 2, d));
  MACHOS.forEach((k, j) => { if (met.pct[k] != null) L.push("MP" + (j + 1) + ": " + nMsg(met.pct[k], 2, d)); });
  COD_TIPOS.forEach(t => [["P", "POL"], ["NP", "NPOL"]].forEach(([suf, nome]) => {
    const v = met.pct[t + suf]; if (v) L.push(MSG_TIPOS[t] + " " + nome + ": " + nMsg(v, 3, d));
  }));
  MSG_ATIPICAS.forEach(([k, rot]) => { if (met.pct[k]) L.push(rot + ": " + nMsg(met.pct[k], 3, d)); });
  L.push("", "*CAMINHAMENTO:*");
  const fora = [];
  COD_TIPOS.forEach(t => [["P", "POL"], ["NP", "NPOL"]].forEach(([suf, nome]) => {
    const v = met.fora[t + suf]; if (v) fora.push(MSG_TIPOS[t] + " " + nome + ": " + Math.trunc(v));
  }));
  MSG_ATIPICAS.forEach(([k, rot]) => { if (met.fora[k]) fora.push(rot + ": " + Math.trunc(met.fora[k])); });
  L.push.apply(L, fora.length ? ["FORAM ENCONTRADOS NO CAMINHAMENTO:"].concat(fora) : ["SEM OCORRÊNCIAS."]);
  const obs = (ctx.obsTexto || "").trim();
  if (obs) L.push("", "*OBSERVAÇÕES:*", obs);
  /* v2.4: como no modelo da equipe — a última inspeção do campo avisa que acabou */
  if (i.situacao === "Liberado" || (ctx.fase && ctx.fase.final)) L.push("", "*INSPEÇÕES FINALIZADAS.*");
  let mon = (i.monitoramento || "").trim();
  const stM = statusExtras(i, "m");
  if (!mon) {
    const irr = isolamentoIrregular(i.isolamento);
    if (irr) mon = "ISOLAMENTO NÃO CONFORME — IRREGULARIDADE REGISTRADA.";
    else if (irr === false && !stM.length) mon = "OK";
  }
  if (stM.length) mon = mon ? mon + (/\n/.test(mon) ? "\n" : " / ") + stM.join(" / ") : stM.join(" / ");   /* v2.5 */
  if (mon) { mon = mon.replace(/^\*+|\*+$/g, ""); L.push("", "*STATUS MONITORAMENTO*", /\n/.test(mon) ? mon : "*" + mon + "*"); }
  if (i.tempo || i.temperatura || i.ventos)
    L.push("", "*CLIMA:*", "TEMPO: " + (i.tempo || "-").toUpperCase(),
           "TEMPERATURA: " + (i.temperatura || "-").toUpperCase(), "VENTOS: " + (i.ventos || "-").toUpperCase());
  L.push.apply(L, pfMensagem(i, d));     /* v2.5: ponto fixo, repetição por repetição */
  if (opc.recomendacao === "sempre" || (opc.recomendacao === "risco" && cl.nivel >= 1))
    L.push("", "*RECOMENDAÇÃO:*", ctx.recTexto || "");
  if (opc.proxima && i.proxima) L.push("", "*PRÓXIMA INSPEÇÃO:* " + dataBR(i.proxima));
  const txt = L.join("\n");
  return opc.maiusculas ? txt.toUpperCase() : txt;
}

/* =================================================== resumo do campo (base do QFS) */
/* serie: itens {data, numero, met} já ordenados, só os que têm dados */
function dataCruzou(serie, chave, limiar){
  if (limiar == null) limiar = 50;
  let prev = null;
  for (const it of serie) {
    const v = chave === "MP" ? it.met.mp : it.met.get(chave);
    if (v == null) continue;
    if (v >= limiar) {
      if (prev == null || prev[1] >= limiar) return it.data;
      const d0 = diaNum(prev[0]), v0 = prev[1], d1 = diaNum(it.data);
      const frac = v !== v0 ? (limiar - v0) / (v - v0) : 1;
      return isoDeDia(d0 + arredPar((d1 - d0) * frac));
    }
    prev = [it.data, v];
  }
  return null;
}
function resumoCampo(serieTudo, area, nPlan){
  const ms = serieTudo.filter(it => it.met.temDados).sort(cmpItem);
  const R = {n: ms.length, area: num(area) || null, pior: classePorNivel(-1), picoFfp:null, picoFfpData:null,
    picoEr:null, notaDesp:null, notaRogue:null, dataEr50:null, dataMp50:null, coincDias:null, notaCoinc:null,
    coincTxt:"", ptFinal:null, foraFemea:0, foraRogue:0, notaForaFemea:null, notaForaRogue:null,
    faixa:"Sem dados", faixaMotivo:"", fase:null, composicao:{}, pontosSugeridos: area ? pontosRecomendados(area) : null};
  if (!ms.length) return R;
  R.pior = classePorNivel(Math.max.apply(null, ms.map(x => x.met.classe.nivel)));
  let pico = ms[0]; ms.forEach(x => { if ((x.met.ffp || 0) > (pico.met.ffp || 0)) pico = x; });
  R.picoFfp = pico.met.ffp; R.picoFfpData = pico.data; R.notaDesp = pico.met.notaDesp; R.picoErDia = pico.met.er;
  let rog = ms[0]; ms.forEach(x => { if ((x.met.atip || 0) > (rog.met.atip || 0)) rog = x; });
  R.notaRogue = rog.met.notaAtip; R.rogAtip = rog.met.atip; R.rogEr = rog.met.er; R.rogData = rog.data;
  const ers = ms.map(x => x.met.er).filter(v => v != null);
  R.picoEr = ers.length ? Math.max.apply(null, ers) : null;
  R.dataEr50 = dataCruzou(ms, "ER"); R.dataMp50 = dataCruzou(ms, "MP");
  const prim = ms[0].met;
  const er50antes = !!(R.dataEr50 && R.dataEr50 === ms[0].data && (prim.er || 0) >= 50);
  const mp50antes = !!(R.dataMp50 && R.dataMp50 === ms[0].data && (prim.mp || 0) >= 50);
  if (er50antes || mp50antes) {
    R.coincTxt = "não medida — " + [["fêmea", er50antes], ["macho", mp50antes]].filter(x => x[1]).map(x => x[0]).join(" e ") +
                 " já com ≥ 50% na 1ª contagem";
  } else if (R.dataEr50 && R.dataMp50) {
    R.coincDias = diaNum(R.dataEr50) - diaNum(R.dataMp50);
    const lado = R.dataEr50 <= R.dataMp50 ? "femea" : "polinizador"; R.coincLado = lado;
    const nc = notaCoincidencia(R.coincDias, lado); R.notaCoinc = nc[0]; R.coincTxt = nc[1];
  }
  const prs = ms.map(x => x.met.pt).filter(v => v);
  R.ptFinal = prs.length ? prs[prs.length - 1] : null;
  R.foraFemea = ms.reduce((s, x) => s + (x.met.foraFemeaPol || 0), 0);
  R.foraRogue = ms.reduce((s, x) => s + (x.met.foraRoguePol || 0), 0);
  if (R.area) {
    const femTot = R.foraFemea + ms.reduce((s, x) => s + CH_P.reduce((a, k) => a + (x.met.soma[k] || 0), 0), 0);
    const rogTot = R.foraRogue + ms.reduce((s, x) => s + (x.met.soma.RPF || 0) + (x.met.soma.RPM || 0), 0);
    R.notaForaFemea = notaPorHa(femTot, R.area, NOTA_FEMEA_HA);
    R.notaForaRogue = notaPorHa(rogTot, R.area, NOTA_ROGUE_HA);
  }
  const fx = faixaQFS([R.notaDesp, R.notaRogue, R.notaCoinc]); R.faixa = fx[0]; R.faixaMotivo = fx[1];
  const ult = ms[ms.length - 1];
  R.fase = faseCurva(ult, ms.slice(0, -1), nPlan);
  const tot = {}; COD_TIPOS.forEach(t => { tot[t] = 0; });
  ms.forEach(x => { const c = composicao(x.met); COD_TIPOS.forEach(t => { tot[t] += c[t] || 0; }); });
  R.composicao = tot;
  return R;
}

/* SHA-256 de um texto (em UTF-8), em hexadecimal — a "impressão digital" do pacote de troca.
   Feito aqui mesmo, sem depender do navegador, para funcionar igual em qualquer aparelho. */
function sha256Hex(txt){
  const bytes = new TextEncoder().encode(txt);
  const rot = (v, n) => (v >>> n) | (v << (32 - n));
  const H = [], K = [], comp = {};
  for (let c = 2, np = 0; np < 64; c++) {
    if (comp[c]) continue;
    for (let j = c * c; j < 313; j += c) comp[j] = true;
    if (np < 8) H[np] = (Math.pow(c, 0.5) * 4294967296) | 0;
    K[np++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
  }
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(l / 536870912)); dv.setUint32(total - 4, (l << 3) >>> 0);
  const w = new Int32Array(64);
  let h = H.slice();
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rot(a, 7) ^ rot(a, 18) ^ (a >>> 3)) + w[i - 7] + (rot(b, 17) ^ rot(b, 19) ^ (b >>> 10))) | 0;
    }
    let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h = [(h[0] + a) | 0, (h[1] + b) | 0, (h[2] + c) | 0, (h[3] + d) | 0, (h[4] + e) | 0, (h[5] + f) | 0, (h[6] + g) | 0, (h[7] + hh) | 0];
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

/* v2.5: chave PÚBLICA da Orshu (ECDSA P-256) — confere a assinatura das versões novas do app */
const CHAVE_ORSHU = "BP2casCfK7s9UJNMSYpbTTHgZgXkvClvgpe0DImFaHh325oPVeV/DYHznzsSTe4oasHwc4XGFc24k07BYno3cUI=";
async function conferirAtualizacao(){
  try {
    if (!criptoDisponivel()) return {ok:false, motivo:"este navegador não confere assinaturas"};
    const nc = "?conferir=" + Date.now();            /* com ?…, o service worker não responde do cache */
    const r = await fetch("assinatura.json" + nc, {cache:"no-store"});
    if (!r.ok) return {ok:false, motivo:"sem o arquivo de assinatura"};
    const a = await r.json();
    const pub = await crypto.subtle.importKey("raw", b64U8(CHAVE_ORSHU), {name:"ECDSA", namedCurve:"P-256"}, false, ["verify"]);
    const ok = await crypto.subtle.verify({name:"ECDSA", hash:"SHA-256"}, pub, b64U8(a.assinatura || ""), new TextEncoder().encode(a.dados || ""));
    if (!ok) return {ok:false, motivo:"assinatura inválida"};
    const d = JSON.parse(a.dados);
    for (const nome of Object.keys(d.arquivos || {})) {
      const f = await fetch(nome + nc, {cache:"no-store"});
      if (!f.ok) return {ok:false, motivo:"falta o arquivo " + nome};
      const h = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", await f.arrayBuffer())), b => b.toString(16).padStart(2, "0")).join("");
      if (h !== d.arquivos[nome]) return {ok:false, motivo:nome + " foi alterado depois de assinado"};
    }
    return {ok:true};
  } catch (e) { return {ok:false, motivo:"não deu para conferir agora (" + (e && e.message || e) + ")"}; }
}
