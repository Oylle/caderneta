  const alvo = document.getElementById("lista-campos");
  if (!alvo || S.tela !== "campos") { render(); return; }
  const q = semAcento(S.busca || "").toLowerCase().trim();
  const ativ = c => { const u = ultimaInsp(c.id); return Math.max(u ? (u.alterado || 0) : 0, c.alterado || 0); };
  const AG = {}; DB.campos.forEach(c => { AG[c.id] = agendaDoCampo(c); });
  const peso = c => { const a = AG[c.id]; return !a ? 3 : a.tipo === "atrasada" ? 0 : a.tipo === "hoje" ? 1 : a.tipo === "feita" ? 2 : 3; };
  let lista = DB.campos.slice().sort((a, b) => peso(a) - peso(b) || ativ(b) - ativ(a));

  const c = campoPor(S.campoId);
  if (!c) { S.tela = "campos"; return telaCampos(); }
  const serie = serieDoCampo(c);
  const R = resumoCampo(serie, c.area, num(c.nInspecoes) || null);
  const insps = inspsDoCampo(c.id).slice().reverse();

    '<div class="sub">' + esc(dentroDoCampo(c) || "Preencha os dados do campo abaixo") + (c.exemplo ? " · exemplo" : "") + "</div></div></div>";
  h += '<div class="pilha">' + htmlPausadas();
  const prox = DB.inspecoes.filter(x => x.campoId === c.id).reduce((m, x) => Math.max(m, num(x.numero)), 0) + 1;
  h += '<button class="btn pri grande largo" data-a="nova-insp" data-id="' + c.id + '">' + ico("mais") + " Nova inspeção (nº " + Math.max(prox, (c.historico || []).reduce((m, x) => Math.max(m, num(x.numero)), 0) + 1) + ")</button>";
  if (R.n) {
    h += '<div class="cartao pad pilha" style="gap:10px"><div class="linha"><span class="rotulo cresce">Resumo do campo · ' + R.n + " inspeção(ões)</span>" + selo(R.pior) + "</div>";
    h += '<div class="tiles">' +
      tile("F.F.P pico", pct(R.picoFfp), R.picoFfpData ? dataCurta(R.picoFfpData) : "") +
      tile("E.R. pico", pct(R.picoEr, 2), "") +
      tile("Nota desp.", R.notaDesp || "—", "dia do pico de P.P", "c-desp") +
      tile("Nota atíp.", R.notaRogue || "—", "rogue e tiguera", "c-atip") +
      tile("Coincid.", R.notaCoinc || "—", R.coincTxt || (R.dataEr50 ? "E.R. 50% em " + dataCurta(R.dataEr50) : "E.R. e pólen ainda < 50%"), "c-coinc") +
      tile("Faixa", R.faixa, R.faixaMotivo, "c-faixa") + "</div>";
    if (R.fase) h += '<div class="peq mut">Fase: <b style="color:var(--tinta)">' + esc(R.fase.texto) + "</b>" + (R.fase.detalhe ? " · " + esc(R.fase.detalhe) : "") + "</div>";
    h += graficoCampo(serie) + "</div>";
  }
  h += '<div><div class="rotulo" style="margin:4px 2px 8px">Inspeções</div>';
  if (!insps.length && !(c.historico || []).length) h += '<div class="cartao"><div class="vazio"><h3>Nenhuma inspeção</h3><p>Toque em “Nova inspeção” quando chegar ao campo.</p></div></div>';
  else {
    h += '<div class="lista">';
    insps.forEach(i => {
      const m = metricas(i, c), env = !i.exemplo && (i.alterado || 0) > (i.enviadoEm || 0);
      const trav = inspTravada(i);
      h += '<button class="item"' + (trav ? " data-trav" : "") + ' data-a="abrir-insp" data-id="' + i.id + '"><div class="t1">' + (trav ? "🔒 " : "") + "Nº " + esc(i.numero) + ' <span class="mut" style="font-weight:600;font-size:15px">' + dataBR(i.data) + "</span></div>" +
        '<div class="t2">' + m.n + "/" + m.previstos + " pontos · E.R. " + pct(m.er, 2) + " · P.T. " + pct(m.pt, 2) +
        (i.exemplo ? "" : " " + etqEnvio(i)) + (inspMexida(i) ? ' <span class="etq envio">⚠ alterada fora</span>' : "") + "</div>" +
        '<div class="dir">' + selo(m.classe, true) + '<span class="mut">F.F.P ' + pct(m.ffp) + "</span></div>" +
        (trav ? '<span class="deslize" data-a="destravar" data-id="' + i.id + '">Editar</span>' : "") + "</button>";
    });
    (c.historico || []).slice().sort((a, b) => cmpItem(b, a)).forEach(hh => {
      if (insps.some(i => num(i.numero) === num(hh.numero) && i.data === hh.data)) return;
      const m = metDeHistorico(hh);
      h += '<button class="item" style="opacity:.85" data-a="hist-info" data-n="' + esc(hh.numero) + '" data-d="' + esc(hh.data) + '"><div class="t1">Nº ' + esc(hh.numero) + ' <span class="mut" style="font-weight:600;font-size:15px">' + dataBR(hh.data) + "</span></div>" +

  h += "</div>";

  h += secLimite(c);
  h += secIsolado(c);
  h += secGlebas(c);
  h += secRegistros(c);
  h += sec("sec-dados-campo", "Dados do campo", esc([c.safra ? (/^\d+$/.test(String(c.safra)) ? "VER " + c.safra : c.safra) : "", c.pivo ? "pivô " + c.pivo : "", c.proporcao].filter(Boolean).join(" · ")), formCampo(c), {aberto:!c.codigo});
  h += '<div class="btns">' + (c.exemplo ? "" : '<button class="btn" data-a="compartilhar-campos" data-id="' + c.id + '">' + ico("compartilhar") + " Compartilhar com colega</button>") +
    '<button class="btn perigo" data-a="excluir-campo" data-id="' + c.id + '">' + ico("lixo") + " Excluir campo</button></div>";
  return h + "</div>";

    '</div><div class="v">' + esc(v) + "</div>" + (n ? '<div class="n">' + esc(n) + "</div>" : "") + "</div>";

function graficoCampo(serie){
  const s = serie.filter(x => x.met.temDados);
  if (s.length < 2) return "";
  const ser = [{nome:"E.R.", cor:"var(--r0f)", valores:s.filter(x => x.er != null).map(x => ({x:diaNum(x.data), y:x.er}))},
               {nome:"Pólen (maior macho)", cor:"var(--polen-fill)", valores:s.filter(x => x.mp != null).map(x => ({x:diaNum(x.data), y:x.mp}))}];
  const ffp = [{nome:"F.F.P", cor:"var(--r3f)", valores:s.map(x => ({x:diaNum(x.data), y:x.ffp || 0}))}];
  const yMax = Math.max.apply(null, s.map(x => x.ffp || 0));
  return '<div class="graf"><div class="rotulo" style="margin-bottom:4px">E.R. e pólen (%)</div>' + graficoSVG(ser, {altura:170, rotulo:"E.R. e pólen"}) +
    '<div class="leg"><span><i style="background:var(--r0f)"></i>E.R.</span><span><i style="background:var(--polen-fill)"></i>pólen (maior macho)</span></div></div>' +
    (yMax > 0 ? '<div class="graf"><div class="rotulo" style="margin:8px 0 4px">F.F.P (%)' + (temRegras() ? " — " + CLASSES.slice(0, -1).map(c => fmtNum(c[1], 2)).join(" / ") + " são os limites de risco" : "") + "</div>" + graficoFFP(s) + "</div>" : "");
}
function graficoFFP(s){
  const W = 600, H = 140, mL = 40, mR = 14, mT = 10, mB = 24;
  const xs = s.map(x => diaNum(x.data));
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) { x0--; x1++; }
  const yMax = Math.max(0.4, Math.ceil(Math.max.apply(null, s.map(x => x.ffp || 0)) * 10 + 0.5) / 10);
  const X = x => mL + (x - x0) / (x1 - x0) * (W - mL - mR), Y = y => mT + (1 - y / yMax) * (H - mT - mB);
  let g = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="F.F.P por inspeção">';
  const lim = temRegras() ? CLASSES.slice(0, 3).map(c => c[1]) : [];          /* v2.5: as faixas vêm das regras do PC */
  (lim.length === 3 ? [[0, lim[0], "var(--r0s)"], [lim[0], lim[1], "var(--r1s)"], [lim[1], lim[2], "var(--r2s)"], [lim[2], yMax, "var(--r3s)"]] : []).forEach(([a, b, cor]) => {
    if (a >= yMax) return;
    g += '<rect x="' + mL + '" y="' + Y(Math.min(b, yMax)).toFixed(1) + '" width="' + (W - mL - mR) + '" height="' + (Y(a) - Y(Math.min(b, yMax))).toFixed(1) + '" fill="' + cor + '"/>';
  });
  [0].concat(lim).filter(v => v <= yMax).forEach(v => { g += '<text x="' + (mL - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + fmtNum(v, 2) + "</text>"; });
  const pts = s.map(x => [X(diaNum(x.data)), Y(Math.min(yMax, x.ffp || 0))]);
  g += '<polyline points="' + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '" fill="none" stroke="var(--tinta)" stroke-width="2.2"/>';
  s.forEach((x, k) => { g += '<circle cx="' + pts[k][0].toFixed(1) + '" cy="' + pts[k][1].toFixed(1) + '" r="4.5" fill="var(--' + x.met.classe.css + 'f)" stroke="var(--tinta)" stroke-width="1.2"/>'; });
  const passo = Math.max(1, Math.ceil(s.length / 6));
  s.forEach((x, k) => { if (k % passo === 0 || k === s.length - 1) g += '<text x="' + pts[k][0].toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--tinta3)" font-family="var(--f-texto)">' + dataCurta(x.data) + "</text>"; });
  return g + "</svg>";
}
function secCaminhamento(c){
  const n = nPontosDoCampo(c), cb = cbDoCampo(c, n);
  const forma = (c.caminho && c.caminho.forma) || formaPadrao(!!c.gleba);
  let corpo = '<div class="pilha" style="gap:10px">';
  corpo += '<div class="tiles">' + tile("Pontos", n, num(c.nPontos) ? "informado no campo" : (num(c.area) ? "pela área (" + fmtNum(num(c.area), 0) + " ha)" : "padrão — informe a área")) +
    tile("Pular", cb ? cb.pularInt + " blocos" : "—", cb ? "≈ " + fmtNum(cb.metrosInt, 0) + " m · bloco de " + fmtNum(larguraDo(c), 2) + " m" : "informe a área") +
    tile("Com a entrada", cb && cb.pularIda ? (cb.ptsVolta && cb.pularIda !== cb.pularVolta ? cb.pularIda + " / " + cb.pularVolta : cb.pularIda) + " blocos" : "—",
      cb && cb.pularIda ? (cb.ptsVolta ? "ida " + cb.ptsIda + " · volta " + cb.ptsVolta + " pontos" : cb.ptsIda + " pontos") + " · " + fmtNum(cb.entrada, 0) + " blocos a menos" : "") +

/* v2.5 (etapa 21): por quem o campo é isolado — outras glebas do mesmo pivô e contratos ao lado.
   Vai numa linha da mensagem ("ISOLADO PELA GLEBA 2 E PELO CONTRATO M4V2708 AO LADO"); anda com o
   campo para o PC e de volta (vale o mais novo, isoEm). */
function posCampo(c){
  if (c && c.lat != null && c.lon != null) return {lat:num(c.lat), lon:num(c.lon)};
  try { if (c && Array.isArray(c.limite) && c.limite.length) return centroLL(c.limite); } catch (e) {}
  return null;
}
function isoE(itens){ return itens.length === 1 ? itens[0] : itens.slice(0, -1).join(", ") + " E " + itens[itens.length - 1]; }
function fraseIsolado(c){
  if (!c) return "";
  if (String(c.isoTexto || "").trim()) return String(c.isoTexto).trim().toUpperCase();
  const gl = (c.isoGlebas || []).map(g => { const m = String(g).match(/\d+/); return m ? String(+m[0]) : String(g).toUpperCase(); });
  const ct = (c.isoContratos || []).map(x => String(x).toUpperCase());
  const partes = [];
  if (gl.length) partes.push((gl.length === 1 ? "PELA GLEBA " : "PELAS GLEBAS ") + isoE(gl));
  if (ct.length) partes.push((ct.length === 1 ? "PELO CONTRATO " : "PELOS CONTRATOS ") + isoE(ct) + " AO LADO");
  return partes.length ? "ISOLADO " + partes.join(" E ") : "";
}
function sugestoesIsolado(c){
  const cod = normContrato(c.codigo), gl = normGleba(c.gleba);
  const glebas = [...new Set(DB.campos.filter(x => !x.exemplo && normContrato(x.codigo) === cod && x.gleba && normGleba(x.gleba) !== gl).map(x => normGleba(x.gleba)))].sort();
  const p0 = posCampo(c), perto = [];
  if (p0) DB.campos.forEach(x => {
    if (x.exemplo || normContrato(x.codigo) === cod) return;
    const p = posCampo(x); if (!p) return;
    const km = distM(p0, p) / 1000;
    if (km <= 3 && !perto.some(y => y.v === normContrato(x.codigo))) perto.push({v:normContrato(x.codigo), km:km});
  });
  perto.sort((a, b) => a.km - b.km);
  return {glebas:glebas, contratos:perto.slice(0, 8)};
}
function secIsolado(c){
  const s = sugestoesIsolado(c), selG = new Set(c.isoGlebas || []), selC = new Set(c.isoContratos || []);
  const chip = (t, v, rot, on) => '<button type="button" class="chip-iso" data-a="iso-t" data-t="' + t + '" data-v="' + esc(v) + '" aria-pressed="' + on + '">' + esc(rot) + "</button>";
  const glebas = [...new Set(s.glebas.concat(c.isoGlebas || []))];
  const conts = s.contratos.map(x => ({v:x.v, rot:x.v + " · " + fmtNum(x.km, 1) + " km"}));
  (c.isoContratos || []).forEach(v => { if (!conts.some(x => x.v === v)) conts.push({v:v, rot:v}); });
  const fr = fraseIsolado(c);
  const corpo = '<div class="pilha" style="gap:10px"><p class="peq" style="margin:0;color:var(--tinta2)">Marque o que isola este campo: outra gleba do mesmo pivô ou um contrato ao lado (os de até 3 km aparecem aqui). Vai numa linha da mensagem.</p>' +
    '<div class="iso-chips">' + glebas.map(g => chip("g", g, "Gleba " + String(g).replace(/^G/i, ""), selG.has(g))).join("") + conts.map(x => chip("c", x.v, x.rot, selC.has(x.v))).join("") + "</div>" +
    '<div class="linha"><input id="iso-novo" class="cresce" placeholder="outro contrato (ex.: M4V2708)" maxlength="20" autocapitalize="characters" aria-label="Outro contrato ao lado">' +
    '<button class="btn peq" data-a="iso-add">' + ico("mais") + " Pôr</button></div>" +
    fIn("campo.isoTexto", "Ou escreva do seu jeito (substitui)", c.isoTexto, {ph:"isolado por mata, por estrada…", tudo:true}) +
    '<div class="nota">' + (fr ? "<b>Na mensagem:</b> " + esc(fr) : "Nada marcado: a mensagem sai sem a linha de isolamento.") + "</div></div>";
  return sec("sec-isolado", "Isolado por", fr ? fr.replace(/^ISOLADO /, "").toLowerCase() : "não informado", corpo);
}

/* v2.5 — ponto fixo como se anota no campo: cada coluna é uma REPETIÇÃO; em cada uma, Macho 1 e 2
   de um lado, uma leitura por linha de fêmea (a proporção F:M do campo diz quantas) e Macho 1 e 2
   do outro lado. As chaves são as mesmas do PC (M1P-A, F1…F8, M1P-B). O modelo antigo (er, m1a…)
   continua aparecendo se tiver dado. */
const PF_ANTIGO = [["er", "E.R. (antigo)"], ["m1a", "M1P-A (antigo)"], ["m2a", "M2P-A (antigo)"], ["m1b", "M1P-B (antigo)"], ["m2b", "M2P-B (antigo)"]];
function pfTemDado(arr){ return Array.isArray(arr) && arr.some(x => x !== null && x !== "" && x !== undefined); }
/* v2.5: arranjo "linhas" — Macho 1 linha 1 e 2, fêmeas, Macho 2 linha 1 e 2 (Ajustes › Preferências).
   Contagem que já tem leitura num arranjo continua nele. */
function pfArranjo(i){
  const pf = i.pontoFixo || {}, ks = Object.keys(pf).filter(k => pfTemDado(pf[k]));
  if (ks.some(k => /^M\dP-L\d$/.test(k))) return "linhas";
  if (ks.some(k => /^M\dP-[AB]$/.test(k))) return "lados";
  return DB.cfg.pfArranjo === "linhas" ? "linhas" : "lados";
}
/* v2.5 (etapa 20): quantas linhas de fêmea e de macho — o inspetor põe e tira (pf.nf / pf.nm);
   sem escolha, vale a proporção do campo. Linha com valor anotado nunca some sozinha. */
function pfQtd(i){
  const c = campoPor(i.campoId) || {}, pf = i.pontoFixo || {};
  let nf = Math.round(num(pf.nf, 0)) || Math.round(num(c.propF, 0)) || 5, nm = Math.round(num(pf.nm, 0)) || Math.round(num(c.machos, 2)) || 2;
  Object.keys(pf).forEach(k => {
    let m = /^F(\d)$/.exec(k); if (m && pfTemDado(pf[k])) nf = Math.max(nf, +m[1]);
    m = /^M(\d)P-(?:[AB]|L\d)$/.exec(k); if (m && pfTemDado(pf[k])) nm = Math.max(nm, +m[1]);
  });
  return {nf:Math.max(1, Math.min(8, nf)), nm:Math.max(1, Math.min(3, nm))};
}
function pfLinhas(i){
  const pf = i.pontoFixo || {}, q = pfQtd(i), nf = q.nf, nm = q.nm;
  const L = [];
  if (pfArranjo(i) === "linhas") {
    const lin = j => { L.push(["M" + j + "P-L1", "Macho " + j + " L1", "m"]); L.push(["M" + j + "P-L2", "Macho " + j + " L2", "m"]); };
    lin(1);
    for (let j = 1; j <= nf; j++) L.push(["F" + j, "Fêmea " + j, "f"]);
    for (let j = 2; j <= nm; j++) lin(j);
    PF_ANTIGO.forEach(([k, rot]) => { if (pfTemDado(pf[k])) L.push([k, rot, "a"]); });
    return L;
  }
  for (let j = 1; j <= nm; j++) L.push(["M" + j + "P-A", "Macho " + j, "m"]);
  for (let j = 1; j <= nf; j++) L.push(["F" + j, "Fêmea " + j, "f"]);
  for (let j = 1; j <= nm; j++) L.push(["M" + j + "P-B", "Macho " + j, "m"]);
  PF_ANTIGO.forEach(([k, rot]) => { if (pfTemDado(pf[k])) L.push([k, rot, "a"]); });
  return L;
}
function pfMedia(arr){ const v = (arr || []).filter(x => x !== null && x !== "" && x !== undefined).map(x => num(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function pfGrupos(i){
  const pf = i.pontoFixo || {}, g = {fem:[], m1:[], m2:[], m3:[]};
  Object.keys(pf).forEach(k => {
    const vals = (Array.isArray(pf[k]) ? pf[k] : []).filter(x => x !== null && x !== "" && x !== undefined).map(x => num(x));
    if (/^F\d$/.test(k) || k === "er") g.fem.push.apply(g.fem, vals);
    const m = /^M(\d)P-(?:[AB]|L\d)$/.exec(k) || /^m(\d)[ab]$/.exec(k); if (m && g["m" + m[1]]) g["m" + m[1]].push.apply(g["m" + m[1]], vals);
  });
  const med = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {fem:med(g.fem), m1:med(g.m1), m2:med(g.m2), m3:med(g.m3)};
}
function pfResumo(i){
  const g = pfGrupos(i);
  if (g.fem == null && g.m1 == null && g.m2 == null) return "não usado";
  return [["fem", "Fêmeas"], ["m1", "M1"], ["m2", "M2"], ["m3", "M3"]].filter(([k]) => g[k] != null).map(([k, t]) => t + " " + fmtNum(g[k], 2)).join(" · ");
}
function pfReps(i){
  const pf = i.pontoFixo || {};
  let usadas = 0;
  Object.keys(pf).forEach(k => { if (Array.isArray(pf[k])) pf[k].forEach((x, j) => { if (x !== null && x !== "" && x !== undefined) usadas = Math.max(usadas, j + 1); }); });
  return Math.max(usadas, Math.min(8, num(pf.reps, 3) || 3));
}

/* bloco *PONTO FIXO* da mensagem, como a equipe manda */
function pfMensagem(i, d){
  const pf = i.pontoFixo || {}, n = pfReps(i), L = pfLinhas(i).filter(([k, , t]) => t !== "a");
  const out = [];
  for (let j = 0; j < n; j++) {
    const vals = L.map(([k, rot]) => [rot, (pf[k] || [])[j]]);
    if (!vals.some(([, v]) => v !== null && v !== "" && v !== undefined)) continue;
    out.push("", "*REPETICAO " + (j + 1) + ":*");
    vals.forEach(([rot, v]) => out.push(semAcento(rot.replace(/ L(\d)$/, " linha $1")) + ": " + (v === null || v === "" || v === undefined ? "-" : nMsg(num(v), 2, d))));
  }
  return out.length ? ["", "*PONTO FIXO:*"].concat(out) : [];
}

  else if (est === "pedindo") tit = "Procurando satélites…";

  let h = '<div class="cartao pad pilha" style="gap:9px"><div class="linha"><span class="chip-gps ' + classeGPS() + '"><i></i></span><b class="cresce" style="color:' + cor + '">' + tit + "</b></div>";
  if (GPS.motivo && est !== "ok") h += '<p class="peq" style="margin:0;color:var(--tinta2)">' + esc(GPS.motivo) + "</p>";

    if (GPS.watch == null && gpsDiagnostico().ok) h += '<button class="btn peq pri" data-a="gps-ligar">' + ico("mira") + " Ligar GPS</button>";

function dadosDoMapa(i, c){
  const sim = !!GPS.sim, cc = sim ? campoDaSimulacao() : c;
  const n = i ? i.pontos.length : nPontosDoCampo(c || {});
  const plano = cc ? planoDoCampo(cc, n) : null;
  const f = cc ? formaDoCampo(cc) : null;
  const pontos = i ? i.pontos.filter(p => p.gps).map(p => ({n:p.i, lat:p.gps.lat, lon:p.gps.lon, cls:polDoPonto(p) > 0 ? "r3" : "rn", sim:p.gps.fonte === "simulado"})) : [];
  const marcas = i ? i.marcas.map(m => ({lat:m.lat, lon:m.lon, pol:CH_P.concat(ATIP_POL).indexOf(m.k) >= 0})) : [];
  const prox = i ? i.pontos.findIndex(p => !pontoFeito(p)) : -1;
  const fotos = i ? (i.fotos || []).filter(ft => ft.lat != null && ft.lon != null).map(ft => ({lat:ft.lat, lon:ft.lon, ponto:ft.ponto})) : [];
  return {aneis:f ? f.aneis : null, plano, trilha:i ? i.trilha : [], pontos, marcas, fotos, eu:GPS.ult, alvoN:prox >= 0 ? prox + 1 : null, sim, forma:f};
}
function htmlAlvo(i, d){
  if (!i || !d.plano || d.alvoN == null) return "";
  const alvo = d.plano.pontos[d.alvoN - 1]; if (!alvo) return "";
  const u = GPS.ult;
  let h = '<div class="alvo">';
  if (u) {
    const dist = distM(u, alvo), r = rumo(u, alvo);
    h += '<svg class="seta" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>' +
      '<g transform="rotate(' + r.toFixed(0) + ' 24 24)"><path d="M24 7 33 30 24 25 15 30Z" fill="currentColor"/></g></svg>';
    h += '<div class="cresce"><div class="rotulo">Próximo: ponto ' + d.alvoN + " (sugerido)</div>" +
      '<div class="dist">' + (dist < 15 ? "Você chegou" : fmtDist(dist)) + "</div>" +
      '<div class="peq mut">' + (dist < 15 ? "Pare e conte as plantas aqui." : "a " + direcao(r) + " (rumo " + Math.round(r) + "° do norte)") + "</div></div>";
  } else {
    h += '<div class="cresce"><div class="rotulo">Próximo: ponto ' + d.alvoN + '</div><div class="peq mut">Ligue o GPS para ver a distância até o ponto sugerido.</div></div>';
  }
  return h + "</div>";
}
function telaMapa(){
  const i = inspPor(S.inspId), c = i ? campoPor(i.campoId) : campoPor(S.campoId);
  let h = '<div class="cab"><div class="cresce"><h2>Mapa</h2><div class="sub">' + (i ? esc(nomeCampo(c)) + " · inspeção nº " + esc(i.numero) : (c ? esc(nomeCampo(c)) : "Abra uma inspeção para ver os pontos")) + "</div></div></div>";
  h += '<div class="pilha">' + avisoPrevia() + '<div id="painel-gps">' + painelGPS() + "</div>";
  if (!i && !c) return h + '<div class="cartao"><div class="vazio"><h3>Nenhuma inspeção aberta</h3><p>Abra um campo e uma inspeção. O mapa mostra o campo, o caminhamento sugerido, os pontos já contados e onde você está.</p></div></div></div>';
  const d = dadosDoMapa(i, c);
  h += '<div id="alvo">' + htmlAlvo(i, d) + "</div>";
  const svg = mapaSVG(d);
  h += '<div class="mapa" id="mapa-svg">' + (svg || '<div class="vazio"><h3>Nada para desenhar ainda</h3><p>Importe o limite do campo (KML) ou informe a coordenada do pivô e a área. Os pontos aparecem conforme o GPS grava cada um.</p></div>') + "</div>";
  h += '<div class="legenda"><span><i style="background:var(--azul)"></i>ponto contado</span><span><i style="background:var(--r3f)"></i>ponto com pendão polinizando</span>' +
    '<span><i style="background:transparent;border:2px dashed var(--azul)"></i>ponto sugerido</span><span><i style="background:var(--gps)"></i>você / trilha</span>' +
    '<span><i style="background:var(--polen-fill);border-radius:2px"></i>planta do caminhamento</span><span><i style="background:var(--sup);border:2px solid var(--tinta);border-radius:50% 50% 50% 0"></i>foto (com GPS)</span></div>';
  if (d.sim && !(c && formaDoCampo(c))) h += '<div class="nota">Simulação num pivô imaginário. Com o limite do campo importado, a simulação anda pelo campo de verdade.</div>';
  if (d.plano && c) {
    const pl = d.plano, cb = cbDoCampo(c, i ? i.pontos.length : nPontosDoCampo(c));
    h += '<div class="cartao pad pilha" style="gap:10px"><div class="rotulo">Caminhamento sugerido</div>' +
      fSel("campo.caminho.forma", "Forma", FORMAS.map(f => [f[0], f[1]]), pl.forma) +
      '<div class="btns"><button class="btn peq" data-a="girar">' + ico("girar") + ' Girar 90°</button><button class="btn peq" data-a="inverter">Entrar do outro lado</button>' +
      '<button class="btn peq" data-a="espelhar">' + ico("espelho") + ' Espelhar</button><button class="btn peq" data-a="caminho-padrao">Padrão</button></div>' +
      '<p class="peq mut" style="margin:0">' + esc((FORMA[pl.forma] || FORMA.diamante)[1]) + " · entrada " + direcao(90 - pl.graus + 180) + " → " + direcao(90 - pl.graus) +
      " · ≈ " + fmtDist(pl.entre) + " andados entre pontos" + (cb ? " · pular " + cb.pularInt + " blocos" : "") + ". " +
      (pl.real ? "" : "Sem limite importado: o campo foi desenhado pela área.") + "</p></div>";
  }
  if (i) {
    const com = i.pontos.filter(p => p.gps);
    let t = '<div class="tab-wrap"><table><thead><tr><th>Ponto</th><th>Latitude</th><th>Longitude</th><th>±m</th><th>Origem</th><th></th></tr></thead><tbody>';
    com.forEach(p => { t += "<tr><td>" + p.i + "</td><td>" + p.gps.lat.toFixed(6) + "</td><td>" + p.gps.lon.toFixed(6) + "</td><td>" + (p.gps.acc ? Math.round(p.gps.acc) : "—") + "</td><td>" + esc(p.gps.fonte || "gps") + '</td><td><a target="_blank" rel="noopener" href="' + linkMapa(p.gps) + '">abrir</a></td></tr>'; });
    t += "</tbody></table></div>";
    const tr = i.trilha.length;
    t += '<div class="btns" style="margin-top:10px">' + (tr ? '<button class="btn peq" data-a="apagar-trilha">Apagar a trilha (' + tr + " posições)</button>" : "") +
      fChk("cfg.gpsTrilha", "Gravar a trilha andada", DB.cfg.gpsTrilha) + "</div>";
    h += sec("sec-coords", "Coordenadas", com.length + " de " + i.pontos.length + " pontos com posição", t);
  }
  return h + "</div>";
}

/* ================================================================= RELATÓRIO */
function telaRel(){
  const i = inspPor(S.inspId);
  if (!i) return vazio("Relatório", "Abra uma inspeção para ver o relatório.");
  const ctx = contexto(i), c = ctx.campo, m = ctx.met, msg = mensagemWhatsapp(ctx);
  let h = '<div class="cab">' + voltar("insp") + '<div class="cresce"><h2>Relatório nº ' + esc(i.numero) + '</h2><div class="sub">' + esc(nomeCampo(c)) + " · " + dataBR(i.data) + "</div></div></div>";
  h += '<div class="pilha">' + htmlRisco(ctx);
  let t = '<div class="tiles">' + tile("E.R.", pct(m.er, 2), ctx.fase.codigo !== "sem" ? ctx.fase.texto.split(" —")[0] : "") + tile("P.T.", pct(m.pt, 2), [m.nPT != null && m.nPT < m.n ? m.nPT + " de " + m.n + " pontos já despendoados" : "", PENDAO_TIRADO_META != null ? "meta " + fmtPct(PENDAO_TIRADO_META, 1) : ""].filter(Boolean).join(" · "));
  MACHOS.forEach((k, j) => { if (m.pct[k] != null) t += tile("M.P." + (j + 1), pct(m.pct[k], 2), "macho " + (j + 1)); });
  t += tile("Atíp. pol.", pct(m.atip, 3), "rogue + tiguera") + tile("Nota desp.", m.notaDesp || "—", "1 / 5 / 9", "i-desp") + tile("Nota atíp.", m.notaAtip || "—", "1 / 5 / 9", "i-atip") + "</div>";
  h += t;
  { /* v2.5: irregularidade a partir da contagem (modelo de isolamento, contaminante: plantas POL) */
    const temPol = (m.ffp || 0) > 0 || (m.atip || 0) > 0 || isolamentoIrregular(i.isolamento);
    const ja = (DB.registros || []).filter(r => r.deInsp === i.id).length;
    if (!i.exemplo && (temPol || ja)) h += '<div class="nota' + (temPol && !ja ? " alerta" : "") + ' linha"><span class="cresce">' + (ja ? "Irregularidade criada a partir desta inspeção (" + ja + ")." :
      "Plantas polinizando nesta inspeção: dá para abrir o relatório de irregularidade já preenchido.") + "</span>" +
      '<button class="btn peq' + (ja ? "" : " pri") + '" data-a="irreg-da-insp">' + (ja ? "Abrir" : "Criar irregularidade") + "</button></div>";
  }
  h += '<div class="cartao pad pilha" style="gap:10px"><div class="linha"><span class="rotulo cresce">Mensagem para a equipe</span></div><div class="msg" id="msg">' + esc(msg) + "</div>" +
    '<div class="btns"><button class="btn pri" data-a="copiar-msg">' + ico("copiar") + ' Copiar</button>' +
    (navigator.share && !emVisualizador() ? '<button class="btn" data-a="compartilhar-msg">' + ico("compartilhar") + " Compartilhar</button>" : "") +
    '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">' + ico("conversa") + " WhatsApp</a></div></div>";
  if (!emVisualizador()) h += '<div class="btns">' + (podeCompartilharArquivo() ? '<button class="btn pri" data-a="pdf-arquivo" data-m="compartilhar">' + ico("pdf") + " Relatório PDF com fotos</button>" : "") +
    '<button class="btn' + (podeCompartilharArquivo() ? "" : " pri") + '" data-a="pdf-arquivo" data-m="salvar">' + ico("baixar") + " Salvar PDF</button>" +
    '<button class="btn" data-a="pdf">' + ico("pdf") + " Imprimir</button>" +
    '<button class="btn" data-a="xlsx-insp" data-m="' + (podeCompartilharArquivo() ? "compartilhar" : "salvar") + '">' + ico("baixar") + " Planilha Excel</button></div>" +
    '<p class="peq mut" style="margin:-6px 2px 0">O PDF leva a identificação, os índices, ponto a ponto, ponto fixo, observações e as fotos (as marcadas “Relatório”; sem marca, todas). Funciona sem internet.</p>';
  h += sec("sec-medias", "Médias da contagem", m.n + " pontos · " + m.base + " plantas", '<div id="tb-medias">' + tabelaMedias(m) + "</div>" + botoesCopiarTabela("tb-medias", "Médias da contagem"), {liso:true});
  h += sec("sec-por-ponto", "Ponto a ponto", "", '<div id="tb-pontos">' + tabelaPorPonto(i, c) + "</div>" + botoesCopiarTabela("tb-pontos", "Ponto a ponto"), {liso:true});
  const d = dadosDoMapa(i, c), svg = mapaSVG(Object.assign({}, d, {eu:null}));
  if (svg) h += sec("sec-rel-mapa", "Mapa dos pontos", d.pontos.length + " com posição", '<div class="mapa">' + svg + "</div>");
  h += "</div>";
  return h;
}
/* v2.5: COPIAR TABELA — para o WhatsApp (texto alinhado, em bloco de largura fixa) ou para a planilha
   (colunas separadas por tabulação: cada número cai na sua célula no Excel/Sheets) */
function botoesCopiarTabela(id, titulo){
  return '<div class="btns tab-copiar"><button class="btn peq" data-a="tab-zap" data-t="' + id + '" data-n="' + esc(titulo) + '">' + ico("conversa") + " Copiar p/ WhatsApp</button>" +
    '<button class="btn peq" data-a="tab-planilha" data-t="' + id + '" data-n="' + esc(titulo) + '">' + ico("copiar") + " Copiar p/ planilha</button></div>";
}
function linhasDaTabela(id){
  const tb = document.querySelector("#" + id + " table"); if (!tb) return [];
  return Array.from(tb.rows).map(r => Array.from(r.cells).map(c => {
    const inp = c.querySelector("input");
    const v = (inp ? inp.value : c.textContent).replace(/\s+/g, " ").trim();
    return v === "·" ? "0" : v;
  }));
}
function tabelaParaZap(linhas, titulo){
  const cab = linhas[0] || [], fora = cab.map((x, k) => /^(Descrição|GPS)$/.test(x) ? k : -1).filter(k => k >= 0);
  const L = linhas.filter(l => l.length === cab.length).map(l => l.filter((_, k) => fora.indexOf(k) < 0));
  const larg = (L[0] || []).map((_, k) => Math.max.apply(null, L.map(l => String(l[k]).length)));
  const txt = L.map(l => l.map((v, k) => k === 0 ? String(v).padEnd(larg[k]) : String(v).padStart(larg[k])).join("  ")).join("\n");
  return titulo + "\n```\n" + txt + "\n```";
}
function tituloTabela(n){
  const i = inspPor(S.inspId), c = i ? campoPor(i.campoId) : null;
  return "*" + n + (i ? " — " + nomeCampo(c) + " · nº " + i.numero + " · " + dataBR(i.data) : "") + "*";
}
function tabelaMedias(m){
  let h = '<div class="tab-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Sigla</th><th>Descrição</th><th>Soma</th><th>%</th></tr></thead><tbody>';
  const lin = (k, rot, desc, forte) => '<tr' + (forte ? ' class="tot"' : "") + "><td>" + esc(rot) + '</td><td class="txt">' + esc(desc) + "</td><td>" + (k === "FFP" ? CH_P.reduce((s, x) => s + (m.soma[x] || 0), 0) : (m.soma[k] == null ? "—" : m.soma[k])) + "</td><td>" + (m.get(k) == null ? "—" : fmtNum(m.get(k), k === "FFP" || ATIP_POL.indexOf(k) >= 0 ? 3 : 2)) + "</td></tr>";
  h += lin("FFP", "F.F.P", NOME.FFP, true) + lin("PT", "P.T.", NOME.PT) + lin("ER", "E.R.", NOME.ER);
  MACHOS.forEach(k => { if (m.pct[k] != null) h += lin(k, SIGLA[k], NOME[k]); });
  CH_BASE.forEach(k => { h += lin(k, SIGLA[k], NOME[k]); });
  CH_ATIP.forEach(k => { if (m.soma[k]) h += lin(k, SIGLA[k], NOME[k]); });
  if (m.soma.FP) h += lin("FP", "F.P.", NOME.FP);
  h += '<tr class="tot"><td>Base</td><td class="txt">plantas avaliadas</td><td>' + m.base + "</td><td>" + m.n + " pt</td></tr></tbody></table></div>";
  return h;
}
function tabelaPorPonto(i, c){
  const ppp = pppDo(c), nm = Math.max(1, Math.min(3, num(c.machos, 2) || 2));
  const cols = CH_BASE.filter(k => k.indexOf("PM") !== 0 || DB.cfg.mostrarPM || i.pontos.some(p => num(p.c[k]))).concat(["ER"], MACHOS.slice(0, nm), CH_ATIP.filter(k => i.pontos.some(p => num(p.c[k]))));
  let h = '<div class="tab-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Pt</th><th>Aval.</th><th>P.T.</th>' + cols.map(k => "<th>" + esc(SIGLA[k]) + "</th>").join("") + "<th>GPS</th></tr></thead><tbody>";
  i.pontos.forEach(p => {
    if (!pontoFeito(p)) { h += "<tr><td>" + p.i + '</td><td colspan="' + (cols.length + 3) + '" class="txt" style="color:var(--tinta3)">não contado</td></tr>'; return; }
    h += "<tr><td>" + p.i + "</td><td>" + plantasDoPonto(p, ppp) + "</td><td>" + ptDoPonto(p, ppp) + "</td>" +
      cols.map(k => '<td class="' + (num(p.c[k]) && (CH_P.indexOf(k) >= 0 || ATIP_POL.indexOf(k) >= 0) ? "pol" : "") + '">' + (num(p.c[k]) || "·") + "</td>").join("") +
      "<td>" + (p.gps ? "±" + Math.round(p.gps.acc || 0) : "—") + "</td></tr>";
  });
  return h + "</tbody></table></div>";
}

    (fsaEnvio() ? '<ol class="passos peq">' +

    '<div class="btns"><button class="btn' + (nPend ? " pri" : "") + '" data-a="nuvem-enviar">' + ico("compartilhar") + " Enviar para a nuvem</button>" +
    '<button class="btn' + (nPend ? "" : " pri") + '" data-a="nuvem-receber">' + ico("receber") + " Receber da nuvem</button></div>" +
    '<p class="peq mut" style="margin:0">' + (DB.cfg.nuvemDestino ? '<button type="button" class="link" data-a="nuvem-enviar" data-trocar="1">Trocar a pasta de envio</button> · ' : "") +

    (DB.cfg.ultimoNuvem ? "último envio " + quandoTxt(DB.cfg.ultimoNuvem) : "") + "</p>"
    : '<ol class="passos peq">' +
    "<li><b>Mandar</b> as inspeções: <i>Enviar arquivo</i> › Drive (ou OneDrive) › pasta " + (pasta ? "<b>" + esc(pasta) + "</b>" : "de troca") + ".</li>" +
    "<li>No PC: clique em <b>⟳ Nuvem</b>. Ele importa o que chegou e <b>regrava</b> o arquivo para o celular (com o que você completou no PC).</li>" +

    '<div class="btns">' + (podeShare ? '<button class="btn' + (nPend ? " pri" : "") + '" data-a="enviar" data-m="auto">' + ico("compartilhar") + " 1. Enviar arquivo</button>" : "") +

function qrDeLinhas(linhas, tam){
  const n = linhas.length; if (!n) return "";
  const q = 4, t = n + 2 * q; let r = "";
  linhas.forEach((l, y) => { for (let x = 0; x < l.length; x++) if (l[x] === "1") r += "M" + (x + q) + " " + (y + q) + "h1v1h-1z"; });
  return '<svg class="qr-lic" viewBox="0 0 ' + t + " " + t + '" width="' + tam + '" height="' + tam + '" role="img" aria-label="QR code do pedido de licença" shape-rendering="crispEdges"><rect width="' + t + '" height="' + t + '" fill="#fff"/><path d="' + r + '" fill="#000"/></svg>';
}

/* ---------------------------------------------------------------- tema */
let temaPosto = false;

/* ---------------------------------------------------------------- formulários (data-b) */
function alvoBind(path){
  const seg = path.split(".");
  let raiz = null;
  if (seg[0] === "campo") raiz = campoAtual();
  else if (seg[0] === "insp") raiz = inspPor(S.inspId);
  else if (seg[0] === "ponto") { const i = inspPor(S.inspId); raiz = i ? i.pontos[S.pontoIdx] : null; }
  else if (seg[0] === "cfg") raiz = DB.cfg;
  if (!raiz) return null;
  let o = raiz;
  for (let j = 1; j < seg.length - 1; j++) { if (o[seg[j]] == null || typeof o[seg[j]] !== "object") o[seg[j]] = {}; o = o[seg[j]]; }
  return {raiz, obj:o, chave:seg[seg.length - 1], tipo:seg[0]};
}
function valorDe(el){
  const t = el.dataset.t, v = el.value;
  if (t === "b") return el.checked;
  if (t === "n") return v.trim() === "" ? "" : num(v, "");
  if (t === "i") return v.trim() === "" ? "" : Math.round(num(v, 0));
  return v;
}
const RERENDER = ["cfg.apelido", "insp.recomAuto", "cfg.mostrarPM", "cfg.mostrarFP", "cfg.msgRecomendacao", "campo.caminho.forma", "campo.machos", "campo.gleba",
                  "cfg.gpsTrilha", "cfg.msgDecimal", "cfg.msgProxima", "cfg.msgMaiusculas", "cfg.pinMin"];
function aoMudarBind(el, fim){
  const path = el.dataset.b, a = alvoBind(path);
  if (!a) return;
  if (path === "campo.coord") {
    const v = lerCoord(el.value);
    if (v) { a.raiz.lat = v[0]; a.raiz.lon = v[1]; } else if (!el.value.trim()) { a.raiz.lat = null; a.raiz.lon = null; } else return;
  } else {
    a.obj[a.chave] = valorDe(el);
  }
  if (path === "campo.caminho.forma") a.obj.graus = null;
  if (path === "campo.isoTexto") a.raiz.isoEm = Date.now();          /* v2.5 (etapa 21): vale o mais novo */
  if (path === "campo.codigo") { a.raiz.codigo = fim ? normContrato(a.raiz.codigo) : String(a.raiz.codigo).toUpperCase().trimStart(); if (fim) el.value = a.raiz.codigo; }
  if (path === "campo.gleba") { a.raiz.gleba = fim ? normGleba(a.raiz.gleba) : String(a.raiz.gleba).toUpperCase().trim(); if (fim) el.value = a.raiz.gleba; }
  if (path === "insp.numero" && fim) {
    const ck = checarNumeroInsp(a.raiz, a.raiz.numero);
    const n = a.raiz.numero;
    if (ck.erro) { a.raiz.numero = a.raiz._numOk || ck.prox; el.value = a.raiz.numero; aviso(ck.erro, null, 6000); }
    else if (ck.falta.length && num(a.raiz._numOk) !== num(n)) {
      /* faltam as anteriores neste celular: pergunta antes de aceitar o número */
      const insp = a.raiz;
      insp.numero = insp._numOk || ck.prox; el.value = insp.numero;
      confirmar("Inspeção nº " + n, textoFalta(ck.falta) + " fora da Caderneta " +
        "(papel, outro celular, PC)? Se sim, esta fica como nº " + n + ".", "Usar nº " + n).then(ok => {
        if (!ok) return;
        insp.numero = n; insp._numOk = n;
        tocar(insp); salvar(); render();
        aviso("Inspeção nº " + n);
      });
    }
    else a.raiz._numOk = a.raiz.numero;
  }
  if (a.tipo === "insp" || a.tipo === "ponto") tocar(inspPor(S.inspId));
  if (a.tipo === "campo") a.raiz.alterado = Date.now();
  salvar();
  if (path === "cfg.sol") { aplicarTema(); return; }
  if (path === "cfg.gpsLigado") { if (DB.cfg.gpsLigado) gpsLigar(); else gpsDesligar(); }
  if (RERENDER.indexOf(path) >= 0 && fim) { render(); return; }
  atualizarVivo();
}

/* ---------------------------------------------------------------- contadores */
function objContador(ns){
  const i = inspPor(S.inspId); if (!i) return null;
  if (ns === "pt") { const p = i.pontos[S.pontoIdx]; return p ? p.c : null; }
  if (ns === "cam") return i.caminhamento;
  return null;
}
function mudarContador(ns, k, novo, doTeclado){
  const i = inspPor(S.inspId), obj = objContador(ns); if (!obj) return;
  novo = Math.max(0, Math.min(9999, Math.round(num(novo))));
  const antes = num(obj[k]);
  if (novo === antes) return;
  if (novo) obj[k] = novo; else delete obj[k];
  if (ns === "cam") marcasDoCaminhamento(i, k, novo - antes);
  tocar(i); salvar();
  const inp = document.getElementById("ct-" + ns + "-" + k);
  if (inp) { if (!doTeclado) inp.value = novo; inp.classList.toggle("zero", !novo); }
  atualizarVivo();
}
function marcasDoCaminhamento(i, k, delta){
  if (delta > 0) {
    const f = gpsFresco(30000); if (!f) return;
    for (let n = 0; n < Math.min(delta, 30); n++) i.marcas.push({k:k, lat:+f.lat.toFixed(7), lon:+f.lon.toFixed(7), acc:Math.round(f.acc), t:Date.now(), fonte:f.fonte});
  } else if (delta < 0) {
    let falta = -delta;
    for (let j = i.marcas.length - 1; j >= 0 && falta > 0; j--) if (i.marcas[j].k === k) { i.marcas.splice(j, 1); falta--; }
  }
}
let rep = null;
document.addEventListener("pointerdown", e => {

    mudarContador(ct.dataset.ns, ct.dataset.k, num(obj[ct.dataset.k]) + d);
    rep.t = setTimeout(tick, rep.n > 8 ? 55 : 110);
  };
  rep.t = setTimeout(tick, 430);
  try { b.setPointerCapture(e.pointerId); } catch (x) {}
});
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => { if (rep) clearTimeout(rep.t); }));

/* ---------------------------------------------------------------- eventos de digitação */
document.addEventListener("input", e => {

let focoEm = 0;
function selecionarTudo(el){ try { el.select(); el.setSelectionRange(0, el.value.length); } catch (x) {} }
document.addEventListener("focusin", e => {

document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter" && el.dataset && el.dataset.pf) {      /* ponto fixo: desce na repetição */
    e.preventDefault();
    const todos = Array.from(document.querySelectorAll("#tela input[data-pf]"));
    const nl = Math.max.apply(null, todos.map(x => +x.dataset.li)) + 1;
    let li = +el.dataset.li + 1, j = +el.dataset.j;
    if (li >= nl) { li = 0; j += 1; }
    const alvo = todos.find(x => +x.dataset.li === li && +x.dataset.j === j);
    if (alvo) alvo.focus(); else el.blur();
    return;
  }
  if (e.key === "Enter" && el.classList && (el.classList.contains("ct-n") || el.id === "pt-aval")) {
    e.preventDefault();

async function acao(a, b, id){
  const i = inspPor(S.inspId);
  switch (a) {
    case "ir": {
      const para = b.dataset.para;
      if ((para === "mapa" || para === "rel" || para === "insp") && !i) { const r = inspMaisRecente(); if (r) { S.inspId = r.id; S.campoId = r.campoId; } }
      return ir(para);
    }
    case "voltar": return voltarPara(b.dataset.para);
    case "pf-rep-menos": {           /* v2.5: tirar a última repetição (apaga os valores dela, com confirmação) */
      if (!i) return;
      const n = pfReps(i); if (n <= 1) return;
      const pf = i.pontoFixo, chaves = Object.keys(pf).filter(k => Array.isArray(pf[k]));
      const cheias = chaves.filter(k => pf[k][n - 1] != null && pf[k][n - 1] !== "").length;
      if (cheias && !(await confirmar("Tirar a repetição " + n + "?", "Ela tem " + cheias + " valor(es) anotado(s), que serão apagados.", "Tirar"))) return;
      chaves.forEach(k => { if (pf[k].length >= n) pf[k].length = n - 1; });
      pf.reps = n - 1; tocar(i); salvar(); render();
      return;
    }
    case "renumerar": {            /* v2.5 (etapa 20): a nº 1 e 2 que eram a 4 e 5 */
      const x = inspPor(id) || inspPor(S.inspId); if (!x) return;
      return renumerarInsp(x);
    }
    case "hist-info": {
      const c = campoPor(S.campoId); if (!c) return;
      const hh = (c.historico || []).find(h => String(h.numero) === String(b.dataset.n) && h.data === b.dataset.d); if (!hh) return;
      const m = metDeHistorico(hh);
      return dialogo({titulo:"Inspeção nº " + hh.numero + " · " + dataBR(hh.data), texto:"Esta inspeção está no computador: foi lançada lá, ou feita noutra Caderneta que não mandou o arquivo para cá.\n\n" +
        "E.R. " + pct(m.er, 2) + " · F.F.P " + pct(m.ffp) + (m.classe ? " · " + m.classe.nome : "") +
        "\n\nEla entra na fase da curva deste campo. Para mudar os pontos dela, abra no PC (Contagens). Se ela foi feita numa Caderneta, o PC devolve a inspeção inteira no próximo arquivo de campos."});
    }
    case "ponto-nd": {             /* v2.5 (etapa 21): bloco ainda não despendoado */
      if (!i) return;
      if (inspTravada(i)) { aviso("Inspeção travada: toque em Editar para mudar"); return; }
      const p = i.pontos[S.pontoIdx]; if (!p) return;
      p.nd = !p.nd; if (!p.nd) delete p.nd;
      tocar(i); salvar(); render();
      aviso(p.nd ? "Ponto " + p.i + ": bloco não despendoado — fora do P.T." : "Ponto " + p.i + " volta a entrar no P.T.");
      return;
    }
    case "iso-t": case "iso-add": {           /* v2.5 (etapa 21): isolado por */
      const c = campoAtual(); if (!c) return;
      c.isoGlebas = Array.isArray(c.isoGlebas) ? c.isoGlebas : []; c.isoContratos = Array.isArray(c.isoContratos) ? c.isoContratos : [];
      if (a === "iso-add") {
        const v = normContrato((document.getElementById("iso-novo") || {}).value || "");
        if (!v) { aviso("Digite o código do contrato ao lado"); return; }
        if (!c.isoContratos.includes(v)) c.isoContratos.push(v);
      } else {
        const lst = b.dataset.t === "g" ? c.isoGlebas : c.isoContratos, v = b.dataset.v, k = lst.indexOf(v);
        if (k >= 0) lst.splice(k, 1); else lst.push(v);
      }
      c.isoEm = Date.now(); c.alterado = Date.now(); salvar(); render();
      return;
    }
    case "pf-linha": {             /* v2.5 (etapa 20): pôr/tirar linha de fêmea ou de macho */
      if (!i) return;
      const pf = i.pontoFixo, q = pfQtd(i), fem = b.dataset.t === "f", d = num(b.dataset.d);
      if (d > 0) { if (fem) pf.nf = Math.min(8, q.nf + 1); else pf.nm = Math.min(3, q.nm + 1); tocar(i); salvar(); render(); return; }
      const ks = fem ? ["F" + q.nf] : ["A", "B", "L1", "L2"].map(x => "M" + q.nm + "P-" + x);
      const cheias = ks.filter(k => pfTemDado(pf[k])).length;

      if (cheias && !(await confirmar("Tirar a linha " + nome + "?", "Ela tem valor anotado, que será apagado.", "Tirar"))) return;
      ks.forEach(k => { delete pf[k]; });
      if (fem) pf.nf = Math.max(1, q.nf - 1); else pf.nm = Math.max(1, q.nm - 1);
      tocar(i); salvar(); render(); aviso("Linha " + nome + " tirada");
      return;
    }
    case "pf-rep": {

      i.pontoFixo.reps = Math.min(8, pfReps(i) + 1); tocar(i); salvar(); render();
      const alvo = document.querySelector('#tela input[data-pf][data-li="0"][data-j="' + (i.pontoFixo.reps - 1) + '"]'); if (alvo) alvo.focus();

    case "novo-campo": {

function concluirPonto(){
  const i = inspPor(S.inspId); if (!i) return;
  const p = i.pontos[S.pontoIdx]; if (!p) return;
  const c = campoPor(i.campoId) || {};
  const av = plantasDoPonto(p, pppDo(c)), soma = somaPendoes(p);
  const seguir = () => {
    const primeira = !p.feito;
    p.feito = true;
    if (!p.t) p.t = Math.round(Date.now() / 1000);
    const pegou = (primeira || !p.gps) ? gpsNoPonto(p, p.gps && p.gps.fonte === "manual" ? false : true) : false;
    if (!pegou && !p.gps && (GPS.watch != null || GPS.sim)) {
      const alvo = p;
      gpsUmaVez(12000).then(f => { if (f && !alvo.gps) { gpsNoPonto(alvo, true); tocar(i); salvar(); } });
    }
    tocar(i); salvar(); vibrar();
    let prox = -1;
    for (let k = S.pontoIdx + 1; k < i.pontos.length; k++) if (!pontoFeito(i.pontos[k])) { prox = k; break; }
    if (prox < 0) prox = i.pontos.findIndex(x => !pontoFeito(x));
    const cbp = cbDoCampo(c, i.pontos.length);
    const txt = "Ponto " + p.i + " contado" + (p.gps ? " · ±" + Math.round(p.gps.acc || 0) + " m" : "") +
      (cbp && prox >= 0 ? " · Próximo: pule " + cbp.pularInt + " blocos (≈ " + fmtNum(cbp.metrosInt, 0) + " m)" : "");
    if (prox >= 0) { ir("ponto", {pontoIdx:prox}, {substituir:true}); aviso(txt); }
    else {
      if (!i.exemplo && !i.edicao) i.travada = true;      /* v2.4: concluída = travada */
      salvar();
      voltarPara("insp");
      /* o voltar de tela termina num evento do navegador (popstate), que fecha diálogo aberto:
         o convite para salvar a cópia só abre depois que a tela voltou */
      setTimeout(() => dialogo({titulo:"Todos os pontos contados",
        texto:"Salve uma cópia desta Caderneta fora do app" + (ehIOS() ? " (Compartilhar › Salvar em Arquivos)" : " (vai para a pasta Download)") +
              ". Se o celular quebrar ou os dados do navegador forem apagados, é ela que guarda as inspeções.",
        botoes:[{rotulo:"Depois", valor:null}, {rotulo:"Relatório", valor:"rel"}, {rotulo:"Salvar cópia", valor:"copia", classe:"pri"}]})
        .then(v => { if (v === "copia") salvarCopia(); else if (v === "rel") ir("rel"); }), 400);
    }
  };
  if (soma > av) {
    confirmar("A soma não fecha", "Os pendões anotados (" + soma + ") passam das plantas avaliadas (" + av + "). Concluir assim mesmo?", "Concluir").then(ok => { if (ok) seguir(); });
    return;
  }
  seguir();
}

async function fotosDaImpressao(el){
  /* espera as fotos carregarem antes de abrir a impressão (senão saem em branco) */
  await Promise.all([...el.querySelectorAll("img[data-foto]")].map(async im => {
    const id = im.dataset.foto;
    if (!URLS_FOTO[id]) { const r = await fotoGet(id); if (r && r.blob) URLS_FOTO[id] = URL.createObjectURL(r.blob); }

}

async function renumerarInsp(x){

    '<div class="f tudo"><input id="rn-n" inputmode="numeric" pattern="[0-9]*" value="' + esc(x.numero) + '" aria-label="Número certo da inspeção"></div>',
    botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Corrigir", valor:"ok", classe:"pri", coletar:veu => veu.querySelector("#rn-n").value}]});
  if (v == null) return;

/* v2.5 (etapa 20): inspeção que o PC tem (veio de uma Caderneta) e este celular não tem mais —
   celular trocado, Caderneta reinstalada ou aberta noutra pasta. Antes ela aparecia só como
   "do computador" e não abria; agora volta inteira (travada, já segura no PC). */
function apagadaAqui(id){
  return (DB.lixeira || []).some(x => x && x.dados && (x.dados.id === id || (Array.isArray(x.dados.inspecoes) && x.dados.inspecoes.some(y => y && y.id === id))));
}
function restaurarDoPC(lista){
  let n = 0;
  const meu = DB.usuario ? DB.usuario.codigo : "";
  (Array.isArray(lista) ? lista : []).forEach(e => {
    if (!e || !e.id || inspPor(String(e.id)) || apagadaAqui(String(e.id))) return;
    const cod = normContrato(e.contrato), gl = normGleba(e.gleba);
    const c = DB.campos.find(x => !x.exemplo && normContrato(x.codigo) === cod && normGleba(x.gleba) === gl && (!x.dono || x.dono === meu));
    if (!c) return;
    const alt = num(e.alterado) || Date.now();
    const i = normalizarInsp(Object.assign({}, e, {id:String(e.id), campoId:c.id, fotos:[], doPC:true,
      pontos:(e.pontos || []).map(p => Object.assign({}, p, {doPC:true})), historico:[], criado:alt}));
    delete i.contrato; delete i.gleba;
    Object.assign(i, {alterado:alt, enviadoEm:alt, seguroPC:alt, travada:true, autor:meu, aparelho:DB.aparelho});
    if (!i.representante && c.rc) i.representante = c.rc;
    if (!i.at && c.at) i.at = c.at;

  });

function fsaEnvio(){ return typeof window.showSaveFilePicker === "function" && !emVisualizador() && /^https?:$/.test(location.protocol); }

async function permissaoArq(h, modo){

    if (typeof h.queryPermission !== "function") return true;

async function gravarNoArquivo(h, texto){

async function enviarNuvem(trocar){
  if (!fsaEnvio()) return enviarAoPC("auto");

  const pac = pacoteParaPC(true, lista);

  if (!pac.inspecoes.length && !pac.campos.length && !(pac.registros || []).length && !(pac.eventos || []).length) {
    aviso("Nada para enviar: tudo já está seguro no PC"); return; }
  const texto = await textoProtegido(montarPacote(pac), true);
  if (texto == null) { aviso("Envio cancelado"); return; }
  let h = trocar ? null : await idbGet("kv", "nuvem-envio");
  if (!h) {

      (DB.nuvemInfo && DB.nuvemInfo.pasta ? " " + DB.nuvemInfo.pasta : " de troca do PC") + " e toque em Salvar. É só desta vez: depois a Caderneta grava direto nesse arquivo."});

  if (!ok) {

    const de = await dialogo({titulo:"Não deu para gravar na nuvem", texto:"O arquivo " + (h.name || "") + " não pôde ser regravado (o Drive pode ter tirado a permissão). Escolher a pasta de novo ou mandar pelo compartilhar?",
      botoes:[{rotulo:"Compartilhar", valor:"share"}, {rotulo:"Escolher a pasta", valor:"pasta", classe:"pri"}]});
    if (de === "share") return enviarAoPC("auto");
    if (de !== "pasta") return;

    if (!h) { aviso("Envio cancelado"); return; }
    try { await gravarNoArquivo(h, texto); } catch (e) { aviso("O navegador não conseguiu gravar nessa pasta. Use Enviar para o computador › Drive.", null, 7000); return; }
  }
  marcarEnviadas(pac.inspecoes);

  aviso("Gravado na nuvem (" + (h.name || nomeArqNuvem()) + ") · " + pac.inspecoes.length + (pac.inspecoes.length === 1 ? " inspeção" : " inspeções") + ". No PC: ⟳ Nuvem.");

async function receberNuvem(trocar){

/* Item 1: mandar campos (e as inspeções deles) para a Caderneta de um colega. Vai uma CÓPIA:
   quem recebe junta com o que tem — campo igual (mesmo id, ou mesmo contrato e gleba do mesmo
   dono) não duplica, e inspeção igual (mesmo id) junta os pontos: o contado lá fica, o vazio
   recebe o do arquivo. Inspeção recebida não vai para o PC de quem recebeu, a não ser que seja

async function compartilharCampos(idCampo){
  const meus = DB.campos.filter(c => !c.exemplo);

  const r = await dialogo({titulo:"Compartilhar com outra Caderneta",

      (temChave ? '<label class="chk"><input type="checkbox" id="cc-prot" checked> <span>Proteger com a chave de proteção (o colega vai precisar da mesma chave para abrir)</span></label>' : ""),
    botoes:[{rotulo:"Cancelar", valor:null}, {rotulo:"Compartilhar", valor:"ok", classe:"pri", coletar:veu => ({
      ids:[].map.call(veu.querySelectorAll(".cc-sel:checked"), x => x.value), insp:!!veu.querySelector("#cc-insp").checked, lim:!!veu.querySelector("#cc-lim").checked,
      prot:!!(veu.querySelector("#cc-prot") || {}).checked})}]});
  if (!r || !r.ids) return;
  if (!r.ids.length) { aviso("Marque pelo menos um campo"); return; }
  const pac = pacoteCompartilhado(r.ids, r.insp, r.lim);
  pac.fotos = await fotosDoPacote(pac.inspecoes);
  const env = montarPacote(pac, "celular-para-celular");

        (pac.inspecoes.length === 1 ? " inspeção" : " inspeções") + (e === "compartilhado" ? " compartilhados" : " salvos em arquivo"));
}
function pacoteCompartilhado(ids, comInsp, comLimite){
  const meu = DB.usuario ? DB.usuario.codigo : "", sel = new Set(ids);
  const campos = DB.campos.filter(c => sel.has(c.id) && !c.exemplo).map(c => {
    const x = Object.assign(clone(c), {dono:c.dono || meu});
    if (comLimite === false) { x.limite = null; x.limiteNome = ""; x.divisao = null; }
    return x;
  });
  const insps = comInsp ? DB.inspecoes.filter(i => sel.has(i.campoId) && !i.exemplo)
    .map(i => Object.assign(clone(i), {dono:((campoPor(i.campoId) || {}).dono) || meu})) : [];
  return {formato:FORMATO, versao:2, compartilhado:true, aparelho:DB.aparelho, usuario:DB.usuario,
    deAparelho:nomeAparelho(), campos:campos, inspecoes:insps};
}
function juntarPontosInsp(local, vinda, ppp){
  const velhos = local.pontos || [], novos = [];
  let mudou = false;
  const n = Math.max(velhos.length, (vinda.pontos || []).length);
  for (let k = 0; k < n; k++) {
    const v = velhos[k], p = (vinda.pontos || [])[k];
    if (v && v.feito) { novos.push(v); continue; }                 /* o contado aqui fica */
    if (p && p.feito) { novos.push(Object.assign({}, p, {c:Object.assign({}, p.c || {})})); mudou = true; continue; }
    novos.push(v || Object.assign(novoPonto(k + 1), p || {}));
    if (!v) mudou = true;
  }
  const idsF = new Set((local.fotos || []).map(f => f.id));
  (vinda.fotos || []).forEach(f => { if (f && f.id && !idsF.has(f.id)) { (local.fotos = local.fotos || []).push(clone(f)); mudou = true; } });
  if (mudou) local.pontos = novos;
  return mudou;
}
function juntarCompartilhado(d){
  const meu = DB.usuario ? DB.usuario.codigo : "";
  const de = (d.usuario && d.usuario.codigo) ? String(d.usuario.codigo) : "";
  const r = {campos:0, camposIguais:0, inspecoes:0, juntadas:0, limites:0};
  const mapaId = {};
  (d.campos || []).map(normalizarCampo).forEach(c => {
    if (!c.dono) c.dono = de || meu;
    if (c.dono === meu) c.dono = "";                                   /* era meu: volta a ser meu */
    let x = campoPor(c.id);
    if (!x) x = DB.campos.find(y => !y.exemplo && normContrato(y.codigo) === normContrato(c.codigo) &&
                                     normGleba(y.gleba) === normGleba(c.gleba) && (y.dono || "") === (c.dono || "")) || null;
    if (x) {
      mapaId[c.id] = x.id; r.camposIguais++;
      /* v2.5 (etapa 20): o limite (pivô/gleba) que veio vale se aqui não tem, ou se é outro */
      if (Array.isArray(c.limite) && c.limite.length && JSON.stringify(c.limite) !== JSON.stringify(x.limite || null)) {
        x.limite = c.limite; x.limiteNome = (c.limiteNome || "limite") + " (de " + (de || "colega") + ")";
        if (c.divisao && !x.divisao) x.divisao = c.divisao;
        x.alterado = Date.now(); r.limites++;
      }
      ["hibrido", "fazenda", "cooperante", "municipio", "pivo", "rc", "at", "proporcao", "area", "safra"].forEach(k => {
        if ((x[k] === "" || x[k] == null) && c[k] !== "" && c[k] != null) x[k] = c[k]; });
      if (c.caminho && c.caminho.forma && !(x.caminho && x.caminho.forma)) x.caminho = c.caminho;
      return;
    }
    if (Array.isArray(c.limite) && c.limite.length) r.limites++;
    DB.campos.push(c); mapaId[c.id] = c.id; r.campos++;
  });
  (d.inspecoes || []).map(normalizarInsp).forEach(i => {
    i.campoId = mapaId[i.campoId] || i.campoId;
    if (!campoPor(i.campoId)) return;
    const x = inspPor(i.id);
    if (!x) {
      delete i.dono;
      i.compartilhadaDe = de;
      i.enviadoEm = 0;
      const doCampo = campoPor(i.campoId), meuCampo = !doCampo.dono || doCampo.dono === meu;
      /* campo meu: a inspeção que o colega fez nele vai para o meu PC. Campo de outro: não vai,
         a não ser que eu a continue aqui. */
      i.seguroPC = meuCampo ? 0 : (i.alterado || Date.now());
      if (!meuCampo) i.travada = true;
      DB.inspecoes.push(i); r.inspecoes++;
      return;
    }
    if (juntarPontosInsp(x, i, pppDo(campoPor(x.campoId)))) { tocar(x); r.juntadas++; }
  });
  return r;
}
async function receberCompartilhado(d, nomeArq, silencioso){
  const de = (d.usuario && d.usuario.codigo) ? (d.usuario.nome || d.usuario.codigo) + " (" + d.usuario.codigo + ")" : "outra Caderneta";
  const nc = (d.campos || []).length, ni = (d.inspecoes || []).length;

        ".\n\nÉ uma cópia: campo que já está aqui não duplica, e inspeção que já está aqui junta os pontos (o que você contou fica; os pontos vazios recebem os do arquivo).",

    r.inspecoes + (r.inspecoes === 1 ? " inspeção nova" : " inspeções novas") + (r.juntadas ? ", " + r.juntadas + (r.juntadas === 1 ? " juntada" : " juntadas") + " com a daqui" : "") +
    (r.limites ? "; " + r.limites + (r.limites === 1 ? " limite" : " limites") + " de campo" : "") + ".";

}

/* ---------------------------------------------------------------- receber */
async function receberArquivo(){
  /* v2.5: sem filtro de tipo — o Drive/OneDrive entregam o .vana.json como "arquivo" (application/octet-stream)
     e, com o filtro, ele aparecia cinza e não dava para escolher */
  const arq = await escolherArquivo("");
  if (!arq) return;
  let d;
  try { d = JSON.parse(await lerTexto(arq)); } catch (e) { aviso("Esse arquivo não é do Vana (escolha o campos_para_caderneta.vana.json ou uma cópia da Caderneta)"); return; }
  return processarRecebido(d, arq.name || "arquivo");
}
/* v2.4: o que chegou do PC (arquivo ou Wi-Fi). silencioso = devolve o resumo em vez de mostrar */
async function processarRecebido(d, nomeArq, silencioso){
  if (d && d.formato === FORMATO_CRIPTO) {      /* v2.5: arquivo protegido — abre com a chave de proteção */
    const txt = await abrirProtegido(d);
    if (txt == null) return;
    try { d = JSON.parse(txt); } catch (e) { aviso("O arquivo protegido não pôde ser lido"); return; }
  }
  if (d && d.formato === FORMATO_LIC_CEL) return receberLicencaCelular(d, silencioso);     /* v2.5 item 8 (demo) */
  if (d && d.formato === FORMATO_VANA) {      /* v2.4: confere o pacote antes de usar qualquer coisa dele */

function estadioTexto(v){
  if (!v) return "";
  if (typeof v === "string") return v.trim();
  const sel = v.sel || [];
  const ns = sel.filter(s => REG_FOLHAS.indexOf(s) >= 0).map(s => parseInt(s, 10)).sort((a, b) => a - b);
  const partes = [];
  if (ns.length === 1) partes.push(ns[0] + " FOLHA" + (ns[0] > 1 ? "S" : "") + " PARA ABRIR PENDÃO");
  else if (ns.length > 1) partes.push("DE " + ns[0] + " A " + ns[ns.length - 1] + " FOLHAS PARA ABRIR PENDÃO");
  sel.filter(s => REG_FOLHAS.indexOf(s) < 0).forEach(s => partes.push(s.toUpperCase()));
  const txt = partes.join(" E "), extra = (v.txt || "").trim();
  return (txt + (txt && extra ? ", " : "") + extra).trim();
}

/* O PC (Arquivo › Trocar com o celular pelo Wi-Fi) mostra um QR com o endereço e a senha de 10 min.

const WIFI = {senha:"", base:"", bases:[]};
function lerEnderecoWifi(txt){
  const t = String(txt || "").trim();
  const m = t.match(/^(https?:\/\/)?([0-9a-zA-Z.\-]+)(:\d+)?\/?(?:#(.*))?$/);
  if (!m || !m[2]) return null;
  const q = new URLSearchParams(m[4] || "");
  const s = q.get("s") || "", k = q.get("k") || "";
  const base = (m[1] || "http://") + m[2] + (m[3] || "");
  /* v2.5: o QR traz os outros IPs do PC (&i=a,b): o app testa todos (VPN, placa virtual, cabo + Wi-Fi) */
  const outros = (q.get("i") || "").split(",").filter(ip => /^\d{1,3}(\.\d{1,3}){3}$/.test(ip)).map(ip => (m[1] || "http://") + ip + (m[3] || ""));
  return {base:base, bases:[base].concat(outros.filter(b => b !== base)), senha:/^\d{6}$/.test(s) ? s : "", chave:/^[A-Za-z2-7]{52}$/.test(k) ? k : ""};
}

async function lerQR(titulo){
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    aviso("Este celular não lê QR code aqui. Digite o que aparece no PC.", null, 6000); return null;
  }
  let det;
  try { det = new BarcodeDetector({formats:["qr_code"]}); } catch (e) { aviso("Este celular não lê QR code aqui. Digite o que aparece no PC.", null, 6000); return null; }
  let fluxo;
  try { fluxo = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false}); }
  catch (e) { aviso("Sem acesso à câmera. Digite o que aparece no PC.", null, 6000); return null; }
  let achou = null, parar = false;
  const fim = dialogo({titulo:titulo, html:'<video id="qr-video" playsinline muted style="width:100%;border-radius:12px;background:#000"></video>',
    botoes:[{rotulo:"Cancelar", valor:null}], aoAbrir:veu => {
      const v = veu.querySelector("#qr-video"); v.srcObject = fluxo; v.play().catch(() => {});
      const passo = async () => {
        if (parar) return;
        try { const r = await det.detect(v); if (r && r.length) { achou = r[0].rawValue; if (DLG.atual) DLG.atual(achou); return; } } catch (e) {}
        setTimeout(passo, 250);
      };

    }});
  const v = await fim; parar = true;

}
async function lerQrWifi(){

async function pedirWifi(caminho, init, base, tempo){
  base = base || WIFI.base;
  const url = base + caminho + (caminho.indexOf("?") >= 0 ? "&" : "?") + "s=" + encodeURIComponent(WIFI.senha);
  /* Chrome (acesso à rede local): o endereço do PC é da rede local (192.168…, 10…, 172.16–31…)
     ou do próprio aparelho (127…); o pedido diz qual é — é isso que faz o Chrome PERGUNTAR
     (sem a indicação, a página https é barrada calada, como "conteúdo misto"). */
  const host = (base.match(/^https?:\/\/([^:/]+)/) || [])[1] || "";
  const espaco = /^(127\.|localhost$)/.test(host) ? "loopback"
    : /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(host) ? "local" : "";
  const ctl = tempo ? new AbortController() : null, t0 = Date.now();
  const relogio = ctl ? setTimeout(() => ctl.abort(), tempo) : 0;
  let r;
  try {
    const op = Object.assign(espaco ? {targetAddressSpace:espaco} : {}, {cache:"no-store"}, ctl ? {signal:ctl.signal} : {}, init || {});
    try { r = await fetch(url, op); }
    catch (e) { if (!espaco || (e && e.name === "AbortError")) throw e; delete op.targetAddressSpace; r = await fetch(url, op); }
  }
  catch (e) {
    const x = new Error("Não consegui falar com o computador.");
    x.falha = e && e.name === "AbortError" ? "tempo" : (Date.now() - t0 < 1500 ? "barrado" : "rede");
    throw x;
  }
  finally { if (relogio) clearTimeout(relogio); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.erro) || ("O computador respondeu " + r.status));
  return j;
}
async function trocarWifi(){

/* v2.5: testa todos os endereços do PC ao mesmo tempo; o primeiro que responde é o certo.
   Se nenhum responde, junta o que se sabe para dizer ONDE está o bloqueio. */
async function permissaoRedeLocal(){
  for (const nome of ["local-network", "local-network-access"]) {
    try { const s = await navigator.permissions.query({name:nome}); return s.state; } catch (e) {}
  }
  return "";
}
async function acharPC(){
  const bases = (WIFI.bases && WIFI.bases.length ? WIFI.bases : [WIFI.base]).filter(Boolean);
  if (WIFI.base && bases.indexOf(WIFI.base) < 0) bases.unshift(WIFI.base);
  const falhas = [];
  const tentativas = bases.map(b => pedirWifi("/vana/ola", null, b, 6000).then(j => ({b, j}), e => {
    if (e && e.falha) { falhas.push({b, falha:e.falha}); throw e; }
    throw Object.assign(e || new Error("?"), {respondeu:true, b});     /* o PC respondeu (senha vencida etc.) */
  }));
  try {
    const {b, j} = await Promise.any(tentativas);
    WIFI.base = b; DB.cfg.wifiEnd = b;
    return j;
  } catch (agg) {
    const errs = (agg && agg.errors) || [];
    const respondeu = errs.find(x => x && x.respondeu);
    if (respondeu) throw respondeu;                                     /* falou com o PC: a mensagem dele vale */
    const perm = await permissaoRedeLocal();
    const err = new Error("Não consegui falar com o computador.");
    err.diag = {bases, falhas, perm, lna: "targetAddressSpace" in Request.prototype || perm !== ""};
    throw err;
  }
}

    (antes.length ? ". As inspeções já feitas continuam com a gleba delas." : ".");
  if (!(await confirmar("Aplicar a divisão?", txt, "Aplicar"))) return;

  const dv = Object.assign({}, par, {em, origem:"celular"});

  if (!todas.length) { el.innerHTML = '<p class="peq mut" style="margin:0">As cópias aparecem depois de alguns minutos de uso (uma a cada 3 minutos, guarda as 15 últimas).</p>'; return; }
  el.innerHTML = '<p class="peq mut" style="margin:0">Guardadas automaticamente neste aparelho. Se algo sumir, volte para uma delas.</p><div class="lista">' + todas.map(x =>
    '<div class="item" style="cursor:default"><div class="t1" style="font-size:16px">' + quandoTxt(x.t) + '</div><div class="t2">' + x.campos + " campo(s) · " + x.insps + " inspeção(ões)" + (x.motivo ? " · " + esc(x.motivo) : "") +
    '</div><div class="dir"><button class="btn peq" data-a="restaurar-copia" data-t="' + x.t + '">Voltar a esta</button></div></div>').join("") + "</div>";
}
async function restaurarCopia(t){
  const x = (await idbTodos("copias")).find(y => y.t === t); if (!x) { aviso("Cópia não encontrada"); return; }
  if (!(await confirmar("Voltar para a cópia de " + quandoTxt(t) + "?", "O que está agora no aparelho é guardado numa nova cópia antes.", "Voltar a esta"))) return;
  await fazerCopia("antes de restaurar");
  try {
    const cfg = DB.cfg, chaves = DB.chaves, chaveAtual = DB.chaveAtual, regrasCif = DB.regrasCif, licCel = DB.licencaCel, rel = DB.relogioMax;
    let d = JSON.parse(x.txt);
    if (d && d.cifrado) d = JSON.parse(await decifrarLocal(d));
    aplicar(d); DB.cfg = Object.assign({}, CFG_PADRAO, DB.cfg, {tema:cfg.tema, sol:cfg.sol});
    if (!Object.keys(DB.chaves || {}).length) { DB.chaves = chaves; DB.chaveAtual = chaveAtual; }
    DB.regrasCif = regrasCif || null; DB.licencaCel = licCel || DB.licencaCel || null; DB.relogioMax = Math.max(num(rel), num(DB.relogioMax));
  }
  catch (e) { aviso("Cópia ilegível"); return; }
  migrarRegras().catch(() => {});
  salvar(); S.campoId = S.inspId = null; PILHA.length = 0; ir("campos", null, {substituir:true}); aviso("Cópia restaurada");
}

/* main.js */
/* =====================================================================
   INÍCIO — abre os dados, cria o exemplo na primeira vez, liga o modo
   instalável (sem internet) quando o app vem de um endereço https.
   ===================================================================== */
function semearExemplo(){
  const cLat = -15.6010, cLon = -56.0970, areaPivo = 100;      // v2.5: exemplo num ponto neutro
  const r = Math.sqrt(areaPivo * 1e4 / Math.PI), P = projetor(cLat, cLon);
  const meia = [];
  for (let k = 0; k <= 48; k++) { const a = Math.PI + Math.PI * k / 48; const q = P.ll(r * Math.cos(a), r * Math.sin(a)); meia.push([+q.lon.toFixed(7), +q.lat.toFixed(7)]); }
  const c = novoCampo();
  Object.assign(c, {codigo:"EXEMPLO", gleba:"G1", safra:"27", pivo:"3", fazenda:"Fazenda Exemplo", cooperante:"Cooperante Exemplo",
    municipio:"Primavera do Leste", estado:"MT", area:50, areaPivo:areaPivo, hibrido:"HIBRIDO 1234PRO3", proporcao:"4:1", machos:2,
    rc:"Representante Exemplo", at:"AT Exemplo", lat:cLat, lon:cLon, limite:[meia], limiteNome:"exemplo (meio pivô)",
    exemplo:true, origem:"celular", obs:"Campo fictício para mostrar o app. Apague em Ajustes › Apagar os dados de exemplo."});
  DB.campos.push(c);
  const plano = planoDoCampo(c, 15);
  const ruido = (p, k) => ({lat:p.lat + Math.sin(k * 7.3) * 0.00003, lon:p.lon + Math.cos(k * 5.1) * 0.00003});
  const montar = (numero, diasAtras, contagens, feitos, cam, extra) => {
    const i = novaInspecao(c);
    const t0 = Math.round(Date.now() / 1000) - diasAtras * 86400 - 3 * 3600;
    Object.assign(i, {numero:numero, data:somaDias(hojeISO(), -diasAtras), hora:"07:40", exemplo:true, enviadoEm:0,
      tempo:"Sol", temperatura:"Alta", ventos:"Leves"}, extra || {});
    i.trilha = [];
    i.pontos.forEach((p, k) => {
      if (k >= feitos) return;
      p.c = Object.assign({}, contagens[k]); p.feito = true; p.t = t0 + k * 240;
      const g = ruido(plano.pontos[k], k + numero);
      p.gps = {lat:+g.lat.toFixed(7), lon:+g.lon.toFixed(7), acc:4 + (k % 4), t:p.t * 1000, fonte:"exemplo"};
      const ant = k ? ruido(plano.pontos[k - 1], k - 1 + numero) : {lat:g.lat - 0.0004, lon:g.lon - 0.0006};
      for (let s = 1; s <= 6; s++) { const f = s / 6; i.trilha.push([+(ant.lat + (g.lat - ant.lat) * f).toFixed(7), +(ant.lon + (g.lon - ant.lon) * f).toFixed(7), p.t - 200 + s * 30, 5, 0]); }
    });
    i.caminhamento = cam;
    const ult = i.pontos[Math.max(0, feitos - 1)].gps;
    if (cam.PNP) i.marcas.push({k:"PNP", lat:ult.lat + 0.0002, lon:ult.lon - 0.0001, acc:5, t:Date.now(), fonte:"exemplo"});
    if (cam.RPF) i.marcas.push({k:"RPF", lat:ult.lat - 0.0001, lon:ult.lon + 0.0002, acc:5, t:Date.now(), fonte:"exemplo"});
    i.alterado = Date.now() - diasAtras * 86400000;
    DB.inspecoes.push(i);
    return i;
  };
  const er1 = [14, 18, 22, 19, 25, 27, 21, 24, 30, 26, 23, 28, 20, 25, 22], m11 = [22, 25, 30, 28, 31, 35, 27, 29, 33, 30, 26, 32, 24, 28, 27], m21 = [6, 8, 7, 9, 10, 12, 8, 7, 11, 9, 8, 10, 6, 7, 9];
  const c1 = er1.map((v, k) => ({ER:v, M1P:m11[k], M2P:m21[k], PNNP:[1, 0, 2, 0, 1, 0, 0, 1, 0, 2, 0, 1, 0, 0, 1][k], PBNP:[0, 1, 0, 0, 1, 0, 1, 0, 0, 0, 1, 0, 0, 1, 0][k], PNP:k === 6 ? 1 : 0}));
  montar(1, 2, c1, 15, {PNNP:12, PBNP:5, PNP:1}, {situacao:"Em despendoamento", proxima:hojeISO()});
  const er2 = [38, 44, 41, 47, 52, 49, 45, 50, 46], m12 = [46, 52, 49, 55, 58, 53, 51, 56, 54], m22 = [18, 21, 19, 24, 26, 22, 20, 25, 23];
  const c2 = er2.map((v, k) => ({ER:v, M1P:m12[k], M2P:m22[k], PNNP:[0, 1, 0, 2, 0, 1, 0, 0, 1][k], TCNP:[1, 0, 0, 0, 1, 0, 0, 0, 0][k], PSENP:k === 5 ? 1 : 0, PNP:k === 3 ? 1 : 0}));
  const i2 = montar(2, 0, c2, 9, {PNNP:7, PSENP:3, PNP:2, RPF:1}, {situacao:"Pleno florescimento", proxima:somaDias(hojeISO(), 2), hora:agoraHHMM()});
  return i2;
}

function montarCasca(){
  const abas = [["campos", "campos", "Campos"], ["agenda", "agenda", "Agenda"], ["contagem", "contagem", "Contagem"], ["mapa", "mapa", "Mapa"], ["rel", "relatorio", "Relatório"], ["dados", "dados", "Dados"], ["ajustes", "ajustes", "Ajustes"]];
  document.getElementById("abas").innerHTML = abas.map(([a, i, r]) => '<button type="button" data-aba="' + a + '" aria-current="false">' + ico(i) + "<span>" + r + "</span>" + (a === "dados" ? '<span class="bolinha" hidden></span>' : "") + "</button>").join("");
  document.getElementById("marca").outerHTML = MARCA;
  document.getElementById("b-sol").innerHTML = ico("sol");
  if (TESTE) {
    const tn = document.querySelector(".topo-nome");
    if (tn) tn.insertAdjacentHTML("beforeend", '<span class="selo-teste">TESTE</span>');
  }
}

function registrarPWA(){
  if (emVisualizador() || !/^https?:$/.test(location.protocol)) return;
  const cab = document.head || document.getElementsByTagName("head")[0];
  if (cab && !document.querySelector('link[rel="manifest"]')) { const l = document.createElement("link"); l.rel = "manifest"; l.href = ARQ_MANIFEST; cab.appendChild(l); }
  if (cab && !document.querySelector('link[rel="apple-touch-icon"]')) { const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = "icone-180.png"; cab.appendChild(l); }
  if (!("serviceWorker" in navigator)) return;
  let recarregando = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (recarregando) return; recarregando = true; descarregar(); location.reload(); });
  navigator.serviceWorker.register(TESTE ? "sw.js?teste=1" : "sw.js").then(reg => {
    /* v2.5: antes de oferecer, confere a ASSINATURA da Orshu na versão nova (feito por esta versão,
       que já está instalada e é de confiança) */
    const oferecer = async w => {
      const c = await conferirAtualizacao();
      if (c.ok) { aviso("Versão nova do app pronta (assinada pela Orshu)", {rotulo:"Atualizar", fn:() => w.postMessage("pular-espera")}, 15000); return; }
      const v = await dialogo({titulo:"Atualização NÃO conferida", texto:"A versão nova publicada no site não tem a assinatura da Orshu (" + c.motivo + "). " +
        "Pode ser um erro na publicação ou alguém mexeu no site. Não atualize e avise quem publica a Caderneta. Os seus dados continuam no aparelho.",
        botoes:[{rotulo:"Atualizar mesmo assim", valor:"sim"}, {rotulo:"Não atualizar", valor:null, classe:"pri"}]});
      if (v === "sim") w.postMessage("pular-espera");
    };
    if (reg.waiting && navigator.serviceWorker.controller) oferecer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) oferecer(w); });
    });
  }).catch(() => {});
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); instalarEvt = e; if (S.tela === "dados") render(); });
window.addEventListener("appinstalled", () => { instalarEvt = null; aviso("App instalado"); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (["insp", "ponto", "mapa"].indexOf(S.tela) >= 0 && DB.cfg.gpsLigado && !GPS.sim) gpsLigar();
    manterTelaAcesa(S.tela === "ponto" || S.tela === "insp");
    pintarTopo();
  } else if (!GPS.sim) { gpsParar(); if (GPS.estado !== "negado" && GPS.estado !== "bloqueado") GPS.estado = GPS.ult ? GPS.estado : "parado"; }
});

async function iniciar(){
  SV.ok = testarArmazenamento() ? null : false;
  if (SV.ok === false) SV.erro = "aba anônima ou dados do site bloqueados";
  pedirPersistencia();
  let semeado = false;
  let local = lerLocal();
  PIN.meta = pinMeta();
  if (local && local.cifrado) {                  /* v2.5: dados criptografados — PIN primeiro */
    await telaPin(true);
    try { local = JSON.parse(await decifrarLocal(local)); }
    catch (e) {                                  /* nunca seguir sem os dados: não sobrescreve o que está guardado */
      document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">Os dados deste aparelho não abriram (arquivo danificado). Nada foi apagado. Feche e abra o app de novo; se continuar, recupere pela cópia enviada ao PC.</p>';
      return;
    }
  }
  /* v2.4: dados da versão anterior (2.3 ou 2.0) — guarda como estavam antes de atualizar */
  const anterior = local && local.versaoApp !== VERSAO_APP ? {txt:JSON.stringify(local), versao:local.versaoApp || "anterior",
    campos:(local.campos || []).length, insps:(local.inspecoes || []).length} : null;
  if (local) aplicar(local);
  else {
    const v1 = lerV1();
    if (v1 && aplicar(v1)) setTimeout(() => aviso("Dados da Caderneta anterior trazidos para esta versão"), 600);
  }
  if (!DB.campos.length && !DB.inspecoes.length && !DB.cfg.semExemplo) { semearExemplo(); semeado = true; }
  DB.inspecoes.forEach(retravar);           /* edição deixada aberta: trava ao reabrir o app */
  montarCasca();
  aplicarTema();
  try { history.replaceState({n:0}, ""); } catch (e) {}
  render();
  idb = await idbAbrir();
  SV.idb = !!idb;
  if (idb) {
    if (PIN.meta) idbPut("kv", JSON.stringify(PIN.meta), "pin");
    const txt = await idbGet("kv", "db");
    if (txt) {
      try {
        let d = JSON.parse(txt);
        if (d && d.cifrado && !PIN.dek) {        /* o navegador limpou só o localStorage: o PIN guardado no IndexedDB abre */
          if (!PIN.meta) { try { PIN.meta = JSON.parse((await idbGet("kv", "pin")) || "null"); } catch (e) {} }
          if (PIN.meta) { await telaPin(true); pinMetaGravar(PIN.meta); }
        }
        if (d && d.cifrado) {
          try { d = JSON.parse(await decifrarLocal(d)); }
          catch (e) {                            /* não abriu: nunca gravar por cima da cópia criptografada */
            document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">Os dados guardados neste aparelho estão protegidos por PIN e não abriram. Nada foi apagado. Feche e abra o app de novo; se continuar, recupere pela cópia enviada ao PC.</p>';
            return;
          }
        }
        const temDados = (d.campos || []).some(c => !c.exemplo) || (d.inspecoes || []).some(i => !i.exemplo);
        DB.relogioMax = Math.max(num(DB.relogioMax), num(d.relogioMax));      /* v2.5 (etapa 20): o maior horário já visto */
        if (temDados && (semeado || (d.salvoEm || 0) > (DB.salvoEm || 0))) {
          aplicar(d); aplicarTema(); render(); aviso("Dados recuperados da cópia interna do aparelho");
        }
      } catch (e) {}
    }
    if (anterior) {
      await idbPut("copias", {t:Date.now() - 1, motivo:"antes de atualizar para a " + VERSAO_APP + " (dados da versão " + anterior.versao + ", como estavam)",
                              campos:anterior.campos, insps:anterior.insps, txt:anterior.txt});
      setTimeout(() => aviso("Caderneta atualizada para a " + VERSAO_APP + ". Os dados de antes ficaram guardados em Dados › Cópias."), 700);
    }
    DB.versaoApp = VERSAO_APP;
    gravarAgora();
    migrarRegras().catch(() => {});                    /* v2.5 (etapa 20): critérios do PC, cifrados */
    carregarLicencaCelular().catch(() => {});
    setTimeout(() => { assinarPendentes(true); }, 2500);
    fazerCopia("ao abrir o app");
  } else { DB.versaoApp = VERSAO_APP; if (semeado || !local || anterior) gravarAgora(); }
  registrarPWA();
  setInterval(pintarTopo, 30000);
  if (copiaAtrasada()) setTimeout(() => aviso("Mais de 24 h sem cópia de segurança fora do app", {rotulo:"Salvar cópia", fn:salvarCopia}, 9000), 1500);
}
iniciar();
